<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3f3f5">
<title>Áreas · Daily System</title>
<link rel="expect" href="#ready" blocking="render">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f3f3f5;
    --surface: #ffffff;
    --surface-2: #f4f4f7;
    --border: #e9e9ee;
    --ink: #17171c;
    --ink-2: #4c4c56;
    --ink-3: #8b8b94;
    --accent: #5546e8;
    --good: #0a7d0a;
    --good-bg: #e5f6e5;
    --warn: #9a6700;
    --warn-bg: #fdf3dc;
    --bad: #d03b3b;
    --bad-bg: #fdecec;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(23,23,40,0.04), 0 8px 24px rgba(23,23,40,0.05);
  }

  html, body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 22px 18px 60px; }
  .page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 15px; font-weight: 650; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 12px; }
  .empty-note { color: var(--ink-3); font-size: 13px; }
  .note { font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--ink-3); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); }
  td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--border); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .ok { color: var(--good); }
  .ko { color: var(--bad); }
  .muted { color: var(--ink-3); }

  .item { padding: 11px 0; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: none; }
  .item .head { display: flex; align-items: baseline; gap: 10px; }
  .item .name { font-size: 14.5px; font-weight: 600; }
  .badge { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); }
  .badge.activo, .badge.publicado, .badge.ingreso { color: var(--good); background: var(--good-bg); }
  .badge.pausado, .badge.editando, .badge.grabado, .badge.grabar, .badge.editar { color: var(--warn); background: var(--warn-bg); }
  .badge.guion { color: var(--ink-2); background: var(--surface-2); }
  .badge.lista { color: var(--accent); background: var(--accent-soft); }
  .badge.idea { color: var(--ink-3); background: var(--surface-2); }
  /* campos de la ficha (gancho, cuerpo, caption…): como la pizarra de Notas, sin caja ni scroll propio.
     El texto crece con lo que se escribe (field-sizing; donde no lo hay, creceCampos) */
  .sp-campo { margin: 16px 0 18px; }
  .sp-campo > label { display: block; font-size: 12px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 2px; cursor: text; }
  .sp-campo textarea, .sp-campo input { width: 100%; background: transparent; border: 0; border-radius: 0; color: var(--ink); font-family: inherit; font-size: 14px; line-height: 1.7; padding: 2px 0; }
  .sp-campo textarea { resize: none; overflow: hidden; field-sizing: content; min-height: calc(1.7em + 4px); }
  .sp-campo textarea::placeholder, .sp-campo input::placeholder { color: var(--placeholder); }
  .sp-campo textarea:focus, .sp-campo input:focus { outline: none; }
  .sp-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 600px) { .sp-grid2 { grid-template-columns: 1fr; } }
  .hoy-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
  .hoy-item:last-child { border-bottom: 0; }
  .hoy-item.link { cursor: pointer; }
  .hoy-item .t { font-weight: 550; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hoy-item .m { color: var(--ink-3); font-size: 12px; flex-shrink: 0; white-space: nowrap; }
  .hoy-item .badge { flex-shrink: 0; }
  .hoy-item .sp { flex: 1; }
  .hoy-tomas { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 8px 26px; line-height: 1.5; }
  .hoy-tomas span { color: var(--ink-3); }
  .cap-prev { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; margin: 6px 0 0 26px; line-height: 1.45; }
  /* cerebro: bandeja e ideas */
  .cap-form { display: flex; gap: 8px; margin: 10px 0 14px; }
  .cap-form input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--ink); font-family: inherit; font-size: 14px; padding: 9px 11px; }
  .cap-form input:focus { outline: none; border-color: var(--accent); }
  .cap-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .cap-row:last-child { border-bottom: 0; }
  .cap-txt { flex: 1; min-width: 0; font-size: 13.5px; color: var(--ink); white-space: pre-wrap; line-height: 1.45; }
  .cap-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .cap-acts { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 46%; }
  .cap-acts .btn-mini { padding: 4px 9px; font-size: 12px; }
  .cap-acts .btn-mini .tic { width: 12px; height: 12px; margin: 0; }
  @media (max-width: 600px) { .cap-row { flex-direction: column; gap: 6px; } .cap-acts { max-width: none; justify-content: flex-start; } }
  .badge.decision { color: var(--accent); background: var(--accent-soft); }
  .badge.aprendizaje { color: var(--good); background: var(--good-bg); }
  .badge.revision { color: var(--warn); background: var(--warn-bg); }
  .badge.nota { color: var(--ink-3); background: var(--surface-2); }
  /* agenda: chips por tipo */
  .pieza-chip.rec { background: var(--surface); color: var(--ink-2); border: 1px solid var(--border); }
  .pieza-chip.gymok { background: var(--good-bg); color: var(--good); border: 1px solid transparent; }
  .ag-leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); margin-top: 10px; }
  .ag-leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  /* agenda: cada pieza sin publicar con el color de su misión (atracción azul · nutrición naranja · conversión violeta);
     sin misión, el rosa de siempre; lo publicado sigue en verde tachado */
  .pieza-chip.reel.m-atraccion { background: rgba(59,130,246,0.13); color: #2f74e0; border: 1px solid rgba(59,130,246,0.3); }
  .pieza-chip.reel.m-nutricion { background: rgba(234,122,24,0.14); color: #c2620c; border: 1px solid rgba(234,122,24,0.32); }
  .pieza-chip.reel.m-conversion { background: rgba(139,92,246,0.14); color: #7c4ddb; border: 1px solid rgba(139,92,246,0.32); }
  :root[data-theme="negro"] .pieza-chip.reel.m-atraccion, :root[data-theme="azul"] .pieza-chip.reel.m-atraccion { color: #6aa5ff; }
  :root[data-theme="negro"] .pieza-chip.reel.m-nutricion, :root[data-theme="azul"] .pieza-chip.reel.m-nutricion { color: #ffa65c; }
  :root[data-theme="negro"] .pieza-chip.reel.m-conversion, :root[data-theme="azul"] .pieza-chip.reel.m-conversion { color: #b69cff; }
  /* agenda: navegación (Hoy ‹ › título · Mes | Semana) y vista semanal */
  .ag-nav { flex-wrap: wrap; row-gap: 8px; }
  .ag-nav .ag-hoy { width: auto; padding: 0 10px; font-size: 12px; font-weight: 550; color: var(--ink-2); }
  .ag-nav .ag-vista { margin: 0 0 0 auto; }
  .ag-nav .ag-vista button { width: auto; height: auto; }
  .semcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .semcal .ag-dia { min-height: 250px; border: 1px solid var(--hairline); border-radius: 11px; background: var(--surface-2); padding: 7px 7px 9px; min-width: 0; }
  .semcal .ag-dia.hoy { outline: 2px solid var(--accent); outline-offset: 1px; }
  .semcal .ag-dia-h { display: flex; align-items: baseline; gap: 5px; font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .semcal .ag-dia-h b { font-size: 17px; color: var(--ink); font-weight: 650; letter-spacing: -0.01em; }
  .semcal .ag-dia.pasado .ag-dia-h b { color: var(--ink-3); }
  .semcal .pieza-chip { white-space: normal; overflow-wrap: anywhere; font-size: 11.5px; line-height: 1.35; padding: 5px 7px; margin-top: 6px; }
  .semcal .pieza-chip small { display: block; font-size: 10px; font-weight: 500; opacity: 0.75; margin-top: 1px; }
  @media (max-width: 700px) {
    .semcal { grid-template-columns: 1fr; gap: 0; }
    .semcal .ag-dia { min-height: 0; display: flex; gap: 12px; border: 0; border-bottom: 1px solid var(--hairline); border-radius: 0; background: none; padding: 10px 2px; }
    .semcal .ag-dia:last-child { border-bottom: 0; }
    .semcal .ag-dia.hoy { outline: none; }
    .semcal .ag-dia.hoy .ag-dia-h b { text-decoration: underline; text-underline-offset: 3px; }
    .semcal .ag-dia-h { width: 46px; flex-shrink: 0; flex-direction: column; gap: 0; }
    .semcal .ag-dia-b { flex: 1; min-width: 0; }
    .semcal .ag-dia-b > .pieza-chip:first-child { margin-top: 0; }
    .semcal .ag-dia-b:empty::after { content: "—"; color: var(--ink-3); font-size: 12px; }
  }
  .badge.cerrado, .badge.gasto { color: var(--ink-3); background: var(--surface-2); }
  .item .nota { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .item .meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

  .entry { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .entry:last-child { border-bottom: none; }
  .entry .f { color: var(--ink-3); font-size: 11.5px; flex-shrink: 0; width: 76px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .entry .t { color: var(--ink-2); }

  .fin-total { display: flex; gap: 24px; margin-bottom: 14px; flex-wrap: wrap; }
  .fin-total .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
  .fin-total .v { font-size: 22px; font-weight: 650; }

  .subnav { display: flex; gap: 6px; overflow-x: auto; margin: -2px 0 14px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .subnav button {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); color: var(--ink-3);
    border-radius: 999px; padding: 7px 15px; font-size: 12.5px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .subnav button.active { color: var(--bg); border-color: var(--ink); background: var(--ink); font-weight: 600; }

  .meter { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
  .meter .fill { height: 100%; background: var(--accent); border-radius: 999px; }

  select.month {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    border-radius: 10px; padding: 7px 11px; font-family: inherit; font-size: 13px; margin-bottom: 12px;
  }
  .btn-mini {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2);
    border-radius: 10px; padding: 6px 13px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .btn-mini:hover { color: var(--ink); border-color: var(--ink-3); }
  .row-click { cursor: pointer; }
  .row-click:hover .name { color: var(--accent); }
  .cat-badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-3); margin-left: 8px; }

  /* transacciones estilo tracker: grupos por día + fila con avatar */
  .dia-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5px; letter-spacing: 0.08em; font-weight: 650; color: var(--ink-3);
    text-transform: uppercase; padding: 16px 0 7px; border-bottom: 1px solid var(--hairline);
    font-variant-numeric: tabular-nums;
  }
  .mov { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--hairline); cursor: pointer; border-radius: 10px; }
  .mov:hover { background: var(--surface-2); margin: 0 -8px; padding-left: 10px; padding-right: 10px; }
  .mov .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2);
    border: 1px solid var(--hairline); display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: var(--ink-2); flex-shrink: 0;
  }
  .mov .minfo { flex: 1; min-width: 0; }
  .mov .mn { font-size: 13.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .mmeta { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .mov .cat-chip { font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; flex-shrink: 0; }
  .mov .mimp { text-align: right; flex-shrink: 0; }
  .mov .mv { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mov .mv.pos { color: var(--good); }
  .mov .maprox { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .catg-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 13px; }
  .catg-row .cn { width: 128px; flex-shrink: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .catg-row .cbar { flex: 1; height: 8px; background: var(--hairline); border-radius: 99px; overflow: hidden; }
  .catg-row .cbar i { display: block; height: 100%; background: var(--serie-1); border-radius: 99px; }
  .catg-row .cv { flex-shrink: 0; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px; min-width: 96px; text-align: right; }
  .catg-row .cv small { color: var(--ink-3); font-weight: 500; }
  .ok .tic, .ko .tic { width: 13px; height: 13px; vertical-align: -2px; }
  .btn-mini .tic { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }
  .card .sub { font-size: 12.5px; color: var(--ink-3); margin: -6px 0 12px; }

  .btn-mini.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-mini.primary:hover { color: var(--surface); opacity: 0.92; } /* nunca #fff fijo: en el tema negro el botón es claro */
  .btn-mini .tic { width: 13px; height: 13px; vertical-align: -2px; margin-right: 3px; }

  .ov {
    position: fixed; inset: 0; background: rgba(23,23,30,0.35); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .ov.show { display: flex; }
  .modal-card {
    background: var(--surface); border-radius: 18px; padding: 20px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 60px rgba(23,23,40,0.25);
  }
  .modal-card h3 { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .modal-card label { display: block; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.07em; margin: 13px 0 5px 2px; }
  .modal-card input, .modal-card select, .modal-card textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    color: var(--ink); font-family: inherit; font-size: 14px; padding: 9px 11px;
  }
  .modal-card textarea { resize: vertical; min-height: 54px; }
  .modal-card input:focus, .modal-card select:focus, .modal-card textarea:focus { outline: none; border-color: var(--accent); }
  .modal-card .fila2 { display: grid; grid-template-columns: 1fr 84px; gap: 10px; }
  .modal-card .btns { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
  .modal-card .btns button {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
    border-radius: 10px; padding: 8px 15px; font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .modal-card .btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  .icon-pick { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .ip {
    height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-2); padding: 0;
  }
  .ip:hover { border-color: var(--border-strong); color: var(--ink); }
  .ip.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .ip .tic { width: 16px; height: 16px; }
  .gcover .tic { width: 24px; height: 24px; }
  .picon { display: inline-flex; width: 22px; height: 22px; margin: 6px 2px 0 0; flex-shrink: 0; }
  .picon .tic { width: 22px; height: 22px; }

  /* proyectos: galería */
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .gcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    overflow: hidden; box-shadow: var(--shadow); cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .gcard:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(23,23,40,0.07), 0 16px 34px rgba(23,23,40,0.10); }
  .gcover { height: 58px; display: flex; align-items: center; padding: 0 16px; font-size: 24px; }
  .gbody { padding: 12px 16px 14px; }
  .gbody .t { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
  .gbody .t .badge { margin-left: auto; flex-shrink: 0; }
  .gbody .d { font-size: 12px; color: var(--ink-3); margin-bottom: 9px; line-height: 1.4; min-height: 17px; }
  .gfoot { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); }
  .subdots { display: flex; gap: 3px; }
  .sd { width: 7px; height: 7px; border-radius: 50%; background: var(--mark-border); opacity: 0.55; }
  .sd.on { background: var(--ok); opacity: 1; }
  .gfoot .right { margin-left: auto; text-align: right; }
  .stale { color: #c05b1d; }
  .money { font-weight: 700; color: var(--good); }
  .badge.en_cola, .badge.pausado { background: var(--warn-bg); color: var(--warn); }
  .badge.en_curso { background: var(--good-bg); color: var(--good); }
  .badge.hecho { background: var(--surface-2); color: var(--ink-3); }
  .badge.en_espera { background: var(--warn-bg); color: var(--warn); }
  .badge.en_ejecucion { background: var(--accent-soft); color: var(--accent); }
  .t-chip.rec { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  /* iconos de estado y banderita de prioridad */
  .est-ic { display: inline-flex; align-items: center; justify-content: center; }
  .est-ic svg { width: 17px; height: 17px; display: block; }
  .est-pendiente, .est-por_definir { color: var(--ink-3); }
  .est-en_ejecucion { color: var(--accent); }
  .est-en_espera, .est-falta_revision { color: var(--warn); }
  .est-completado { color: var(--ok); }
  .t-est, .t-flag { width: 24px; height: 24px; border: none; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 7px; }
  .t-est:hover, .t-flag:hover { background: var(--surface-2); }
  .t-flag svg { width: 14px; height: 14px; }
  .pr-urgente { color: var(--bad); }
  .pr-alta { color: var(--warn); }
  .pr-normal { color: var(--accent); }
  .pr-baja { color: var(--ink-3); opacity: 0.75; }
  .pick-menu { position: fixed; z-index: 300; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow); padding: 6px; min-width: 200px; }
  .pick-menu .pm-g { font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); padding: 8px 9px 3px; }
  .pick-menu .pm-i { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; color: var(--ink-2); font-family: inherit; font-size: 13px; font-weight: 550; padding: 7px 9px; border-radius: 8px; cursor: pointer; text-align: left; }
  .pick-menu .pm-i:hover { background: var(--surface-2); color: var(--ink); }
  .pick-menu .pm-i.on { color: var(--ink); }
  .pick-menu .pm-i .est-ic svg { width: 16px; height: 16px; }

  /* proyectos: página */
  .phead { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 4px; }

  }

  .pki .l { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }

  .subs .s { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .subs .s:last-of-type { border-bottom: none; }
  .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--mark-border); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: #fff; transition: background 0.18s, border-color 0.18s; }
  .ck.on { background: var(--ok); border-color: var(--ok); }

  .subs .s.done { color: var(--ink-3); }

  .subs .s .meta { margin-left: auto; flex-shrink: 0; }
  .pnotas { font-size: 13px; color: var(--ink-2); line-height: 1.65; white-space: pre-wrap; }

  /* área contenido: reto + piezas */
  .reto-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .reto-head .dia { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .reto-head .dia small { font-size: 14px; color: var(--ink-3); font-weight: 500; }
  .reto-head .fechas { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
  .reto-bar { height: 8px; background: var(--hairline); border-radius: 99px; overflow: hidden; }
  .reto-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; }
  .metas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .meta-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .meta-card .top { display: flex; align-items: baseline; gap: 8px; }
  .meta-card .n { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .meta-card .n small { font-size: 15px; color: var(--ink-3); font-weight: 500; }
  .meta-card .tag { margin-left: auto; font-size: 10.5px; font-weight: 650; padding: 2px 9px; border-radius: 999px; }
  .tag.ok { background: var(--good-bg); color: var(--good); }
  .tag.ko { background: var(--bad-bg); color: var(--bad); }
  .meta-card .lbl { font-size: 12px; color: var(--ink-3); margin: 2px 0 10px; }
  .mbar { height: 6px; background: var(--hairline); border-radius: 99px; margin-bottom: 8px; position: relative; }
  .mbar i { display: block; height: 100%; border-radius: 99px; }
  .mbar .esperado { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.45; border-radius: 2px; }
  .ritmo { font-size: 11.5px; color: var(--ink-3); }
  .ritmo b { color: var(--ink); }
  /* checklist 180 min del reto */
  .cal.reto { grid-template-columns: repeat(7, 30px); gap: 7px; }
  .cal.reto .c { width: 30px; height: 30px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cal.reto .c.futuro { cursor: default; }
  .cal.reto .c.full { background: var(--accent); border-color: var(--accent); }
  .cal.reto .c.full::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; }
  .cal.reto .c.part { background: var(--accent-soft); border-color: var(--accent-soft); font-size: 8.5px; color: var(--accent); font-weight: 700; }
  .hoy-line { display: flex; align-items: center; gap: 14px; margin: 6px 0 16px; }
  .hoy-line .n { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .hoy-line .n small { font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .hbar { flex: 1; height: 8px; background: var(--hairline); border-radius: 99px; overflow: hidden; }
  .hbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; }
  .hoy-line .falta { font-size: 12px; color: var(--ink-3); flex-shrink: 0; }

  /* calendario de publicación */
  .pubcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .pubcal .cd { font-size: 10px; color: var(--ink-3); text-align: center; font-weight: 650; padding-bottom: 2px; }
  .pubcal .day { min-height: 74px; border: 1px solid var(--hairline); border-radius: 11px; background: var(--surface-2); padding: 5px 6px; cursor: pointer; min-width: 0; }
  .pubcal .day:hover { border-color: var(--border-strong); }
  .pubcal .day .dn { font-size: 10px; color: var(--ink-3); font-weight: 600; }
  .pubcal .day.hoy { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pubcal .day.off { opacity: 0.35; cursor: default; }
  .pieza-chip {
    display: block; margin-top: 4px; font-size: 10px; font-weight: 600; border-radius: 6px;
    padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .pieza-chip.reel { background: rgba(227,57,130,0.12); color: #e33982; border: 1px solid rgba(227,57,130,0.25); }
  .pieza-chip.yt { background: rgba(208,59,59,0.12); color: #d03b3b; border: 1px solid rgba(208,59,59,0.25); }
  .pieza-chip.pub { background: var(--good-bg); color: var(--good); border: 1px solid transparent; text-decoration: line-through; }
  .mes-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .mes-nav b { font-size: 13.5px; }
  .mes-nav button {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-3); cursor: pointer; font-family: inherit;
  }
  .mes-nav button:hover { color: var(--ink); }
  .leyenda { font-size: 11.5px; color: var(--ink-3); margin-top: 10px; display: flex; gap: 14px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .pieza { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
  .pieza:last-child { border-bottom: none; }
  .tipo-chip { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tipo-chip.reel { background: rgba(227,57,130,0.13); color: #e33982; }
  .tipo-chip.yt { background: rgba(208,59,59,0.13); color: #d03b3b; }
  .tipo-chip .tic { width: 14px; height: 14px; }
  .pieza .t { font-weight: 550; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pieza .badge { margin-left: auto; }
  .pieza .f { font-size: 11.5px; color: var(--ink-3); flex-shrink: 0; width: 44px; text-align: right; }
  .pieza.link { cursor: pointer; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 12px; transition: background 0.12s; }
  .pieza.link:hover { background: var(--surface-2); }
  .thumb {
    width: 56px; height: 34px; border-radius: 8px; flex-shrink: 0; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; position: relative;
    background: var(--surface-2); border: 1px solid var(--hairline);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.ph-reel { background: linear-gradient(135deg, rgba(227,57,130,0.22), rgba(227,57,130,0.09)); color: #e33982; border-color: rgba(227,57,130,0.18); }
  .thumb.ph-yt { background: linear-gradient(135deg, rgba(208,59,59,0.22), rgba(208,59,59,0.09)); color: #d03b3b; border-color: rgba(208,59,59,0.18); }
  .thumb .tic { width: 15px; height: 15px; }
  .pieza .mets { font-size: 11px; color: var(--ink-3); flex-shrink: 0; }
  .pieza .mets b { color: var(--ink-2); font-weight: 600; }

  /* modal de detalle de pieza */
  /* panel lateral de pieza, estilo notion */
  /* el ancho se gobierna con left (interpolable): lateral = 480px pegado a la derecha, full = hasta el sidebar */
  .side-panel {
    position: fixed; top: 0; right: 0; bottom: 0; left: max(0px, calc(100% - 480px));
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: -18px 0 50px rgba(0, 0, 0, 0.13); z-index: 120;
    display: flex; flex-direction: column;
    visibility: hidden; pointer-events: none; transform: translateX(103%);
    transition: transform 0.34s cubic-bezier(.3,.9,.3,1), left 0.44s cubic-bezier(.3,.9,.3,1),
                background-color 0.34s ease, box-shadow 0.34s ease, border-color 0.34s ease,
                visibility 0s linear 0.34s;
  }
  .side-panel.show {
    visibility: visible; pointer-events: auto; transform: translateX(0);
    transition: transform 0.34s cubic-bezier(.3,.9,.3,1), left 0.44s cubic-bezier(.3,.9,.3,1),
                background-color 0.34s ease, box-shadow 0.34s ease, border-color 0.34s ease, visibility 0s;
  }
  /* expandido = una pantalla más de la app, no un documento flotante: mismo fondo, sin borde ni sombra */
  .side-panel.full { left: var(--sbw); background: var(--bg); border-left-color: transparent; box-shadow: none; }
  @media (max-width: 900px) { .side-panel, .side-panel.full { left: 0; } }
  /* ruta (breadcrumb) arriba a la izquierda, siempre visible en los paneles */
  .sp-ruta { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); min-width: 0; overflow: hidden; margin-right: 8px; }
  .sp-ruta .rlink { color: var(--ink-3); cursor: pointer; white-space: nowrap; padding: 3px 5px; border-radius: 6px; }
  .sp-ruta .rlink:hover { color: var(--ink); background: var(--surface-2); }
  .sp-ruta .sep { opacity: 0.45; }
  .sp-ruta .act { color: var(--ink-2); font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #subPanel.full .sp-body { max-width: 960px; }
  #tareaPanel { z-index: 130; } /* puede abrirse encima del panel de subproyecto */
  #tareaPanel.full .sp-body { max-width: 760px; }
  .sp-estbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; color: var(--ink); font-family: inherit; font-size: 13.5px; font-weight: 550; padding: 5px 9px; border-radius: 8px; cursor: pointer; }
  .sp-estbtn:hover { background: var(--surface-2); }
  .sp-estbtn .est-ic svg { width: 16px; height: 16px; }
  .sp-estbtn svg.fl { width: 14px; height: 14px; }
  /* el contenido entra un pelín después, con fade + deslizamiento sutil */
  .sp-top, .sp-body { opacity: 0; transform: translateY(10px); transition: opacity 0.26s ease 0.1s, transform 0.32s cubic-bezier(.3,.9,.3,1) 0.1s; }
  .side-panel.show .sp-top, .side-panel.show .sp-body { opacity: 1; transform: none; }
  .sp-top { display: flex; align-items: center; gap: 4px; padding: 10px 12px; flex-shrink: 0; }
  .sp-top button, .sp-top a {
    background: transparent; border: none; color: var(--ink-3); cursor: pointer;
    width: 32px; height: 32px; border-radius: 9px; display: inline-flex; align-items: center;
    justify-content: center; font-family: inherit; text-decoration: none;
  }
  .sp-top button:hover, .sp-top a:hover { background: var(--surface-2); color: var(--ink); }
  .sp-top #spBorrar:hover { color: var(--bad); background: var(--bad-bg, var(--surface-2)); }
  .sp-top .tic { width: 16px; height: 16px; }
  .sp-body { flex: 1; overflow-y: auto; padding: 4px 30px 50px; }
  .sp-body-inner { max-width: 660px; }
  .sp-cols { display: block; }
  /* el vídeo solo se ve en pantalla completa: dos columnas que arrancan en la misma línea */
  .sp-player-wrap { display: none; }
  .side-panel.full .sp-cols { display: flex; gap: 44px; align-items: flex-start; }
  .side-panel.full .sp-body-inner { flex: 1; min-width: 0; }
  .side-panel.full .sp-player-wrap {
    display: block; width: 42%; max-width: 540px; flex-shrink: 0;
    position: sticky; top: 12px;
    animation: spColIn 0.5s cubic-bezier(.3,.9,.3,1) 0.14s backwards; /* entra tras el ensanche */
  }
  @keyframes spColIn { from { opacity: 0; transform: translateX(22px); } }
  .side-panel.full .sp-body-inner > * { animation: spReflow 0.4s ease 0.05s backwards; }
  @keyframes spReflow { from { opacity: 0.55; } }
  .sp-player { border-radius: 12px; overflow: hidden; background: #000; position: relative; }
  .sp-player.horiz { aspect-ratio: 16 / 9; }
  .sp-player.reel { aspect-ratio: 9 / 16; max-width: 300px; margin-left: auto; }
  /* dispositivos: el reel vive en un móvil, el YouTube en un monitor */
  .device.phone {
    position: relative; max-width: 292px; margin-left: auto;
    background: #0d0d12; border-radius: 46px; padding: 11px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.09), 0 22px 48px rgba(0,0,0,0.35);
  }
  .device.phone .sp-player.reel { max-width: none; margin: 0; border-radius: 36px; }
  .device.phone::before { /* isla dinámica */
    content: ""; position: absolute; top: 21px; left: 50%; transform: translateX(-50%);
    width: 84px; height: 23px; background: #0d0d12; border-radius: 13px; z-index: 2;
  }
  .device.phone::after { /* botón lateral */
    content: ""; position: absolute; right: -2.5px; top: 118px; width: 3px; height: 62px;
    border-radius: 2px; background: #2a2a33;
  }
  .device.tv .dev-screen {
    background: #0d0d12; border-radius: 16px; padding: 10px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.09), 0 22px 48px rgba(0,0,0,0.3);
  }
  .device.tv .sp-player.horiz { border-radius: 8px; }
  .device.tv .dev-neck { width: 14px; height: 22px; margin: 0 auto; background: linear-gradient(#16161d, #23232c); }
  .device.tv .dev-base { width: 150px; height: 9px; margin: 0 auto; background: #23232c; border-radius: 6px; }
  @media (max-width: 900px) { .device.phone { margin: 0 auto; } }
  .sp-player iframe, .sp-player video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; }
  .sp-player.cargando {
    display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--ink-3); font-size: 12.5px;
  }
  .sp-player.cargando .tic { width: 18px; height: 18px; }
  @media (max-width: 900px) {
    .side-panel.full .sp-cols { display: block; }
    .side-panel.full .sp-player-wrap { width: 100%; position: static; margin-bottom: 16px; }
  }
  .sp-title {
    width: 100%; border: none; background: transparent; color: var(--ink); font-family: inherit;
    font-size: 23px; font-weight: 700; letter-spacing: -0.02em; padding: 2px 0 12px;
  }
  .sp-title:focus { outline: none; }
  .sp-title::placeholder { color: var(--placeholder); }
  .sp-props { border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); padding: 8px 0; margin-bottom: 16px; }
  .sp-prop { display: flex; align-items: center; gap: 12px; padding: 3px 0; min-height: 34px; }
  .sp-prop > label { width: 116px; font-size: 12.5px; color: var(--ink-3); flex-shrink: 0; }
  .sp-prop .osui-dw { flex: 1; }
  .sp-prop input, .sp-prop select {
    flex: 1; width: 100%; background: transparent; border: 1px solid transparent; color: var(--ink);
    font-family: inherit; font-size: 13.5px; padding: 6px 9px; border-radius: 8px;
  }
  .sp-prop input:hover { background: var(--surface-2); }
  .sp-prop input:focus { outline: none; background: var(--surface-2); }
  .sp-prop .static { font-size: 13.5px; color: var(--ink-2); padding: 6px 9px; }
  .sp-sec { font-size: 12px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.07em; margin: 4px 0 2px; display: flex; align-items: center; gap: 10px; }
  .pz-tools { display: inline-flex; gap: 2px; }
  .pz-tools button {
    background: transparent; border: none; color: var(--ink-3); cursor: pointer; font-family: inherit;
    font-size: 11px; font-weight: 650; padding: 3px 7px; border-radius: 6px; letter-spacing: 0; text-transform: none;
  }
  .pz-tools button:hover { background: var(--surface-2); color: var(--ink); }
  .pz-tools button u { text-underline-offset: 2px; }
  /* pizarra: crece con el contenido, sin contenedor ni scroll propio */
  .sp-pizarra {
    min-height: 90px; padding: 6px 0 40px; outline: none;
    font-size: 14px; line-height: 1.7; color: var(--ink); word-wrap: break-word;
  }
  .sp-pizarra:empty::before { content: attr(data-placeholder); color: var(--placeholder); pointer-events: none; }
  .sp-pizarra h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; margin: 16px 0 4px; }
  .sp-pizarra h3 { font-size: 15.5px; font-weight: 650; margin: 12px 0 3px; }
  .sp-pizarra u { text-underline-offset: 3px; }
  .msg { font-size: 13px; margin-top: 10px; color: var(--ink-2); white-space: pre-wrap; }
  .msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
  .filtros { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filtros button { font-size: 11.5px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); font-weight: 550; border: none; cursor: pointer; font-family: inherit; }
  .filtros button.on { background: var(--ink); color: var(--bg); }

  /* calendario de entrenos (gym) */
  .cal { display: inline-grid; grid-template-columns: repeat(7, 24px); gap: 6px; }
  .cal .cd { font-size: 9.5px; color: var(--ink-3); text-align: center; font-weight: 600; }
  .cal .c { width: 24px; height: 24px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--hairline); }
  .cal .c.on { background: var(--ok); border-color: var(--ok); }
  .cal .c.hoy { outline: 2px solid var(--accent); outline-offset: 1.5px; }
  .cal .c.corto { background: var(--mark-border); border-color: var(--mark-border); }
  .cal .c.futuro { opacity: 0.3; }

  /* gym: tracker de series y editor de rutina */
  .ejercicio { padding: 12px 0; border-bottom: 1px solid var(--hairline); }
  .ejercicio:last-child { border-bottom: none; padding-bottom: 2px; }
  .ej-head { display: flex; align-items: baseline; gap: 10px; }
  .ej-nombre { font-size: 13.5px; font-weight: 600; }
  .ej-obj { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .ej-nota { font-size: 11px; color: var(--warn); margin-top: 2px; }
  .ej-ref { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .fuera-head { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 2px; }
  .fuera-head .t { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 650; }
  .fuera-head .d { font-size: 11.5px; color: var(--ink-3); }
  .series { display: flex; flex-direction: column; gap: 7px; margin-top: 9px; }
  .serie-row { display: flex; align-items: center; gap: 5px; }
  .serie-row .sn { font-size: 10px; color: var(--ink-3); font-weight: 650; width: 18px; text-align: right; }
  .serie-row input {
    width: 58px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
    color: var(--ink); font-family: inherit; font-size: 13px; padding: 7px 8px; text-align: center;
  }
  .serie-row input:focus { outline: none; border-color: var(--accent); }

<script>
const TABS = [
  { id: "tareas", label: "Tareas" },
  { id: "sueno", label: "Sueño" },
  { id: "gym", label: "Gym" },
  { id: "nutricion", label: "Nutrición" },
  { id: "proyectos", label: "Proyectos" },
  { id: "contenido", label: "Contenido" },
  // 12 oct 2026 — estructura nueva (Resumen · Áreas · Cerebro). Instagram reutiliza las vistas de contenido (piezas + calendario, sin reto).
  { id: "agenda", label: "Agenda" },
  { id: "instagram", label: "Instagram" },
  { id: "skool", label: "Skool" },
  { id: "bandeja", label: "Bandeja" },
  { id: "ideas", label: "Ideas" },
  { id: "notas", label: "Notas" },
  { id: "finanzas", label: "Finanzas" },
  // qué partes salen en la barra lo decide cada cuenta (config.modulos, ver OS_MODULOS en ui.js); las demás siguen vivas por URL
];
const FIN_SUBS = [
  { id: "resumen", label: "Resumen" },
  { id: "cuentas", label: "Cuentas" },
  { id: "transacciones", label: "Transacciones" },
  { id: "suscripciones", label: "Suscripciones" },
  { id: "ahorro", label: "Ahorro" },
];
let STATE = null, DASH = null, lastPayload = "";
let active = "proyectos", finSub = "resumen", finMes = new Date().toISOString().slice(0, 7);

let proySub = null; // id de proyecto abierto (#proyectos/<id>)
let contSub = "reto"; // pestaña de contenido (#contenido/reto | #contenido/piezas)
let contFiltro = "todas";
let ideasFiltro = "nueva";
let calMes = new Date().toISOString().slice(0, 7);
let agVista = "mes"; // agenda: #agenda/mes | #agenda/semana (solo #agenda = la última que se usó)
let calSemana = null; // lunes de la semana que enseña la vista semanal
let gymSub = "resumen"; // #gym/resumen | #gym/tracker | #gym/rutina
function parseHash() {
  const [a, s] = location.hash.slice(1).split("/");
  if (a === "agenda") {
    let ultima = null;
    try { ultima = localStorage.getItem("os_agenda_vista"); } catch (e) {}
    agVista = ["mes", "semana"].includes(s) ? s : ultima === "semana" ? "semana" : "mes";
  }
  active = TABS.some((t) => t.id === a) ? a : "proyectos";
  finSub = FIN_SUBS.some((x) => x.id === s) ? s : "resumen";
  proySub = a === "proyectos" && s ? decodeURIComponent(s) : null;
  contSub = a === "instagram"
    ? (s === "referencias" ? "ganchos" : ["tablero", "edicion", "ganchos", "vision"].includes(s) ? s : "tablero") // referencias = nombre antiguo de Ganchos; cola y grabacion (quitadas el 24 oct) caen en el tablero
    : (a === "contenido" && ["reto", "piezas", "calendario"].includes(s) ? s : "reto");
  gymSub = a === "gym" && ["resumen", "tracker", "rutina"].includes(s) ? s : "resumen";
}
parseHash();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const eur = (n) => Number(n || 0).toLocaleString("es", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + "€";

function renderTitle() {
  const t = TABS.find((t) => t.id === active);
  $("areaTitle").textContent = t ? t.label : "Áreas";
}

function lastDays(n) {
  return (DASH?.serie || []).slice(-n).reverse();
}

function boolCell(v) {
  if (v === true) return `<span class="ok">${OSIcons.check}</span>`;
  if (v === false) return `<span class="ko">${OSIcons.cerrar}</span>`;
  return `<span class="muted">–</span>`;
}

function journalCard(area) {
  // 12 oct 2026: los apuntes salen de todas las pantallas («no lo encuentro útil»). El journal sigue
  // existiendo en el estado y por MCP (append_journal); solo deja de pintarse. Se conserva el código por si vuelve.
  return "";
  const entries = (STATE.journal || []).filter((e) => e.area === area).slice(-10).reverse();
  const head = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
    <h2>Apuntes</h2>
    <button class="btn-mini" onclick="nuevoApunte('${area}')">${OSIcons.nueva} Apunte</button>
  </div>`;
  if (!entries.length) return `<div class="card">${head}<div class="empty-note">Sin apuntes de esta área todavía.</div></div>`;
  return `<div class="card">${head}` + entries.map((e) =>
    `<div class="entry"><span class="f">${e.fecha}</span><span class="t">${esc(e.texto)}</span></div>`
  ).join("") + `</div>`;
}

async function nuevoApunte(area) {
  const texto = await OSUI.prompt("Nuevo apunte", "", { label: "Qué pasó", placeholder: "una línea de contexto", ok: "Añadir" });
  if (!texto || !texto.trim()) return;
  if (!Array.isArray(STATE.journal)) STATE.journal = [];
  STATE.journal.push({ fecha: isoLocal(new Date()), area, texto: texto.trim() });
  saveClave("journal");
}

async function registrarSueno() {
  const hoy = isoLocal(new Date());
  const prev = STATE.days?.[hoy]?.sueno_horario || {};
  const r = await OSUI.form({
    titulo: "Registrar sueño",
    texto: "Las horas dormidas se calculan solas y cuentan para el hábito de sueño de ese día.",
    campos: [
      { id: "fecha", label: "Día en que te levantaste", tipo: "date", valor: hoy },
      { id: "acostar", label: "Me acosté a las", tipo: "time", valor: prev.acostar || "23:00" },
      { id: "levantar", label: "Me levanté a las", tipo: "time", valor: prev.levantar || "06:00" },
    ],
    ok: "Guardar",
  });
  if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(r.fecha || "")) return;
  const parseHora = (s) => {
    const m = String(s || "").match(/^(\d{1,2}):(\d{1,2})$/);
    if (!m) return null;
    const h = Number(m[1]), min = Number(m[2]);
    return h > 23 || min > 59 ? null : h * 60 + min;
  };
  const acostar = parseHora(r.acostar), levantar = parseHora(r.levantar);
  if (acostar === null || levantar === null) return;
  let mins = levantar - acostar;
  if (mins <= 0) mins += 24 * 60; // se acostó antes de medianoche
  const horas = Math.round((mins / 60) * 10) / 10;
  // days es el histórico completo y el POST lo sustituye entero: refrescar antes de tocar
  try {
    const fresh = await (await fetch("/api/state", { credentials: "include" })).json();
    if (fresh && fresh.days) STATE.days = fresh.days;
  } catch (e) {}
  if (!STATE.days) STATE.days = {};
  const d = STATE.days[r.fecha] || {};
  d.senales = { ...(d.senales || {}), sueno: horas };
  d.sueno_horario = { acostar: r.acostar, levantar: r.levantar };
  STATE.days[r.fecha] = d;
  saveClave("days");
}

async function registrarPeso() {
  const kgs = (STATE.peso || []).slice().sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  const ultimo = kgs[kgs.length - 1];
  const input = await OSUI.prompt("Registrar peso", ultimo ? ultimo.kg : "", { label: "kg de hoy", tipo: "number", ok: "Guardar" });
  if (input === null || String(input).trim() === "") return;
  const kg = Number(String(input).replace(",", "."));
  if (!Number.isFinite(kg) || kg <= 0) return;
  if (!Array.isArray(STATE.peso)) STATE.peso = [];
  const hoy = isoLocal(new Date());
  const existente = STATE.peso.find((p) => p.fecha === hoy);
  if (existente) existente.kg = kg;
  else STATE.peso.push({ fecha: hoy, kg });
  saveClave("peso");
}

/* guarda una clave top-level del estado y recarga */
async function saveClave(clave) {
  try {
    const res = await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ [clave]: STATE[clave] }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    load();
  } catch (e) {
    alert("No se guardó: " + e.message);
  }
}

/* ---------- tareas: estados (como un gestor de proyectos) + prioridades ---------- */
const ESTADOS_TAREA_UI = [
  { v: "pendiente", l: "Pendiente", g: "Sin iniciar" },
  { v: "por_definir", l: "Por definir", g: "Activa" },
  { v: "en_ejecucion", l: "En ejecución", g: "Activa" },
  { v: "en_espera", l: "En espera", g: "Activa" },
  { v: "falta_revision", l: "Falta revisión", g: "Terminada" },
  { v: "completado", l: "Completado", g: "Cerrada" },
];
const PRIOS_UI = [
  { v: "urgente", l: "Urgente", d: "Bloqueante. Atender hoy." },
  { v: "alta", l: "Alta", d: "Importante esta semana." },
  { v: "normal", l: "Normal", d: "Por defecto." },
  { v: "baja", l: "Baja", d: "Sin urgencia." },
];
const PRIO_ORDEN = { urgente: 0, alta: 1, normal: 2, baja: 3 };

const _svgEst = (inner) => `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${inner}</svg>`;
const _circ = (extra = "") => `<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"${extra}/>`;
const EST_ICONS = {
  pendiente: _svgEst(_circ(' stroke-dasharray="3.5 3.4" stroke-linecap="round"')),
  por_definir: _svgEst(_circ()),
  en_ejecucion: _svgEst(_circ() + `<path d="M 12 3 A 9 9 0 0 1 21 12 L 12 12 Z" fill="currentColor"/>`),
  en_espera: _svgEst(_circ() + `<path d="M 12 3 A 9 9 0 0 1 12 21 L 12 12 Z" fill="currentColor"/>`),
  falta_revision: _svgEst(_circ() + `<path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`),
  completado: _svgEst(`<circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.15"/>` + _circ() + `<path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`),
};
const iconEstado = (v) => `<span class="est-ic est-${v}">${EST_ICONS[v] || EST_ICONS.pendiente}</span>`;
const flagSVG = (relleno) => `<svg viewBox="0 0 24 24" fill="${relleno ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21v-16"/><path d="M5 6a4 4 0 0 1 6 0a4 4 0 0 0 6 0v6a4 4 0 0 1 -6 0a4 4 0 0 0 -6 0"/></svg>`;

function estadoTarea(t) {
  if (t.estado === "terminada") return "completado";
  return ESTADOS_TAREA_UI.some((e) => e.v === t.estado) ? t.estado : (t.hecha ? "completado" : "pendiente");
}
function prioTarea(t) { return PRIOS_UI.some((p) => p.v === t.prioridad) ? t.prioridad : "normal"; }

/* menú anclado genérico (estado/prioridad) */
let pickMenu = null;
function cierraPick() {
  if (!pickMenu) return;
  pickMenu.remove();
  pickMenu = null;
  document.removeEventListener("mousedown", pickFuera, true);
}
function pickFuera(e) { if (pickMenu && !pickMenu.contains(e.target)) cierraPick(); }
function abreMenu(anchor, html) {
  cierraPick();
  pickMenu = document.createElement("div");
  pickMenu.className = "pick-menu";
  pickMenu.innerHTML = html;
  document.body.appendChild(pickMenu);
  const r = anchor.getBoundingClientRect();
  let y = r.bottom + 6;
  if (y + pickMenu.offsetHeight > innerHeight - 10) y = r.top - pickMenu.offsetHeight - 6;
  pickMenu.style.left = Math.max(8, Math.min(r.left, innerWidth - pickMenu.offsetWidth - 10)) + "px";
  pickMenu.style.top = Math.max(8, y) + "px";
  document.addEventListener("mousedown", pickFuera, true);
  return pickMenu;
}

function guardaTareasCtx(ctx) {
  if (ctx === "panel") {
    postClaves({ tareas: STATE.tareas });
    renderTareaPanel();
    if (tareaSel?.origen === "sub") renderSubPanel();
  } else if (ctx === "sub") {
    postClaves({ tareas: STATE.tareas });
    renderSubPanel();
  } else {
    saveClave("tareas");
  }
}

function pickEstado(ev, id, ctx) {
  ev.stopPropagation();
  const t = (STATE.tareas || []).find((x) => String(x.id) === String(id));
  if (!t) return;
  const cur = estadoTarea(t);
  let html = "", g = "";
  for (const e of ESTADOS_TAREA_UI) {
    if (e.g !== g) { g = e.g; html += `<div class="pm-g">${g}</div>`; }
    html += `<button class="pm-i${e.v === cur ? " on" : ""}" data-v="${e.v}">${iconEstado(e.v)}<span>${e.l}</span>${e.v === cur ? OSIcons.check : ""}</button>`;
  }
  abreMenu(ev.currentTarget, html).querySelectorAll(".pm-i").forEach((b) => {
    b.onclick = () => { cierraPick(); aplicaEstadoTarea(t, b.dataset.v); guardaTareasCtx(ctx); };
  });
}

function pickPrioridad(ev, id, ctx) {
  ev.stopPropagation();
  const t = (STATE.tareas || []).find((x) => String(x.id) === String(id));
  if (!t) return;
  const cur = prioTarea(t);
  const html = PRIOS_UI.map((p) =>
    `<button class="pm-i${p.v === cur ? " on" : ""}" data-v="${p.v}"><span class="est-ic pr-${p.v}">${flagSVG(p.v !== "baja")}</span><span>${p.l}<small>${p.d}</small></span>${p.v === cur ? OSIcons.check : ""}</button>`).join("");
  abreMenu(ev.currentTarget, html).querySelectorAll(".pm-i").forEach((b) => {
    b.onclick = () => { cierraPick(); t.prioridad = b.dataset.v; guardaTareasCtx(ctx); };
  });
}

function aplicaEstadoTarea(t, estado) {
  t.estado = estado;
  t.hecha = estado === "completado"; // derivada, compat
  if (t.hecha) t.hecha_el = t.hecha_el || isoLocal(new Date());
  else delete t.hecha_el;
}

async function nuevaTarea() {
  const titulo = await OSUI.prompt("Nueva tarea", "", { label: "Qué hay que hacer", placeholder: "Llamar a María por el proyecto", ok: "Crear" });
  if (!titulo || !titulo.trim()) return;
  if (!Array.isArray(STATE.tareas)) STATE.tareas = [];
  const t = { id: "t" + Date.now(), titulo: titulo.trim(), prioridad: "normal", creada: isoLocal(new Date()) };
  aplicaEstadoTarea(t, "pendiente");
  STATE.tareas.push(t);
  await postClaves({ tareas: STATE.tareas });
  renderContent();
  abrirTarea(t.id); // el detalle se completa en el panel
}

/* ---------- panel lateral de tarea (mismo sistema que piezas/subproyectos) ---------- */
let tareaSel = null; // { id, origen: "area"|"sub" }
let tareaTimer = null, tareaDirty = false;

function guardaTareaQuiet() {
  tareaDirty = true;
  clearTimeout(tareaTimer);
  tareaTimer = setTimeout(flushTareas, 500);
}
async function flushTareas() {
  clearTimeout(tareaTimer);
  if (!tareaDirty) return;
  tareaDirty = false;
  await postClaves({ tareas: STATE.tareas });
}

function abrirTarea(id, origen = "area") {
  tareaSel = { id, origen };
  const el = $("tareaPanel");
  renderTareaPanel();
  if (!el.classList.contains("show")) {
    void el.offsetWidth;
    el.classList.add("show");
  }
}

async function cerrarTarea() {
  await flushTareas();
  const el = $("tareaPanel");
  el.classList.remove("show", "full");
  const origen = tareaSel?.origen;
  tareaSel = null;
  setTimeout(() => { if (!tareaSel) el.innerHTML = ""; }, 360);
  if (origen === "sub") renderSubPanel(); else load();
}

function renderTareaPanel() {
  if (!tareaSel) return;
  const t = (STATE.tareas || []).find((x) => String(x.id) === String(tareaSel.id));
  if (!t) return;
  const el = $("tareaPanel");
  const est = estadoTarea(t);
  const pr = prioTarea(t);
  const eInfo = ESTADOS_TAREA_UI.find((e) => e.v === est) || {};
  const pInfo = PRIOS_UI.find((x) => x.v === pr) || {};
  const proys = (STATE.proyectos || []).filter((p) => !["cerrado", "entregado"].includes(p.estado) || String(p.id) === String(t.proyecto));
  const proy = t.proyecto ? (STATE.proyectos || []).find((x) => String(x.id) === String(t.proyecto)) : null;
  const subs = proy?.subs || [];
  const dISO = (f) => (f ? f.split("-").reverse().join("/") : "");

function chipFechaTarea(f) {
  if (!f) return "";
  const hoy = isoLocal(new Date());
  if (f === hoy) return `<span class="t-chip hoy">Hoy</span>`;
  const dias = Math.round((new Date(f + "T12:00") - new Date(hoy + "T12:00")) / 86400000);
  if (dias < 0) return `<span class="t-chip tarde">${dias === -1 ? "Ayer" : `Hace ${-dias} días`}</span>`;
  if (dias === 1) return `<span class="t-chip fecha">Mañana</span>`;
  const txt = new Date(f + "T12:00").toLocaleDateString("es", { weekday: "short", day: "numeric", month: "short" });
  return `<span class="t-chip fecha">${txt}</span>`;
}

function chipVentanaTarea(t) {
  const hoy = isoLocal(new Date());
  const fm = (f) => new Date(f + "T12:00").toLocaleDateString("es", { day: "numeric", month: "short" });
  if (t.inicio && t.fecha) {
    const cls = hoy > t.fecha ? "tarde" : hoy >= t.inicio ? "hoy" : "fecha";
    return `<span class="t-chip ${cls}">${fm(t.inicio)} → ${fm(t.fecha)}</span>`;
  }
  if (t.fecha) return chipFechaTarea(t.fecha);
  if (t.inicio) return `<span class="t-chip ${t.inicio <= hoy ? "hoy" : "fecha"}">${t.inicio <= hoy ? "en ventana" : "desde " + fm(t.inicio)}</span>`;
  return "";
}

/* la pizarra guarda HTML sencillo; para la línea de la fila basta el texto */
function textoPlano(html) {
  if (!html) return "";
  if (!/[<>]/.test(html)) return html;
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent.replace(/\s+/g, " ").trim();
}

/* ---------- recordatorios periódicos ---------- */
const FRECS_REC = [
  { v: "diario", l: "Cada día" },
  { v: "laborables", l: "Laborables (L–V)" },
  { v: "cada_2", l: "Cada 2 días" },
  { v: "cada_3", l: "Cada 3 días" },
  { v: "cada_7", l: "Cada semana" },
  { v: "dias", l: "Días concretos" },
];
const DIAS_NOMBRES = ["dom", "lun", "mar", "mie", "jue", "vie", "sab"];
const normDia = (d) => String(d).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").slice(0, 3);

function tocaRecordatorio(r, f) {
  if (!r.desde || f < r.desde) return false;
  if (r.hasta && f > r.hasta) return false;
  const dow = new Date(f + "T12:00").getDay();
  if (r.frecuencia === "laborables") return dow >= 1 && dow <= 5;
  if (/^cada_\d+$/.test(r.frecuencia || "")) {
    const n = Number(r.frecuencia.slice(5)) || 1;
    const diff = Math.round((new Date(f + "T12:00") - new Date(r.desde + "T12:00")) / 86400000);
    return diff % n === 0;
  }
  if (r.frecuencia === "dias") return Array.isArray(r.dias) && r.dias.some((d) => normDia(d) === DIAS_NOMBRES[dow]);
  return true; // diario
}

function etiquetaFrec(r) {
  const f = FRECS_REC.find((x) => x.v === r.frecuencia);
  if (r.frecuencia === "dias") return (r.dias || []).join(", ") || "días concretos";
  return (f ? f.l : "Cada día").toLowerCase();
}

const REC_CAMPOS = (r = {}) => {
  const proys = (STATE.proyectos || []).filter((p) => !["cerrado", "entregado"].includes(p.estado));
  return [
    { id: "titulo", label: "Recordatorio", valor: r.titulo || "", placeholder: "Follow-up a María por la propuesta" },
    { id: "desde", label: "Desde", tipo: "date", valor: r.desde || isoLocal(new Date()) },
    { id: "hasta", label: "Hasta", tipo: "date", valor: r.hasta || "", opcional: true },
    { id: "frecuencia", label: "Frecuencia", tipo: "select", valor: r.frecuencia || "diario", opciones: FRECS_REC },
    { id: "dias", label: "Días (si es «días concretos»)", valor: (r.dias || []).join(", "), placeholder: "lun, mié, vie" },
    { id: "proyecto", label: "Proyecto", tipo: "select", valor: r.proyecto || "", opciones: [{ v: "", l: "Ninguno" }, ...proys.map((p) => ({ v: p.id, l: p.nombre }))] },
  ];
};

function aplicaRecordatorio(r, f) {
  r.titulo = f.titulo.trim();
  r.desde = f.desde || isoLocal(new Date());
  if (f.hasta) r.hasta = f.hasta; else delete r.hasta;
  r.frecuencia = f.frecuencia;
  const dias = String(f.dias || "").split(/[\s,·]+/).map(normDia).filter((d) => DIAS_NOMBRES.includes(d));
  if (r.frecuencia === "dias" && dias.length) r.dias = dias; else delete r.dias;
  if (f.proyecto) r.proyecto = f.proyecto; else delete r.proyecto;
}

async function nuevoRecordatorio() {
  const f = await OSUI.form({ titulo: "Nuevo recordatorio periódico", texto: "Aparece en «Para hoy» los días que toque, dentro de su ventana.", campos: REC_CAMPOS(), ok: "Crear" });
  if (!f || !f.titulo.trim()) return;
  if (!Array.isArray(STATE.recordatorios)) STATE.recordatorios = [];
  const r = { id: "r" + Date.now(), hechos: {} };
  aplicaRecordatorio(r, f);
  STATE.recordatorios.push(r);
  saveClave("recordatorios");
}

async function editarRecordatorio(id) {
  const r = (STATE.recordatorios || []).find((x) => String(x.id) === String(id));
  if (!r) return;
  const f = await OSUI.form({ titulo: "Editar recordatorio", campos: REC_CAMPOS(r), ok: "Guardar", borrar: true });
  if (!f) return;
  if (f === "borrar") {
    if (!(await OSUI.confirm("Borrar recordatorio", `«${esc(r.titulo)}» deja de aparecer.`, { ok: "Sí, borrar" }))) return;
    STATE.recordatorios = STATE.recordatorios.filter((x) => String(x.id) !== String(id));
  } else {
    if (!f.titulo.trim()) return;
    aplicaRecordatorio(r, f);
  }
  saveClave("recordatorios");
}

function toggleRecordatorio(ev, id) {
  ev.stopPropagation();
  const r = (STATE.recordatorios || []).find((x) => String(x.id) === String(id));
  if (!r) return;
  const hoy = isoLocal(new Date());
  if (!r.hechos || typeof r.hechos !== "object") r.hechos = {};
  if (r.hechos[hoy]) delete r.hechos[hoy]; else r.hechos[hoy] = true;
  saveClave("recordatorios");
}

function recRow(r) {

/* ---------- nutrición: calorías ---------- */
function kcalDe(f) {
  const v = Number(STATE.days?.[f]?.kcal);
  return Number.isFinite(v) && v > 0 ? Math.round(v) : null;
}

async function registrarKcal() {
  const hoy = isoLocal(new Date());
  const r = await OSUI.form({
    titulo: "Registrar calorías",
    texto: "A grosso modo: el total del día. También vale decirle a Claude «hoy he comido unas 2.800 kcal».",
    campos: [
      { id: "fecha", label: "Día", tipo: "date", valor: hoy },
      { id: "kcal", label: "Calorías del día", tipo: "number", valor: kcalDe(hoy) ?? "", placeholder: "2800" },
    ],
    ok: "Guardar",
  });
  if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(r.fecha || "")) return;
  const kcal = Math.round(Number(String(r.kcal).replace(",", ".")));
  if (!Number.isFinite(kcal) || kcal <= 0) return;
  // days es el histórico completo y el POST lo sustituye entero: refrescar antes de tocar
  try {
    const fresh = await (await fetch("/api/state", { credentials: "include" })).json();
    if (fresh && fresh.days) STATE.days = fresh.days;
  } catch (e) {}
  if (!STATE.days) STATE.days = {};
  const d = STATE.days[r.fecha] || {};
  d.kcal = kcal;
  STATE.days[r.fecha] = d;
  saveClave("days");
}

async function editarObjetivoKcal() {
  const actual = Number(STATE.config_nutricion?.kcal_obj) || 2500;
  const v = await OSUI.prompt("Objetivo diario", actual, { label: "kcal/día", tipo: "number", ok: "Guardar" });
  if (v === null || String(v).trim() === "") return;
  const kcal = Math.round(Number(String(v).replace(",", ".")));
  if (!Number.isFinite(kcal) || kcal <= 0) return;
  STATE.config_nutricion = { ...(STATE.config_nutricion || {}), kcal_obj: kcal };
  saveClave("config_nutricion");
}

function barsKcal(dias, obj) {
  const W = 760, H = 190, PL = 40, PR = 12, PT = 10, PB = 24;
  const iw = W - PL - PR, ih = H - PT - PB;
  const vals = dias.map((d) => d.h).filter((v) => v !== null);
  const maxV = Math.max(obj + 400, Math.ceil(Math.max(...vals, 1) / 500) * 500);
  const y = (v) => PT + ih * (1 - v / maxV);
  const step = iw / dias.length;
  const bw = Math.min(16, step * 0.62);
  const fmtK = (t) => (t >= 1000 ? (Math.round(t / 100) / 10).toLocaleString("es") + "k" : String(t));
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (const t of [0, Math.round(maxV / 2 / 100) * 100, maxV]) {
    svg += `<line x1="${PL}" y1="${y(t)}" x2="${W - PR}" y2="${y(t)}" stroke="var(--grid)" stroke-dasharray="3 4" stroke-width="1"/>`;
    svg += `<text x="${PL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmtK(t)}</text>`;
  }
  svg += `<line x1="${PL}" y1="${y(obj)}" x2="${W - PR}" y2="${y(obj)}" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.2" opacity="0.7"/>`;
  svg += `<text x="${PL + 4}" y="${y(obj) - 5}" text-anchor="start" font-size="10" fill="var(--accent)">≥${obj.toLocaleString("es")}</text>`;
  dias.forEach((d, i) => {
    if (d.h === null) return;
    const x = PL + step * i + (step - bw) / 2;
    const hh = Math.max(2, ih * Math.min(1, d.h / maxV));
    const fill = d.h >= obj ? "var(--ok)" : "var(--mark-border)";
    svg += `<rect x="${x.toFixed(1)}" y="${(y(0) - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3.5" fill="${fill}"><title>${d.fecha.slice(5)} · ${d.h.toLocaleString("es")} kcal</title></rect>`;
  });
  const marks = [0, Math.floor((dias.length - 1) / 2), dias.length - 1];
  for (const i of marks) {
    const x = PL + step * i + step / 2;
    svg += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${dias[i].fecha.slice(5).replace("-", "/")}</text>`;
  }
  return svg + `</svg>`;
}

function tablaDias(cols) {
  const days = lastDays(14);
  if (!days.length) return `<div class="empty-note">Sin días registrados.</div>`;
  const head = `<tr><th>Fecha</th>${cols.map((c) => `<th>${c.label}</th>`).join("")}</tr>`;
  const rows = days.map((d) => {
    const s = (STATE.days?.[d.fecha]?.senales) || {};
    return `<tr><td>${d.fecha.slice(5)}</td>${cols.map((c) => `<td>${c.render(s)}</td>`).join("")}</tr>`;
  }).join("");
  return `<table>${head}${rows}</table>`;
}


/* ---------- área sueño: helpers ---------- */
function barsSueno(dias, umbral) {
  const W = 760, H = 190, PL = 34, PR = 12, PT = 10, PB = 24;
  const iw = W - PL - PR, ih = H - PT - PB;
  const vals = dias.map((d) => d.h).filter((v) => v !== null);
  const maxV = Math.max(umbral + 1, Math.ceil(Math.max(...vals, 8)));
  const y = (v) => PT + ih * (1 - v / maxV);
  const step = iw / dias.length;
  const bw = Math.min(16, step * 0.62);
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  // gridlines
  for (const t of [0, Math.round(maxV / 2), maxV]) {
    svg += `<line x1="${PL}" y1="${y(t)}" x2="${W - PR}" y2="${y(t)}" stroke="var(--grid)" stroke-dasharray="3 4" stroke-width="1"/>`;
    svg += `<text x="${PL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${t}</text>`;
  }
  // línea de umbral
  svg += `<line x1="${PL}" y1="${y(umbral)}" x2="${W - PR}" y2="${y(umbral)}" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.2" opacity="0.7"/>`;
  svg += `<text x="${PL + 4}" y="${y(umbral) - 5}" text-anchor="start" font-size="10" fill="var(--accent)">≥${umbral}h</text>`;
  // barras
  dias.forEach((d, i) => {
    if (d.h === null) return;
    const x = PL + step * i + (step - bw) / 2;
    const hh = Math.max(2, ih * (d.h / maxV));
    const fill = d.h >= umbral ? "var(--ok)" : "var(--mark-border)";
    svg += `<rect x="${x.toFixed(1)}" y="${(y(0) - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3.5" fill="${fill}"><title>${d.fecha.slice(5)} · ${d.h}h</title></rect>`;
  });
  // eje x: primera, media y última fecha
  const marks = [0, Math.floor((dias.length - 1) / 2), dias.length - 1];
  for (const i of marks) {
    const x = PL + step * i + step / 2;
    svg += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${dias[i].fecha.slice(5).replace("-", "/")}</text>`;
  }
  return svg + `</svg>`;
}

function rutRow(label, senalId) {
  const serie = DASH?.serie || [];
  const d14 = serie.slice(-14);
  const dots = d14.map((d) => {
    const v = STATE.days?.[d.fecha]?.senales?.[senalId];
    return `<span class="pdot${v === true ? " on" : ""}" title="${d.fecha.slice(5)}"></span>`;
  }).join("");
  const d30 = serie.slice(-30);
  const logged = d30.filter((d) => STATE.days?.[d.fecha]?.senales?.[senalId] !== undefined && STATE.days?.[d.fecha]?.senales?.[senalId] !== null);
  const ok = logged.filter((d) => STATE.days[d.fecha].senales[senalId] === true).length;
  const pct = logged.length ? Math.round((ok / logged.length) * 100) + "% · 30d" : "sin datos";

function isoLocal(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* Día al que cuenta una publicación: lo que se publica de madrugada (00:00-05:59) es el vídeo
   del día anterior (Alex llega tarde a casa y lo sube para el día que acaba de terminar). */
const HORA_CORTE_PUB = 6;
function diaDePublicacion(d = new Date()) {
  const x = new Date(d.getTime());
  if (x.getHours() < HORA_CORTE_PUB) x.setDate(x.getDate() - 1);
  return isoLocal(x);
}
function senalOn(fecha, id) { return STATE.days?.[fecha]?.senales?.[id] === true; }

/* heatmap anual estilo contribuciones: 53 semanas, columnas = semanas.
   nivelDe(fechaISO) → { n: 0..4, tip: string }. Se dimensiona y hace scroll en initHeatmaps(). */
function heatmapAnual(nivelDe, opts = {}) {
  const hoy = new Date();
  const hoyISO = isoLocal(hoy);
  const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7)); // lunes de esta semana
  const SEMANAS = 53;
  const ini = new Date(lunes);
  ini.setDate(lunes.getDate() - (SEMANAS - 1) * 7);
  let meses = "", celdas = "", mesPrev = -1;
  for (let w = 0; w < SEMANAS; w++) {
    const wIni = new Date(ini);
    wIni.setDate(ini.getDate() + w * 7);
    if (wIni.getMonth() !== mesPrev) {
      mesPrev = wIni.getMonth();
      meses += `<span class="hmm" style="grid-row:1;grid-column:${w + 1}">${wIni.toLocaleDateString("es", { month: "short" })}</span>`;
    }
    for (let d = 0; d < 7; d++) {
      const dt = new Date(wIni);
      dt.setDate(wIni.getDate() + d);
      const f = isoLocal(dt);
      if (f > hoyISO) continue; // el futuro no se pinta
      const r = nivelDe(f) || { n: 0, tip: f.slice(5) };
      const click = opts.click ? ` onclick="${opts.click}('${f}')"` : "";
      celdas += `<span class="hmc l${r.n || 0}${f === hoyISO ? " hoy" : ""}" style="grid-row:${d + 2};grid-column:${w + 1}" title="${escA(r.tip)}"${click}></span>`;
    }
  }
  const dias = ["lun.", "", "mié.", "", "vie.", "", "dom."].map((t) => `<span>${t}</span>`).join("");
  return `<div class="hm-wrap">
    <div class="hm-days"><span></span>${dias}</div>
    <div class="hm-scroll"><div class="hm-grid">${meses}${celdas}</div></div>
  </div>
  <div class="hm-leyenda">Menos <span class="hmc"></span><span class="hmc l1"></span><span class="hmc l2"></span><span class="hmc l3"></span><span class="hmc l4"></span> Más</div>`;
}

/* tamaño de celda para que se vean ~3 meses; el resto queda a la izquierda con scroll */
function initHeatmaps() {
  document.querySelectorAll(".hm-scroll").forEach((el) => {
    const cell = Math.max(16, Math.min(30, Math.floor(el.clientWidth / 14) - 4));
    el.closest(".hm-wrap").style.setProperty("--hmc", cell + "px");

  });
}

// curva monótona (igual que el panel: nunca rebasa los datos)
function pathSuave(pts) {
  if (pts.length < 2) return pts.map((p) => `M${p.x},${p.y}`).join("");
  const n = pts.length, dx = [], dy = [], m = [];
  for (let i = 0; i < n - 1; i++) {
    dx.push(pts[i + 1].x - pts[i].x); dy.push(pts[i + 1].y - pts[i].y);
    m.push(dy[i] / (dx[i] || 1));
  }
  const t = [m[0]];
  for (let i = 1; i < n - 1; i++) {
    if (m[i - 1] * m[i] <= 0) t.push(0);
    else { const w1 = 2 * dx[i] + dx[i - 1], w2 = dx[i] + 2 * dx[i - 1]; t.push((w1 + w2) / (w1 / m[i - 1] + w2 / m[i])); }
  }
  t.push(m[n - 2]);
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i].x + h).toFixed(1)},${(pts[i].y + t[i] * h).toFixed(1)} ${(pts[i + 1].x - h).toFixed(1)},${(pts[i + 1].y - t[i + 1] * h).toFixed(1)} ${pts[i + 1].x.toFixed(1)},${pts[i + 1].y.toFixed(1)}`;
  }
  return d;
}

function lineaPeso(pesos) {
  const W = 760, H = 200, PL = 42, PR = 14, PT = 12, PB = 24;
  const iw = W - PL - PR, ih = H - PT - PB;
  const vals = pesos.map((p) => Number(p.kg));
  const min = Math.min(...vals) - 0.4, max = Math.max(...vals) + 0.4;
  const x = (i) => PL + (pesos.length === 1 ? iw / 2 : (iw * i) / (pesos.length - 1));
  const y = (v) => PT + ih * (1 - (v - min) / (max - min || 1));
  const pts = pesos.map((p, i) => ({ x: x(i), y: y(Number(p.kg)) }));
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (const t of [min + 0.4, (min + max) / 2, max - 0.4]) {
    svg += `<line x1="${PL}" y1="${y(t)}" x2="${W - PR}" y2="${y(t)}" stroke="var(--grid)" stroke-dasharray="3 4" stroke-width="1"/>`;
    svg += `<text x="${PL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${t.toFixed(1)}</text>`;
  }
  if (pts.length > 1) svg += `<path d="${pathSuave(pts)}" fill="none" stroke="var(--serie-1)" stroke-width="2" stroke-linecap="round"/>`;
  pesos.forEach((p, i) => {
    svg += `<circle cx="${pts[i].x.toFixed(1)}" cy="${pts[i].y.toFixed(1)}" r="3.5" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"><title>${p.fecha.slice(5)} · ${p.kg} kg</title></circle>`;
  });
  const marks = pesos.length > 2 ? [0, Math.floor((pesos.length - 1) / 2), pesos.length - 1] : pesos.map((_, i) => i);
  for (const i of marks) {
    svg += `<text x="${pts[i].x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${pesos[i].fecha.slice(5).replace("-", "/")}</text>`;
  }
  return svg + `</svg>`;
}

async function subirArchivosProy(pi, files) {
  const p = STATE.proyectos[pi];
  if (!p || !files.length) return;
  for (const f of files) {
    if (f.size > 15 * 1024 * 1024) { alert(`«${f.name}» pasa de 15MB.`); continue; }
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(",")[1] || "");
        r.onerror = () => rej(new Error("no se pudo leer el archivo"));
        r.readAsDataURL(f);
      });
      const up = await fetch("/api/archivos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ nombre: f.name, mime: f.type || "application/octet-stream", data: b64 }),
      });
      const ub = await up.json();
      if (!up.ok) throw new Error(ub.error || "HTTP " + up.status);
      if (!Array.isArray(p.archivos)) p.archivos = [];
      p.archivos.push({ id: ub.id, nombre: f.name, mime: f.type || "application/octet-stream", size: f.size });
    } catch (e) {
      alert(`No se subió «${f.name}»: ${e.message}`);
    }
  }
  await postClaves({ proyectos: STATE.proyectos });
  renderContent();
}

async function borrarArchivoProy(pi, i) {
  const p = STATE.proyectos[pi];
  const a = p?.archivos?.[i];
  if (!a) return;
  if (!(await OSUI.confirm("Borrar archivo", `«${esc(a.nombre)}» se elimina del todo.`, { ok: "Sí, borrar" }))) return;
  fetch("/api/archivos/" + encodeURIComponent(a.id), { method: "DELETE", credentials: "include" }).catch(() => {});
  p.archivos.splice(i, 1);
  await postClaves({ proyectos: STATE.proyectos });
  renderContent();
}

    if (!(await OSUI.confirm("Borrar proyecto", `«${esc(p.nombre)}» y sus subproyectos se eliminan del todo.`, { ok: "Sí, borrar" }))) return;
    STATE.proyectos.splice(idx, 1);
    location.hash = "proyectos";
  } else {
    if (!r.nombre.trim()) return;
    p.nombre = r.nombre.trim();
    p.estado = r.estado;
    if (r.desc.trim()) p.desc = r.desc.trim(); else delete p.desc;
    if (r.siguiente.trim()) p.siguiente = r.siguiente.trim(); else delete p.siguiente;
    p.updated = isoLocal(new Date());
  }
  saveProyectos();
}

  if (v >= 1048576) return (v / 1048576).toFixed(1).replace(".0", "") + " MB";
  if (v >= 1024) return Math.round(v / 1024) + " KB";
  return v + " B";
}

async function subirArchivosSub(files) {
  if (!subSel || !files.length) return;
  const p = STATE.proyectos[subSel.pi], sub = p.subs[subSel.si];
  for (const f of files) {
    if (f.size > 15 * 1024 * 1024) { alert(`«${f.name}» pasa de 15MB.`); continue; }
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(",")[1] || "");
        r.onerror = () => rej(new Error("no se pudo leer el archivo"));
        r.readAsDataURL(f);
      });
      const up = await fetch("/api/archivos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ nombre: f.name, mime: f.type || "application/octet-stream", data: b64 }),
      });
      const ub = await up.json();
      if (!up.ok) throw new Error(ub.error || "HTTP " + up.status);
      if (!Array.isArray(sub.archivos)) sub.archivos = [];
      sub.archivos.push({ id: ub.id, nombre: f.name, mime: f.type || "application/octet-stream", size: f.size });
    } catch (e) {
      alert(`No se subió «${f.name}»: ${e.message}`);
    }
  }
  await postClaves({ proyectos: STATE.proyectos });
  renderSubPanel();
}

async function borrarSub() {

  const p = STATE.proyectos[subSel.pi], sub = p?.subs?.[subSel.si];

  if (!(await OSUI.confirm("Borrar subproyecto", `«${esc(sub.nombre)}» se borra con sus notas y archivos. Sus tareas se quedan en el proyecto.`, { ok: "Sí, borrar" }))) return;

}
