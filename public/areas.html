/* ---------- área contenido: reto + piezas ---------- */
function cfgReto() {
  const c = STATE.config_contenido || {};
  return {
    inicio: c.inicio || Object.keys(STATE.days || {}).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort()[0] || isoLocal(new Date()),
    dias: Number(c.dias) || 100,
    meta_reels: Number(c.meta_reels ?? 100),
    meta_yt: Number(c.meta_yt ?? 42),
    min_dia: Number(c.min_dia) || 100,
  };
}
function tipoPieza(c) { return /yt|youtube|video|largo/i.test(String(c.tipo || "")) ? "yt" : "reel"; }
function ytIdDe(url) {
  const m = String(url || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function igCodeDe(url) {
  const m = String(url || "").match(/instagram\.com\/(?:[\w.]+\/)?(?:reel|reels|p|tv)\/([\w-]+)/);
  return m ? m[1] : null;
}
function fmtN(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return null;
  if (v >= 1000000) return (v / 1000000).toFixed(1).replace(".0", "") + "M";
  if (v >= 1000) return (v / 1000).toFixed(1).replace(".0", "") + "k";
  return String(v);
}
function thumbDe(c) {
  const yid = ytIdDe(c.url);
  if (yid) return `<span class="thumb"><img src="https://img.youtube.com/vi/${yid}/mqdefault.jpg" alt="" loading="lazy"></span>`;
  const tp = tipoPieza(c);
  // móvil = reel (IG) · monitor = YouTube — se distinguen desde la lista
  return tp === "yt"
    ? `<span class="thumb ph-yt" title="YouTube">${OSIcons.monitor}</span>`
    : `<span class="thumb ph-reel" title="Reel">${OSIcons.movil}</span>`;
}
function fechaPub(c) { return c.fecha_pub || c.fecha || ""; }
function publicadas() { return (STATE.contenido || []).filter((c) => c.estado === "publicado"); }

function vistaReto() {
  const r = cfgReto();
  const hoy = isoLocal(new Date());
  const t0 = new Date(r.inicio + "T12:00").getTime();
  const dia = Math.max(1, Math.min(r.dias, Math.floor((Date.now() - t0) / 86400000) + 1));
  const fin = new Date(t0 + (r.dias - 1) * 86400000);
  const fmtF = (d) => d.toLocaleDateString("es", { day: "numeric", month: "short" });
  const pubs = publicadas().filter((c) => fechaPub(c) >= r.inicio);
  const nR = pubs.filter((c) => tipoPieza(c) === "reel").length;
  const nY = pubs.filter((c) => tipoPieza(c) === "yt").length;

  const metaCard = (n, meta, color, lbl) => {
    const esperado = meta * (dia / r.dias);
    const enPlan = n >= Math.floor(esperado);
    const ritmo = n / dia;
    const restantes = Math.max(1, r.dias - dia);
    const necesario = Math.max(0, meta - n) / restantes;
    const proy = Math.round(ritmo * r.dias);
    const f1 = (x) => (Math.round(x * 100) / 100).toLocaleString("es", { maximumFractionDigits: 2 });
    return `<div class="meta-card">
      <div class="top"><span class="n">${n}<small>/${meta}</small></span>
        <span class="tag ${enPlan ? "ok" : "ko"}">${enPlan ? "en plan" : "−" + (Math.floor(esperado) - n) + " vs plan"}</span></div>
      <div class="lbl">${lbl}</div>
      <div class="mbar"><i style="width:${Math.min(100, (n / meta) * 100)}%;background:${color}"></i><span class="esperado" style="left:${Math.min(100, (esperado / meta) * 100)}%"></span></div>
      <div class="ritmo">Ritmo: <b>${f1(ritmo)}/día</b> · necesitas <b>${f1(necesario)}/día</b> · proyección: <b>${proy}</b></div>
    </div>`;
  };

  // checklist 180 min: 5 semanas de trabajo diario de contenido
  const objetivo = r.min_dia;
  const minDe = (f) => Math.round(Number(STATE.days?.[f]?.contenido_min)) || 0;
  const hoyMin = minDe(hoy);
  const hoyLine = `<div class="hoy-line">
    <span class="n">${hoyMin}<small> /${objetivo} min hoy</small></span>
    <div class="hbar"><i style="width:${Math.min(100, (hoyMin / objetivo) * 100)}%"></i></div>
    <span class="falta">${hoyMin >= objetivo ? "cumplido ✓" : `te faltan ${objetivo - hoyMin} min`}</span>
  </div>`;

  // heatmap anual de minutos (mismo estilo contribuciones que gym/nutrición); clic en un día = apuntar minutos
  const cal = heatmapAnual((f) => {
    const min = minDe(f);
    if (!min) return { n: 0, tip: f.slice(5) + " · sin minutos — toca para apuntar" };
    const n = min >= objetivo ? 4 : min >= objetivo * 0.8 ? 3 : min >= objetivo * 0.5 ? 2 : 1;
    return { n, tip: `${f.slice(5)} · ${min} min${n === 4 ? " · cumplido" : ""}` };
  }, { click: "registrarMinutos" });
  // cumplidos y racha desde el inicio del reto
  let cumplidos = 0, totalDias = 0;
  for (let t = t0; ; t += 86400000) {
    const f = isoLocal(new Date(t));
    if (f > hoy) break;
    totalDias++;
    if (minDe(f) >= objetivo) cumplidos++;
  }
  let racha = 0;
  for (let t = Date.now(); ; t -= 86400000) {
    const f = isoLocal(new Date(t));
    if (f < r.inicio) break;
    const ok = minDe(f) >= objetivo;
    if (!ok) { if (f === hoy) continue; break; }
    racha++;
  }
  const retoStats = `<div class="sub" style="margin-top:2px">Verde pleno = ≥${objetivo} min · ${cumplidos}/${totalDias} días cumplidos desde el inicio · racha: ${racha} · toca un día para apuntar minutos</div>`;

  const calHead = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
    <h2>${objetivo} minutos diarios</h2>
    <button class="btn-mini primary" onclick="registrarMinutos()">${OSIcons.nueva} Minutos</button>
  </div>`;

  return `<div class="card">
      <div class="reto-head"><span class="dia">Día ${dia}<small> de ${r.dias}</small></span><span class="fechas">${fmtF(new Date(t0))} → ${fmtF(fin)}</span><button class="btn-mini" onclick="editarReto()">${OSIcons.editar} Editar</button></div>
      <div class="reto-bar"><i style="width:${(dia / r.dias) * 100}%"></i></div>
    </div>
    <div class="metas">${metaCard(nR, r.meta_reels, "#e33982", "Reels publicados")}${metaCard(nY, r.meta_yt, "#d03b3b", "Vídeos de YouTube")}</div>
    <div class="card">${calHead}${hoyLine}${cal}${retoStats}</div>`;
}

async function registrarMinutos(fecha) {
  const f = fecha || isoLocal(new Date());
  const actual = Math.round(Number(STATE.days?.[f]?.contenido_min)) || 0;
  const input = await OSUI.prompt(`Minutos de contenido · ${f.slice(8)}/${f.slice(5, 7)}`, actual || "", { label: "minutos totales del día", tipo: "number", ok: "Guardar" });
  if (input === null || String(input).trim() === "") return;
  const min = Math.round(Number(String(input).replace(",", ".")));
  if (!Number.isFinite(min) || min < 0) return;
  // days es el histórico completo: refrescar antes de tocar
  try {
    const fresh = await (await fetch("/api/state", { credentials: "include" })).json();
    if (fresh && fresh.days) STATE.days = fresh.days;
  } catch (e) {}
  if (!STATE.days) STATE.days = {};
  const d = STATE.days[f] || {};
  d.contenido_min = min;
  if (min >= cfgReto().min_dia) d.senales = { ...(d.senales || {}), contenido: true };
  STATE.days[f] = d;
  saveClave("days");
}

const estadoPieza = (c) => { const e = c.estado || "idea"; return e === "grabado" || e === "editando" ? "editar" : e; };
const labelEstado = (c) => (ESTADOS_PIEZA.find((e) => e.id === estadoPieza(c)) || ESTADOS_PIEZA[0]).l;
function ordenaPiezas(arr) {
  // pendientes primero por fecha de plan (sin fecha al final); publicadas después, de la más reciente a la más antigua
  return arr.slice().sort((a, b) => {
    const pa = estadoPieza(a) === "publicado", pb = estadoPieza(b) === "publicado";
    if (pa !== pb) return pa ? 1 : -1;
    if (!pa) { const fa = a.fecha_plan || "9999", fb = b.fecha_plan || "9999"; return fa < fb ? -1 : fa > fb ? 1 : (a.num || 0) - (b.num || 0); }
    return (b.fecha_pub || "") < (a.fecha_pub || "") ? -1 : 1;
  });
}
const fmtHora = (c) => c.hora ? ` · ${c.hora}` : "";
const fmtDM = (f) => f ? `${f.slice(8)}/${f.slice(5, 7)}` : "";

function piezaDeTipo(c) {
  return piezasTipo === "todo" || tipoPieza(c) === piezasTipo;
}

function piezaEnPeriodo(c) {
  if (piezasPeriodo === "todo") return true;
  const f = fechaPub(c);
  if (!f) return false;
  const hoy = isoLocal(new Date());
  if (piezasPeriodo === "mes") return f.startsWith(hoy.slice(0, 7));
  const desde = isoLocal(new Date(Date.now() - (Number(piezasPeriodo) - 1) * 86400000));
  return f >= desde && f <= hoy;
}

function vistaPiezas() {
  // fecha y tipo se combinan: afectan a KPIs y a la lista
  const todas = ordenaPiezas((STATE.contenido || []).filter(piezaEnPeriodo).filter(piezaDeTipo));
  const cuenta = (id) => todas.filter((c) => estadoPieza(c) === id).length;
  const kpis = `<div class="mini-kpis" style="grid-template-columns:repeat(auto-fit,minmax(104px,1fr))">` + ESTADOS_PIEZA.filter((e) => e.id !== "publicado").map((e) =>

    `<div class="mkpi"><div class="n">${cuenta("publicado")}</div><div class="l">Publicadas</div></div></div>`;

  const FILTROS = [{ id: "todas", label: "Todas", f: () => true }].concat(
    ESTADOS_PIEZA.map((e) => ({ id: e.id, label: e.id === "publicado" ? "Publicadas" : e.l, f: (c) => estadoPieza(c) === e.id })));
  const filtro = FILTROS.find((x) => x.id === contFiltro) || FILTROS[0];
  const chips = `<div class="filtros">` + FILTROS.map((x) =>
    `<button class="${x.id === contFiltro ? "on" : ""}" onclick="contFiltro='${x.id}';renderContent()">${x.label}</button>`).join("") + `</div>`;

  const lista = todas.filter(filtro.f).slice(0, 80);
  const items = lista.length ? lista.map((c) => {
    const idx = (STATE.contenido || []).indexOf(c);
    const views = fmtN(c.views);
    return `
    <div class="pieza link" onclick="abrirPieza(${idx})">
      ${thumbDe(c)}
      <span class="t">${esc(c.titulo || "(sin título)")}</span>
      <span class="badge ${estadoPieza(c)}">${labelEstado(c)}</span>
      ${views ? `<span class="mets"><b>${views}</b> views</span>` : ""}
      ${c.fecha_plan && estadoPieza(c) !== "publicado" ? `<span class="mets">→ ${fmtDM(c.fecha_plan)}${fmtHora(c)}</span>` : ""}
      <span class="f">${fechaPub(c).slice(5).replace("-", "/")}</span>
    </div>`;
  }).join("")
    : `<div class="empty-note">Nada aquí. «Publiqué un reel sobre X» o «idea: …» a Claude y aparece.</div>`;

  return kpis + `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
      <h2>Piezas</h2>
      <span style="display:flex;gap:6px">
        <button class="btn-mini" id="btnMetricas" onclick="actualizarMetricas()">↻ Métricas</button>
        <button class="btn-mini primary" onclick="nuevaPieza()">${OSIcons.nueva} Nueva pieza</button>
      </span>

}

function tomasDe(c) { return (STATE.tomas || []).filter((t) => c.cid && (t.piezas || []).includes(c.cid)); }
function vistaHoyIG() {
  const hoy = isoLocal(new Date());

  const todas = STATE.contenido || [];
  const idx = (c) => todas.indexOf(c);

  const atrasadas = ordenaPiezas(pend.filter((c) => c.fecha_plan && c.fecha_plan < hoy));
  const semana = ordenaPiezas(pend.filter((c) => c.fecha_plan && c.fecha_plan > hoy && c.fecha_plan <= en7));
  const grabar = ordenaPiezas(pend.filter((c) => estadoPieza(c) === "grabar"));
  const fila = (c, extra = "") => `<div class="hoy-item link" onclick="abrirPieza(${idx(c)})"><span class="badge ${estadoPieza(c)}">${labelEstado(c)}</span><span class="t">${esc(c.titulo || "(sin título)")}</span><span class="sp"></span><span class="m">${fmtDM(c.fecha_plan)}${fmtHora(c)}${extra}</span></div>`;
  const bloqueHoy = deHoy.length ? deHoy.map((c) => fila(c) + (c.caption ? `<div class="cap-prev">${esc(c.caption).slice(0, 220)}${c.caption.length > 220 ? "…" : ""}</div>` : "") +
      `<div style="margin:6px 0 12px 26px"><button class="btn-mini primary" onclick="event.stopPropagation();marcarPublicada(${idx(c)})">Marcar publicada</button></div>`).join("")
    : `<div class="empty-note">Nada programado para hoy.</div>`;
  const bloqueGrabar = grabar.length ? grabar.slice(0, 8).map((c) => {
    const ts = tomasDe(c), pendT = ts.filter((t) => t.estado !== "grabada");
    const lista = pendT.slice(0, 4).map((t) => `${esc(t.descripcion)}${t.lugar ? ` <span>· ${esc(t.lugar)}</span>` : ""}`).join("<br>");
    return fila(c, ts.length ? ` · ${ts.length - pendT.length}/${ts.length} tomas` : "") + (pendT.length ? `<div class="hoy-tomas">${lista}${pendT.length > 4 ? `<br><span>y ${pendT.length - 4} más</span>` : ""}</div>` : "");
  }).join("") : `<div class="empty-note">Nada pendiente de grabar.</div>`;
  return `<div class="card"><h2>Se publica hoy · ${fmtDM(hoy)}</h2>${bloqueHoy}</div>` +
    (atrasadas.length ? `<div class="card"><h2>Atrasadas</h2><div class="sub">Tenían fecha y no están publicadas. Muévelas en el calendario o publícalas.</div>${atrasadas.map((c) => fila(c)).join("")}</div>` : "") +
    `<div class="card"><h2>Próximos 7 días</h2>${semana.length ? semana.map((c) => fila(c)).join("") : `<div class="empty-note">Nada con fecha esta semana.</div>`}</div>` +
    `<div class="card"><h2>Para grabar</h2><div class="sub">Piezas en «grabar», con sus tomas pendientes.</div>${bloqueGrabar}</div>`;
}

/* ---------- calendario de publicación ---------- */
function calMesMueve(n) {
  const [y, m] = calMes.split("-").map(Number);
  const d = new Date(y, m - 1 + n, 15);
  calMes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  renderContent();
}

function vistaCalendario() {
  const hoy = isoLocal(new Date());
  const [y, m] = calMes.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const start = (first.getDay() + 6) % 7;
  const nDias = new Date(y, m, 0).getDate();

  const porDia = {};
  (STATE.contenido || []).forEach((c, i) => {
    const f = c.estado === "publicado" ? (c.fecha_pub || c.fecha_plan) : c.fecha_plan;
    if (f) (porDia[f] = porDia[f] || []).push(i);
  });

  const mesTxt = first.toLocaleDateString("es", { month: "long", year: "numeric" });
  let grid = `<div class="pubcal">` + ["L", "M", "X", "J", "V", "S", "D"].map((d) => `<span class="cd">${d}</span>`).join("");
  for (let i = 0; i < start; i++) grid += `<div class="day off"></div>`;
  for (let d = 1; d <= nDias; d++) {
    const f = `${calMes}-${String(d).padStart(2, "0")}`;
    const chips = (porDia[f] || []).map((i) => {
      const c = STATE.contenido[i];
      const cls = c.estado === "publicado" ? "pub" : tipoPieza(c) === "yt" ? "yt" : "reel";
      return `<span class="pieza-chip ${cls}" onclick="event.stopPropagation();planPieza(${i})">${c.estado === "publicado" ? "✓ " : ""}${esc(c.titulo || "(sin título)")}</span>`;
    }).join("");
    grid += `<div class="day${f === hoy ? " hoy" : ""}" onclick="asignarDia('${f}')"><span class="dn">${d}</span>${chips}</div>`;
  }
  grid += `</div>`;

  const pendientes = (STATE.contenido || []).filter((c) => c.estado !== "publicado" && !c.fecha_plan).length;
  return `<div class="card">
    <h2>Calendario de publicación</h2>
    <div class="sub">Toca un día para asignarle una pieza creada; toca una pieza para moverla o quitarla. Las publicadas se tachan en su día real.${pendientes ? ` <b>${pendientes} pieza${pendientes === 1 ? "" : "s"} sin fecha.</b>` : ""}</div>
    <div class="mes-nav"><button onclick="calMesMueve(-1)">‹</button><b>${mesTxt.charAt(0).toUpperCase() + mesTxt.slice(1)}</b><button onclick="calMesMueve(1)">›</button></div>
    ${grid}</div>`;
}

/* pizarra: contenteditable con títulos estilo notion, negrita y subrayado */
function limpiaHTML(html) {
  const t = document.createElement("div");
  t.innerHTML = html;
  t.querySelectorAll("script,style,iframe,object,embed,link,meta,img").forEach((n) => n.remove());
  t.querySelectorAll("*").forEach((n) => { for (const a of [...n.attributes]) n.removeAttribute(a.name); });
  return t.innerHTML;
}

/* panel = elemento raíz que contiene .sp-pizarra y .pz-tools; c = objeto con .notas; onSave = guardado quiet */
function initPizarra(c, panel, onSave) {
  const ed = panel.querySelector(".sp-pizarra");
  const inicial = String(c.notas || "");
  // el texto plano heredado se convierte en bloques por línea (formatBlock necesita bloques)
  ed.innerHTML = /[<>]/.test(inicial)
    ? limpiaHTML(inicial)
    : inicial.trim() ? inicial.split("\n").map((l) => `<div>${esc(l) || "<br>"}</div>`).join("") : "";

  const guardar = () => {
    const vacio = !ed.textContent.trim();
    if (vacio) { delete c.notas; }
    else c.notas = limpiaHTML(ed.innerHTML);
    onSave();
  };

  const bloque = () => {
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    let n = sel.anchorNode;
    while (n && n.parentNode !== ed) { if (n === ed) return null; n = n.parentNode; }
    return n && n !== ed ? n : null;
  };

  ed.addEventListener("input", guardar);
  ed.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); document.execCommand("bold"); guardar(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "u") { e.preventDefault(); document.execCommand("underline"); guardar(); return; }
    if (e.key === " ") {
      const b = bloque();
      const t = b ? b.textContent : "";
      if (t === "#" || t === "##") {
        e.preventDefault();
        // vaciar dejando un <br> ancla: sin él no hay posición de caret válida y formatBlock convierte el bloque anterior
        if (b.nodeType === 1) b.innerHTML = "<br>"; else b.nodeValue = "";
        const r = document.createRange();
        if (b.nodeType === 1) r.setStart(b, 0);
        else r.setStart(b, 0);
        r.collapse(true);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        document.execCommand("formatBlock", false, t === "#" ? "h2" : "h3");
        guardar();
      }
    }
    if (e.key === "Enter") {
      const b = bloque();
      if (b && b.nodeType === 1 && /^H[23]$/.test(b.tagName)) {
        setTimeout(() => document.execCommand("formatBlock", false, "div"), 0); // al salir del título, texto normal
      }
    }
  });
  ed.addEventListener("paste", (e) => {
    e.preventDefault();
    document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
  });

  panel.querySelectorAll(".pz-tools button").forEach((b) => {
    b.onmousedown = (e) => e.preventDefault(); // no robar el foco/selección
    b.onclick = () => {
      const f = b.dataset.f;
      ed.focus();
      if (f === "h2" || f === "h3") {
        const blk = bloque();
        const ya = blk && blk.nodeType === 1 && blk.tagName === f.toUpperCase();
        document.execCommand("formatBlock", false, ya ? "div" : f);
      } else {
        document.execCommand(f);
      }
      guardar();
    };
  });
}

function auVigila(cid) {

function duracionDe(file) {
  return new Promise((ok) => {
    const url = URL.createObjectURL(file), a = new Audio();
    const fin = (v) => { URL.revokeObjectURL(url); ok(Number.isFinite(v) && v > 0 ? v : null); };
    a.preload = "metadata";
    a.onloadedmetadata = () => fin(a.duration);
    a.onerror = () => fin(null);
    setTimeout(() => fin(null), 4000);
    a.src = url;
  });
}
const AUDIO_POR_EXT = { m4a: "audio/mp4", mp4: "audio/mp4", mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", oga: "audio/ogg", webm: "audio/webm", flac: "audio/flac" };
async function auSube(cid, blob, dur, nombre) {
  const tipo = (blob.type || AUDIO_POR_EXT[String(blob.name || "").split(".").pop().toLowerCase()] || "").split(";")[0];
  if (!/^audio\/|^video\/(mp4|webm)$/.test(tipo)) return OSUI.confirm("No es un audio", "Sube una nota de voz (m4a, mp3, wav, ogg o webm).", { ok: "Vale", danger: false });
  if (blob.size > 25 * 1024 * 1024) return OSUI.confirm("Audio demasiado largo", "El máximo son 25 MB por audio (unos 25 minutos). Pártelo en dos.", { ok: "Vale", danger: false });
  auSubiendo = cid;
  pintaAudios(cid);
  try {
    const q = new URLSearchParams();
    if (dur) q.set("dur", Number(dur).toFixed(1));
    if (nombre) q.set("nombre", nombre);
    const r = await fetch(`/api/piezas/${encodeURIComponent(cid)}/audios?${q}`, { method: "POST", credentials: "include", headers: { "Content-Type": tipo }, body: blob });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    const p = piezaPorCid(cid);
    if (p) (p.audios = p.audios || []).push(j.audio);
  } catch (e) {
    OSUI.confirm("No se guardó el audio", esc(e.message), { ok: "Vale", danger: false });
  } finally {
    auSubiendo = null;
    pintaAudios(cid);
    auVigila(cid);
  }
}
async function auGraba(cid) {
  if (auGrabando) return;
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined")
    return OSUI.confirm("No se puede grabar aquí", "Este navegador no deja grabar audio. Graba la nota con el móvil y súbela con «Subir».", { ok: "Vale", danger: false });
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return OSUI.confirm("Sin micrófono", "El navegador no ha dado permiso para usar el micrófono. Actívalo en los permisos del sitio y vuelve a probar.", { ok: "Vale", danger: false }); }
  // m4a donde se pueda (se escucha en todos lados); si no, webm
  const tipo = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported?.(t)) || "";
  const rec = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
  const g = { cid, rec, stream, chunks: [], t0: Date.now(), cancelado: false };
  rec.ondataavailable = (e) => { if (e.data?.size) g.chunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(g.reloj);
    auGrabando = null;
    if (g.cancelado || !g.chunks.length) return pintaAudios(cid);
    const blob = new Blob(g.chunks, { type: (rec.mimeType || tipo || "audio/webm").split(";")[0] });
    await auSube(cid, blob, (Date.now() - g.t0) / 1000);
  };
  auGrabando = g;
  rec.start(1000);
  g.reloj = setInterval(() => { const el = $("auRecT"); if (el) el.textContent = fmtDur((Date.now() - g.t0) / 1000); }, 500);
  pintaAudios(cid);
}
function auPara(cancelar) {
  if (!auGrabando || auGrabando.rec.state === "inactive") return; // ya parada: la primera orden manda
  auGrabando.cancelado = !!cancelar;
  auGrabando.rec.stop();
}

function auPinta() {
  const p = $("piezaPanel");
  if (!p) return;
  p.querySelectorAll("[data-play]").forEach((b) => {
    const suena = auSonando?.id === b.dataset.play && !auSonando.audio.paused;
    b.innerHTML = suena ? IC_PAUSE : IC_PLAY;
    b.title = suena ? "Pausa" : "Escuchar";

  if (!auSonando) return;

function auToca(a, ratio) {
  if (auSonando?.id !== a.id) {

    audio.preload = "auto";
    auSonando = { id: a.id, audio, dur: a.duracion || 0 };

  }
  const { audio } = auSonando;
  if (ratio != null) {
    const ve = () => { const d = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : auSonando?.dur; if (d) audio.currentTime = ratio * d; };
    if (audio.readyState >= 1) ve(); else audio.addEventListener("loadedmetadata", ve, { once: true });
    if (audio.paused) audio.play().catch(() => {});

  }

}

// los campos de texto de la ficha crecen con lo que se escribe: con CSS (field-sizing) donde se puede; si no, aquí
const CAMPOS_CSS = typeof CSS !== "undefined" && CSS.supports?.("field-sizing", "content");
function creceCampo(t) { if (CAMPOS_CSS || !t.offsetParent) return; t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
const creceCampos = (raiz) => raiz?.querySelectorAll(".sp-campo textarea").forEach(creceCampo);
addEventListener("resize", () => creceCampos($("piezaPanel")));

function renderPiezaPanel() {
  const c = (STATE.contenido || [])[piezaIdx];
  if (!c) return;
  const p = $("piezaPanel");
  const est = estadoPieza(c), ed = c.edicion;
  if (fichaTab === "edicion" && !ed) fichaTab = "guion";
  const eds = (EDITORES || []).filter((u) => u.active || (ed && u.id === ed.editor));
  const fPub = est === "publicado" ? c.fecha_pub : c.fecha_plan;
  const ts = tomasDe(c);
  const area = active === "instagram" ? "Instagram" : active === "agenda" ? "Agenda" : "Contenido";
  const clases = CLASES.includes(c.clase || "soft") ? CLASES : CLASES.concat([c.clase]);
  const campo = (id, label, ph = "Vacío") => `<div class="sp-campo"><label for="sp_${id}">${label}</label><textarea id="sp_${id}" rows="1" placeholder="${escA(ph)}">${esc(c[id])}</textarea></div>`;
  // los de texto de una línea también saltan de línea al verse (sin caja, un input cortaría el texto), pero sin Intro
  const input = (id, label, ph = "Vacío", tipo = "text") => tipo === "text"
    ? `<div class="sp-campo"><label for="sp_${id}">${label}</label><textarea id="sp_${id}" rows="1" data-linea="1" placeholder="${escA(ph)}">${esc(c[id])}</textarea></div>`
    : `<div class="sp-campo"><label for="sp_${id}">${label}</label><input id="sp_${id}" type="${tipo}" value="${escA(c[id])}" placeholder="${escA(ph)}"></div>`;
  const legado = c.editor && (c.editor.enviada || c.editor.recibida || c.editor.aprobada)
    ? `<div class="ft-nota" style="margin-top:8px">Antes del panel: ${[c.editor.enviada && "enviada " + c.editor.enviada, c.editor.recibida && "recibida " + c.editor.recibida, c.editor.aprobada && "aprobada " + c.editor.aprobada].filter(Boolean).join(" · ")}</div>` : "";

  p.innerHTML = `
    <div class="sp-top">
      <div class="sp-ruta"><span class="rlink" onclick="cerrarPieza()">${area}</span><span class="sep">/</span><span class="act">${esc(c.titulo || "Sin título")}</span></div>
      <button id="spFull" title="Pantalla completa">${IC_EXPAND}</button>
      ${c.url ? `<a href="${escA(c.url)}" target="_blank" rel="noopener" title="Abrir el reel">${IC_LINK}</a>` : ""}
      <span style="flex:1"></span>
      <button id="spBorrar" title="Borrar pieza">${OSIcons.borrar}</button>
      <button id="spCerrar" title="Cerrar">${OSIcons.cerrar}</button>
    </div>
    <div class="sp-body"><div class="sp-body-inner">
      <input class="sp-title" id="spTitulo" value="${escA(c.titulo)}" placeholder="Sin título">
      <div class="sp-props">
        <div class="sp-prop"><label>Estado</label><select id="spEstado">${ESTADOS_PIEZA.map((e) => `<option value="${e.id}" ${est === e.id ? "selected" : ""}>${e.l}</option>`).join("")}</select></div>
        <div class="sp-prop"><label>${est === "publicado" ? "Publicada el" : "Se publica"}</label><div class="osui-dw"><input class="osui-date" id="spPub" type="text" readonly data-opt="1" data-iso="${fPub || ""}" value="${fPub ? fPub.split("-").reverse().join("/") : ""}" placeholder="sin fecha"></div></div>
        <div class="sp-prop"><label>Hora</label><input id="sp_hora" class="osui-time" inputmode="numeric" maxlength="5" value="${escA(c.hora)}" placeholder="18:00"></div>
        <div class="sp-prop"><label>Tipo</label><select id="sp_clase">${clases.map((k) => `<option value="${escA(k)}" ${(c.clase || "soft") === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></div>
        <div class="sp-prop"><label>Misión</label><select id="sp_mision"><option value="">Sin misión</option>${MISIONES.map(([k, l]) => `<option value="${k}" ${misionDe(c) === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="sp-prop"><label>Edita</label><select id="spEdita"><option value="">Yo</option>${eds.map((u) => `<option value="${esc(u.id)}" ${ed && ed.editor === u.id ? "selected" : ""}>${esc(u.display_name || u.username)}</option>`).join("")}</select></div>
      </div>
      <div class="ft-tabs">${FICHA_TABS.filter(([id]) => id !== "edicion" || ed).map(([id, l]) => `<button class="${fichaTab === id ? "on" : ""}" data-tab="${id}">${l}${id === "edicion" && ed.estado === "entregada" ? " · revisar" : ""}</button>`).join("")}</div>

      <div class="ft-sec" data-sec="guion">
        <div id="spRefs">${htmlRefsPieza(c)}</div>
        <div id="spAudios">${htmlAudiosPieza(c)}</div>
        ${campo("gancho", "Gancho", "La primera frase: lo que hace que se queden")}
        ${campo("cuerpo", "Cuerpo")}
        <div class="sp-grid2">${campo("cierre", "Cierre")}${campo("cta", "Llamada a la acción", "Comenta CLAUDE y te lo mando")}</div>
        <div class="ft-dur"><span id="spDur">${duracionTxt(palabrasDe(c))}</span></div>
      </div>

      <div class="ft-sec" data-sec="publicacion">
        <div class="sp-campo"><label for="sp_caption">Caption <span class="ft-cnt" id="spCapN">${String(c.caption || "").length} / 2.200</span></label><textarea id="sp_caption" rows="1" placeholder="Vacío">${esc(c.caption)}</textarea></div>
        <div class="sp-grid2">${input("hashtags", "Hashtags", "#claudecode #ia")}${input("palabra", "Palabra clave de la llamada a la acción", "CLAUDE")}</div>
        ${input("url", "Enlace del reel publicado", "https://www.instagram.com/reel/…")}
        ${c.ig ? htmlIgFicha(c.ig) : `<div class="sp-grid3">${input("views", "Visualizaciones", "—", "number")}${input("likes", "Likes", "—", "number")}${input("comments", "Comentarios", "—", "number")}</div>
        <div class="ft-nota">${IG_CON?.conectado ? "Sin números de Instagram todavía: si ya está publicada, pega arriba el enlace del reel y se enlaza en la próxima actualización." : "Los números se rellenan solos al conectar Instagram (arriba, en «Conectar Instagram»)."}</div>`}
      </div>

      <div class="ft-sec" data-sec="produccion">
        <div class="sp-grid2">${input("formato", "Formato", "a cámara · voz en off · mudo")}${input("fuente", "De dónde sale la idea")}</div>
        ${input("carpeta", "Material para editar", "Enlace de la carpeta de Drive")}
        ${campo("broll", "Recursos y B-roll")}
        ${campo("pantalla", "Pantalla")}
        ${input("archivo", "Vídeo final", "Enlace o ruta del vídeo final")}
        <div class="ft-sub"><span>Tomas</span><button class="btn-mini" id="spToma">${OSIcons.nueva} Toma</button></div>
        ${ts.length ? ts.map((t) => `<label class="ft-toma"><input type="checkbox" data-k="${(STATE.tomas || []).indexOf(t)}" ${t.estado === "grabada" ? "checked" : ""}><span>${esc(t.descripcion || "")}${t.lugar ? ` <i>· ${esc(t.lugar)}</i>` : ""}</span></label>`).join("") : `<div class="empty-note">Sin tomas apuntadas.</div>`}
        ${campo("produccion", "Notas de producción")}
        <div class="sp-grid2">${input("nota", "Nota del 1 al 10", "—", "number")}${input("porque_no_10", "Por qué no es un 10")}</div>
        ${legado}
      </div>

      ${ed ? `<div class="ft-sec" data-sec="edicion" id="spEdicion">${htmlEdicionFicha(c)}</div>` : ""}

      <div class="ft-sec" data-sec="notas">
        <div class="sp-sec">Notas libres
          <span class="pz-tools">
            <button data-f="h2" title="Título (# + espacio)">T</button>
            <button data-f="h3" title="Subtítulo (## + espacio)">T·</button>
            <button data-f="bold" title="Negrita (⌘B)"><b>B</b></button>
            <button data-f="underline" title="Subrayado (⌘U)"><u>U</u></button>
          </span>
        </div>
        <div class="sp-pizarra" id="spNotas" contenteditable="true" data-placeholder="Lo que sea: ideas sueltas, referencias, cambios… «# » para título, ⌘B negrita"></div>
      </div>
    </div></div>`;

  const muestra = (id) => {
    fichaTab = id;
    p.querySelectorAll(".ft-tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
    // la pestaña elegida, entera a la vista (solo de lado: la fila no lleva barra)
    const fila = p.querySelector(".ft-tabs"), on = fila?.querySelector("button.on");
    if (on) { const rf = fila.getBoundingClientRect(), rb = on.getBoundingClientRect(); fila.scrollLeft += rb.right > rf.right ? rb.right - rf.right : rb.left < rf.left ? rb.left - rf.left : 0; }
    p.querySelectorAll(".ft-sec").forEach((s) => s.classList.toggle("on", s.dataset.sec === id));
    creceCampos(p);
  };
  p.querySelectorAll(".ft-tabs button").forEach((b) => { b.onclick = () => muestra(b.dataset.tab); });
  muestra(fichaTab);
  bindRefs(c);
  bindAudios(c);
  auVigila(c.cid);

  $("spFull").onclick = () => { p.classList.toggle("full"); setTimeout(() => creceCampos(p), 450); };
  p.querySelectorAll(".sp-campo textarea").forEach((t) => t.addEventListener("input", () => creceCampo(t)));
  $("spCerrar").onclick = cerrarPieza;
  $("spTitulo").oninput = () => { c.titulo = $("spTitulo").value.trim(); guardaPiezaQuiet(); };
  $("spEstado").onchange = () => { muevePieza(c, $("spEstado").value); guardaPiezaQuiet(); renderPiezaPanel(); };
  OSUI.initDate($("spPub"));
  $("spPub").addEventListener("change", () => {
    const v = $("spPub").dataset.iso;
    if (estadoPieza(c) === "publicado") { if (v) c.fecha_pub = v; else delete c.fecha_pub; }
    else { if (v) c.fecha_plan = v; else delete c.fecha_plan; }
    guardaPiezaQuiet();
  });
  $("sp_clase").onchange = () => { c.clase = $("sp_clase").value; guardaPiezaQuiet(); };
  $("sp_mision").onchange = () => { const v = $("sp_mision").value; if (v) c.mision = v; else delete c.mision; guardaPiezaQuiet(); };
  const hora = $("sp_hora");
  hora.oninput = () => { let v = hora.value.replace(/[^\d]/g, "").slice(0, 4); if (v.length > 2) v = v.slice(0, 2) + ":" + v.slice(2); hora.value = v; };
  hora.onblur = () => {
    const m = hora.value.match(/^(\d{1,2}):?(\d{0,2})$/);
    if (!m) { if (!hora.value) { delete c.hora; guardaPiezaQuiet(); } return; }
    hora.value = `${String(Math.min(23, Number(m[1]) || 0)).padStart(2, "0")}:${String(Math.min(59, Number(m[2] || 0))).padStart(2, "0")}`;
    c.hora = hora.value;
    guardaPiezaQuiet();
  };

  const texto = ["gancho", "cuerpo", "cierre", "cta", "caption", "hashtags", "palabra", "url", "formato", "fuente", "carpeta", "broll", "pantalla", "archivo", "produccion", "porque_no_10"];
  for (const k of texto) {
    const el = $("sp_" + k);
    if (!el) continue;
    if (el.dataset.linea) el.onkeydown = (e) => { if (e.key === "Enter") e.preventDefault(); };
    el.oninput = () => {
      if (el.dataset.linea && /\n/.test(el.value)) el.value = el.value.replace(/\s*\n+\s*/g, " "); // pegado con saltos
      const v = el.value.trim();
      if (v) c[k] = v; else delete c[k];
      if (["gancho", "cuerpo", "cierre", "cta"].includes(k)) $("spDur").textContent = duracionTxt(palabrasDe(c));
      if (k === "caption") $("spCapN").textContent = `${el.value.length} / 2.200`;
      guardaPiezaQuiet();
    };
  }
  for (const k of ["views", "likes", "comments", "nota"]) {
    const el = $("sp_" + k);
    if (!el) continue; // con los números de Instagram no hay campos a mano
    el.oninput = () => { const n = Number(el.value); if (el.value !== "" && Number.isFinite(n)) c[k] = n; else delete c[k]; guardaPiezaQuiet(); };
  }

  p.querySelectorAll(".ft-toma input").forEach((cb) => {
    cb.onchange = async () => {
      const t = (STATE.tomas || [])[Number(cb.dataset.k)];
      if (!t) return;
      if (cb.checked) { t.estado = "grabada"; t.grabada_el = isoLocal(new Date()); } else { t.estado = "pendiente"; delete t.grabada_el; }
      await postClaves({ tomas: STATE.tomas });
    };
  });
  $("spToma").onclick = async () => { if (await nuevaToma(c.cid)) { fichaTab = "produccion"; renderPiezaPanel(); } };

  $("spEdita").onchange = async () => {
    const editor_id = $("spEdita").value || null;
    try {
      const r = await apiPost(`/api/edicion/${encodeURIComponent(c.cid)}/asignar`, { editor_id });
      if (r.edicion) { c.edicion = r.edicion; fichaTab = "edicion"; } else delete c.edicion;
      renderPiezaPanel();
    } catch (e) { alert("No se pudo asignar: " + e.message); renderPiezaPanel(); }
  };
  if (ed) {
    const actualiza = async (body) => { await edActualiza(c, body); renderPiezaPanel(); };
    $("edEstado").onchange = () => actualiza({ estado: $("edEstado").value }).catch((e) => alert(e.message));
    OSUI.initDate($("edLimite"));
    $("edLimite").addEventListener("change", () => actualiza({ fecha_limite: $("edLimite").dataset.iso || null }).catch((e) => alert(e.message)));
    $("edBrief").oninput = () => {
      clearTimeout(briefTimer);
      const v = $("edBrief").value;
      briefTimer = setTimeout(() => apiPost(`/api/edicion/${encodeURIComponent(c.cid)}`, { brief: v }).then((r) => { c.edicion = r.edicion; }).catch((e) => alert("No se guardaron las indicaciones: " + e.message)), 700);
    };
    const ap = $("edAprobar"), cb = $("edCambios");
    if (ap) ap.onclick = () => actualiza({ estado: "aprobada" }).catch((e) => alert(e.message));
    if (cb) cb.onclick = async () => {
      const nota = await OSUI.prompt("Pedir cambios", "", { label: "Qué hay que cambiar", placeholder: "Quita el corte del segundo 12 y sube la música", ok: "Enviar" });
      if (nota === null) return;
      actualiza({ estado: "cambios", nota }).catch((e) => alert(e.message));
    };
    const enviar = async () => {
      const t = $("edMsg").value.trim();
      if (!t) return;
      try { const r = await apiPost(`/api/edicion/${encodeURIComponent(c.cid)}/mensaje`, { texto: t }); c.edicion = r.edicion; renderPiezaPanel(); }
      catch (e) { alert("No se envió: " + e.message); }
    };
    $("edMsgBtn").onclick = enviar;
    $("edMsg").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); enviar(); } };
  }

  initPizarra(c, p, guardaPiezaQuiet);
  $("spBorrar").onclick = async () => {
    if (!(await OSUI.confirm("Borrar pieza", `«${esc(c.titulo || "(sin título)")}» se elimina del todo.`, { ok: "Sí, borrar" }))) return;
    if (auGrabando?.cid === c.cid) auPara(true);
    auCierra();
    // sus audios no se quedan huérfanos en el servidor
    for (const a of c.audios || []) fetch(`/api/audios/${encodeURIComponent(a.id)}`, { method: "DELETE", credentials: "include" }).catch(() => {});
    STATE.contenido.splice(piezaIdx, 1);
    clearTimeout(piezaTimer);
    piezaPendiente = false;
    piezaIdx = null;
    $("piezaPanel").classList.remove("show", "full");
    saveClave("contenido");
  };
}

/* ======================== GYM: tracker + rutina ======================== */
const DIAS_SEM = [
  { id: "lunes", l: "L" }, { id: "martes", l: "M" }, { id: "miercoles", l: "X" },
  { id: "jueves", l: "J" }, { id: "viernes", l: "V" }, { id: "sabado", l: "S" }, { id: "domingo", l: "D" },
];

// rutina por defecto vacía: cada persona monta la suya en Gym → Rutina (o se la pide a Claude)
const RUTINA_DEFAULT = Object.fromEntries(["lunes", "martes", "miercoles", "jueves", "viernes", "sabado", "domingo"].map((d) => [d, { titulo: "", ejercicios: [] }]));

function rutinaGym() { return STATE.rutina_gym || RUTINA_DEFAULT; }
function rutinaEditable() {
  if (!STATE.rutina_gym) STATE.rutina_gym = JSON.parse(JSON.stringify(RUTINA_DEFAULT));
  return STATE.rutina_gym;
}

let trackDia = DIAS_SEM[(new Date().getDay() + 6) % 7].id;

function fechaDeDia(diaId) {
  const hoy = new Date();
  const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
  const d = new Date(lunes);
  d.setDate(lunes.getDate() + DIAS_SEM.findIndex((x) => x.id === diaId));
  return isoLocal(d);
}

/* referencia en gris: la última sesión ANTERIOR que tenga ese ejercicio (hasta 28 días atrás).
   Antes miraba solo f-7, así que mover un entreno de día hacía desaparecer la referencia. */
function ultimaSesionCon(nombre, antesDe, dias = 28) {
  const lim = isoLocal(new Date(new Date(antesDe + "T12:00").getTime() - dias * 86400000));
  let mejor = null;
  for (const fe of Object.keys(STATE.entrenos || {})) {
    if (fe >= antesDe || fe < lim) continue;
    const sets = STATE.entrenos[fe]?.sets?.[nombre];
    if (!Array.isArray(sets) || !sets.some((x) => x && (x.kg != null || x.reps != null))) continue;
    if (!mejor || fe > mejor.fecha) mejor = { fecha: fe, sets };
  }
  return mejor;
}
const conDatos = (sets) => Array.isArray(sets) && sets.some((x) => x && (x.kg != null || x.reps != null));

function gymTracker() {
  const f = fechaDeDia(trackDia);
  const hoy = isoLocal(new Date());
  const dia = rutinaGym()[trackDia] || { titulo: "", ejercicios: [] };
  const ent = STATE.entrenos?.[f]?.sets || {};

  const chips = `<div class="filtros" style="margin-bottom:14px">` + DIAS_SEM.map((d) => {
    const df = fechaDeDia(d.id);
    return `<button class="${d.id === trackDia ? "on" : ""}" onclick="trackDia='${d.id}';renderContent()">${d.l} <small style="opacity:.65">${df.slice(8)}</small></button>`;
  }).join("") + `</div>`;

  if (!dia.ejercicios.length) {
    return chips + `<div class="card"><h2>${esc(dia.titulo || "Descanso")}</h2><div class="empty-note">Día de descanso. Si entrenas igual, añade ejercicios a este día en la pestaña Rutina.</div></div>`;
  }

  const filasDe = (nombre, hechas, previas, nSets) => {
    let filas = "";
    const arg = JSON.stringify(nombre).replace(/"/g, "&quot;");
    for (let i = 0; i < nSets; i++) {
      const h = hechas[i] || {};
      const p = previas[i] || {};
      filas += `<div class="serie-row">
        <span class="sn">S${i + 1}</span>
        <input type="number" inputmode="decimal" step="any" placeholder="${p.kg ?? "kg"}" value="${h.kg ?? ""}"
          oninput="trackInput('${f}',${arg},${i},'kg',this.value)">
        <span class="x">×</span>
        <input type="number" inputmode="numeric" placeholder="${p.reps ?? "reps"}" value="${h.reps ?? ""}"
          oninput="trackInput('${f}',${arg},${i},'reps',this.value)">
      </div>`;
    }
    return filas;
  };

  const bloques = dia.ejercicios.map((e) => {
    const hechas = ent[e.nombre] || [];
    const ref = ultimaSesionCon(e.nombre, f);
    const previas = ref?.sets || [];
    const nSets = Math.max(Number(e.series) || 1, hechas.length);
    const refTxt = ref ? `<span class="ej-ref">· ${ref.fecha.slice(8)}/${ref.fecha.slice(5, 7)}</span>` : "";
    return `<div class="ejercicio">
      <div class="ej-head">
        <span class="ej-nombre">${esc(e.nombre)}</span>${refTxt}
        <span class="ej-obj">${e.series}×${esc(String(e.reps || ""))}</span>
      </div>
      ${e.nota ? `<div class="ej-nota">${esc(e.nota)}</div>` : ""}
      <div class="series">${filasDe(e.nombre, hechas, previas, nSets)}</div>
    </div>`;
  }).join("");

  /* apuntado ese día pero fuera de la rutina: recuperaciones, cambios sobre la marcha
     o nombres que escribió la IA. Sin esto existía en la BD y no se veía en ningún sitio. */
  const enRutina = new Set(dia.ejercicios.map((e) => e.nombre));
  const sueltos = Object.keys(ent).filter((n) => !enRutina.has(n) && conDatos(ent[n]));
  const fuera = !sueltos.length ? "" : `<div class="fuera-head"><span class="t">Fuera de la rutina</span><span class="d">apuntado este día pero no está en ${esc(dia.titulo || "la rutina")}</span></div>` +
    sueltos.map((n) => {
      const ref = ultimaSesionCon(n, f);
      const refTxt = ref ? `<span class="ej-ref">· ${ref.fecha.slice(8)}/${ref.fecha.slice(5, 7)}</span>` : "";
      return `<div class="ejercicio">
        <div class="ej-head"><span class="ej-nombre">${esc(n)}</span>${refTxt}</div>
        <div class="series">${filasDe(n, ent[n] || [], ref?.sets || [], (ent[n] || []).length)}</div>
      </div>`;
    }).join("");

  const titulo = `${esc(dia.titulo)} · ${f === hoy ? "hoy" : f.slice(8) + "/" + f.slice(5, 7)}`;
  return chips + `<div class="card">
    <h2>${titulo}</h2>
    <div class="sub">Apunta kg × reps por serie — se guarda solo. En gris, tu última sesión de cada ejercicio, con su fecha.</div>
    ${bloques}${fuera}</div>`;
}

/* guardado silencioso del tracker (sin re-render: no roba el foco al escribir) */
let trackTimer = null;
function trackInput(f, nombre, si, campo, val) {
  if (!STATE.entrenos) STATE.entrenos = {};
  const ent = (STATE.entrenos[f] = STATE.entrenos[f] || { dia: trackDia, sets: {} });
  const arr = (ent.sets[nombre] = ent.sets[nombre] || []);
  while (arr.length <= si) arr.push({});
  const n = Number(String(val).replace(",", "."));
  if (String(val).trim() === "" || !Number.isFinite(n)) delete arr[si][campo];
  else arr[si][campo] = n;
  clearTimeout(trackTimer);
  trackTimer = setTimeout(() => saveEntrenos(f), 700);
}

async function saveEntrenos(f) {
  try {
    // entrenos completo se sustituye en el POST: refrescar y conservar solo mi fecha editada
    const mio = STATE.entrenos?.[f];
    try {
      const fresh = await (await fetch("/api/state", { credentials: "include" })).json();
      if (fresh && fresh.entrenos) STATE.entrenos = fresh.entrenos;
    } catch (e) {}
    if (!STATE.entrenos) STATE.entrenos = {};
    if (mio) STATE.entrenos[f] = mio;
    const res = await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ entrenos: STATE.entrenos }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    // si hay series apuntadas, el día cuenta como entreno (hábito)
    const tiene = Object.values(mio?.sets || {}).some((a) => a.some((s) => s.kg != null || s.reps != null));
    if (tiene && !STATE.days?.[f]?.senales?.entreno) {
      await fetch("/api/day", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ fecha: f, senales: { entreno: true } }),
      });
      if (!STATE.days) STATE.days = {};
      STATE.days[f] = STATE.days[f] || { senales: {} };
      STATE.days[f].senales = { ...(STATE.days[f].senales || {}), entreno: true };
    }
  } catch (e) {
    alert("No se guardó el entreno: " + e.message);
  }
}

const EJ_CAMPOS = (e = {}) => [
  { id: "nombre", label: "Ejercicio", valor: e.nombre || "", placeholder: "Press inclinado máquina" },
  { id: "series", label: "Series", tipo: "number", valor: e.series ?? 3 },
  { id: "reps", label: "Reps (texto libre)", valor: e.reps || "", placeholder: "8-12" },
  { id: "nota", label: "Nota (opcional)", valor: e.nota || "", placeholder: "última serie: drop set" },
];

function aplicaEjercicio(e, f) {
  e.nombre = f.nombre.trim();
  const s = Math.round(Number(f.series));
  e.series = Number.isFinite(s) && s > 0 ? s : 3;
  e.reps = f.reps.trim();
  if (f.nota.trim()) e.nota = f.nota.trim(); else delete e.nota;
}

async function nuevoEjercicio(diaId) {
  const f = await OSUI.form({ titulo: "Nuevo ejercicio", campos: EJ_CAMPOS(), ok: "Añadir" });
  if (!f || !f.nombre.trim()) return;
  const r = rutinaEditable();
  r[diaId] = r[diaId] || { titulo: "", ejercicios: [] };
  const e = {};
  aplicaEjercicio(e, f);
  r[diaId].ejercicios.push(e);
  saveClave("rutina_gym");
}

/* El historial de `entrenos` se indexa por NOMBRE de ejercicio: si se renombra en la rutina
   y no se migra, las series antiguas quedan huérfanas y el ejercicio parece nuevo.
   Refresca antes de escribir para no pisar lo que se haya apuntado desde otro sitio. */
async function migrarNombreEntrenos(viejo, nuevo) {
  try {
    const fresh = await (await fetch("/api/state", { credentials: "include" })).json();
    if (fresh?.entrenos) STATE.entrenos = fresh.entrenos;
  } catch (e) {}
  const ent = STATE.entrenos || {};
  const movidas = [], chocadas = [];
  for (const fe of Object.keys(ent)) {
    const sets = ent[fe]?.sets;
    if (!sets || !sets[viejo]) continue;
    if (sets[nuevo]) { chocadas.push(fe); continue; } // ya hay series con el nombre nuevo: no las piso
    sets[nuevo] = sets[viejo];
    delete sets[viejo];
    movidas.push(fe);
  }
  if (movidas.length) {
    const res = await fetch("/api/state", {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
      body: JSON.stringify({ entrenos: ent }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
  }
  return { movidas, chocadas };
}

function fechasConEjercicio(nombre) {
  return Object.keys(STATE.entrenos || {}).filter((fe) => STATE.entrenos[fe]?.sets?.[nombre]);
}

async function editarEjercicio(diaId, i) {
  const r = rutinaEditable();
  const e = r[diaId]?.ejercicios?.[i];
  if (!e) return;
  const f = await OSUI.form({ titulo: "Editar ejercicio", campos: EJ_CAMPOS(e), ok: "Guardar", borrar: true });
  if (!f) return;
  if (f === "borrar") {
    const n = fechasConEjercicio(e.nombre).length;
    if (!(await OSUI.confirm("Quitar ejercicio", `«${esc(e.nombre)}» sale de la rutina.${n ? ` Sus ${n} ${n === 1 ? "entreno apuntado se queda" : "entrenos apuntados se quedan"} en el historial.` : ""}`, { ok: "Sí, quitar" }))) return;
    r[diaId].ejercicios.splice(i, 1);
  } else {
    const nuevo = f.nombre.trim();
    if (!nuevo) return;
    const viejo = e.nombre;
    let migrar = false;
    if (nuevo !== viejo) {
      const n = fechasConEjercicio(viejo).length;
      if (n) {
        migrar = await OSUI.confirm(
          "Renombrar también el historial",
          `«${esc(viejo)}» tiene series apuntadas en ${n} ${n === 1 ? "entreno" : "entrenos"}. Si no las renombras, se quedan con el nombre viejo y el ejercicio empezará de cero.`,
          { ok: `Sí, renombrar ${n === 1 ? "el entreno" : "los " + n + " entrenos"}`, danger: false }
        );
      }
    }
    aplicaEjercicio(e, f);
    if (migrar) {
      try {
        const { movidas, chocadas } = await migrarNombreEntrenos(viejo, nuevo);
        if (chocadas.length) alert(`Renombrados ${movidas.length} entrenos. En ${chocadas.length} ya había series con el nombre nuevo, así que esos los dejé como estaban para no pisarlos.`);
      } catch (err) {
        alert("El ejercicio se renombró, pero el historial no: " + err.message);
      }
    }
  }
  saveClave("rutina_gym");
}

function moverEjercicio(diaId, i, dir) {
  const r = rutinaEditable();
  const arr = r[diaId]?.ejercicios;
  if (!arr) return;
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  saveClave("rutina_gym");
}

  gymResumen() {

  nutricion() {
    const hoy = new Date();
    const lunes = new Date(hoy);
    lunes.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
    const lunesISO = isoLocal(lunes);
    const lunesPasado = new Date(lunes); lunesPasado.setDate(lunes.getDate() - 7);
    const lunesPasadoISO = isoLocal(lunesPasado);
    const fechas30 = [];
    for (let i = 29; i >= 0; i--) { const d = new Date(hoy); d.setDate(hoy.getDate() - i); fechas30.push(isoLocal(d)); }
    const on = (f) => senalOn(f, "nutricion");
    const estaSemana = fechas30.filter((f) => f >= lunesISO && on(f)).length;
    const semanaPasada = fechas30.filter((f) => f >= lunesPasadoISO && f < lunesISO && on(f)).length;
    const total30 = fechas30.filter(on).length;
    const reg30 = fechas30.filter((f) => {
      const v = STATE.days?.[f]?.senales?.nutricion;
      return v !== undefined && v !== null;
    }).length;

    // racha de días en objetivo (hoy sin registrar no la corta)
    let racha = 0;
    for (let i = fechas30.length - 1; i >= 0; i--) {
      const v = STATE.days?.[fechas30[i]]?.senales?.nutricion;
      if (v === undefined || v === null) { if (i === fechas30.length - 1) continue; break; }
      if (v === true) racha++; else break;
    }

    const kpis = `<div class="mini-kpis">
      <div class="mkpi"><div class="n">${estaSemana}<small>/sem</small></div><div class="l">Esta semana</div></div>
      <div class="mkpi"><div class="n">${semanaPasada}<small>/sem</small></div><div class="l">Semana pasada</div></div>
      <div class="mkpi"><div class="n">${total30}<small> de ${reg30}</small></div><div class="l">Días en objetivo · 30d</div></div>
      <div class="mkpi"><div class="n">${racha}<small> ${racha === 1 ? "día" : "días"}</small></div><div class="l">Racha actual</div></div>

/* ---------- finanzas: helpers ---------- */
const movs = () => STATE.finanzas || [];
const cuentas = () => STATE.cuentas || [];
const subs = () => STATE.suscripciones || [];

function sumMov(list, tipo) {
  return list.filter((m) => m.tipo === tipo).reduce((a, m) => a + (Number(m.importe) || 0), 0);
}
function movsDelMes(mes) { return movs().filter((m) => (m.fecha || "").startsWith(mes)); }
function saldoTotal() { return cuentas().reduce((a, c) => a + (Number(c.saldo) || 0), 0); }
function cuotaMensual(s) {
  const imp = Number(s.importe) || 0;
  return s.periodicidad === "anual" ? imp / 12 : imp;
}
function fijosMes() {
  return subs().filter((s) => s.activa !== false).reduce((a, s) => a + cuotaMensual(s), 0);
}
function mesesConMovs() {
  const set = new Set(movs().map((m) => (m.fecha || "").slice(0, 7)).filter((x) => x.length === 7));
  set.add(new Date().toISOString().slice(0, 7));
  return [...set].sort().reverse();
}
/* agrupa movimientos por día con cabecera "SÁBADO, 15 AGO · neto" */
function gruposPorDia(lista) {
  const porFecha = {};
  for (const m of lista) (porFecha[m.fecha || "?"] = porFecha[m.fecha || "?"] || []).push(m);
  return Object.keys(porFecha).sort().reverse().map((f) => {
    const dia = porFecha[f];
    const neto = dia.reduce((a, m) => a + (m.tipo === "ingreso" ? 1 : -1) * (Number(m.importe) || 0), 0);
    const txt = f !== "?"
      ? new Date(f + "T12:00").toLocaleDateString("es", { weekday: "long", day: "numeric", month: "short" })
      : "sin fecha";
    return `<div class="dia-head"><span>${esc(txt)}</span><span>${fmtMonto(neto, "€", neto < 0 ? "−" : "+")}</span></div>` +
      dia.map(movItem).join("");
  }).join("");
}

/* evolución del mes: SALDO TOTAL día a día (reconstruido hacia atrás desde el saldo actual) */
function lineaEvolucion(mes) {
  const [y, mo] = mes.split("-").map(Number);
  const nDias = new Date(y, mo, 0).getDate();
  const hoy = isoLocal(new Date());
  const ultimo = hoy.startsWith(mes) ? Number(hoy.slice(8)) : nDias;
  if (ultimo < 1) return `<div class="empty-note">Mes futuro.</div>`;
  const saldoNow = saldoTotal();
  const todos = movs();
  const serie = [];
  for (let d = 1; d <= ultimo; d++) {
    const fecha = `${mes}-${String(d).padStart(2, "0")}`;
    let despues = 0;
    for (const m of todos) if ((m.fecha || "") > fecha) despues += (m.tipo === "ingreso" ? 1 : -1) * (Number(m.importe) || 0);
    serie.push(Math.round((saldoNow - despues) * 100) / 100);
  }

  const W = 640, H = 180, PL = 8, PR = 8, PT = 14, PB = 22;
  const iw = W - PL - PR, ih = H - PT - PB;
  let lo = Math.min(...serie), hi = Math.max(...serie);
  const pad = (hi - lo || Math.max(1, Math.abs(hi) * 0.1)) * 0.12;
  lo -= pad; hi += pad;
  const span = hi - lo || 1;
  const x = (i) => PL + (serie.length === 1 ? iw / 2 : (iw * i) / (serie.length - 1));
  const yDe = (v) => PT + ih - ((v - lo) / span) * ih;
  const pts = serie.map((v, i) => ({ x: x(i), y: yDe(v) }));
  const linea = pathSuave(pts);
  const fondo = PT + ih;
  const area = `${linea} L ${pts[pts.length - 1].x.toFixed(1)} ${fondo} L ${pts[0].x.toFixed(1)} ${fondo} Z`;
  const fin = serie[serie.length - 1];

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  if (lo < 0 && hi > 0) svg += `<line x1="${PL}" y1="${yDe(0).toFixed(1)}" x2="${W - PR}" y2="${yDe(0).toFixed(1)}" stroke="var(--grid)" stroke-dasharray="4 4"/>`;
  svg += `<path d="${area}" fill="var(--serie-1)" opacity="0.08"/>`;
  svg += `<path d="${linea}" fill="none" stroke="var(--serie-1)" stroke-width="2" stroke-linecap="round"/>`;
  svg += `<circle cx="${pts[pts.length - 1].x.toFixed(1)}" cy="${pts[pts.length - 1].y.toFixed(1)}" r="3.5" fill="var(--serie-1)"/>`;
  const marcas = serie.length > 2 ? [0, Math.floor((serie.length - 1) / 2), serie.length - 1] : serie.map((_, i) => i);
  for (const i of marcas) svg += `<text x="${pts[i].x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${i + 1}</text>`;
  svg += `<text x="${(pts[pts.length - 1].x - 6).toFixed(1)}" y="${Math.max(11, pts[pts.length - 1].y - 9).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${fmtMonto(fin, "€", fin < 0 ? "−" : "")}</text>`;
  svg += `</svg>`;
  return svg;
}

/* esquema de gastos del mes por categoría (barras) */
function esquemaGastos(mes) {
  const gastos = movsDelMes(mes).filter((m) => m.tipo === "gasto");
  if (!gastos.length) return `<div class="empty-note">Sin gastos este mes.</div>`;
  const porCat = {};
  for (const m of gastos) {
    const c = m.categoria || "Sin categoría";
    porCat[c] = (porCat[c] || 0) + (Number(m.importe) || 0);
  }
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const total = cats.reduce((a, [, v]) => a + v, 0);
  return cats.map(([c, v]) => `
    <div class="catg-row">
      <span class="cn">${esc(c)}</span>
      <span class="cbar"><i style="width:${Math.max(2, (v / total) * 100).toFixed(1)}%"></i></span>
      <span class="cv">${eur(v)}<small> · ${Math.round((v / total) * 100)}%</small></span>
    </div>`).join("");
}

function simboloDivisa(d) { return d === "USD" ? "US$" : d === "GBP" ? "£" : d === "EUR" ? "€" : d || "€"; }
function fmtMonto(n, simbolo = "€", signo = "") {
  const v = Math.abs(Number(n) || 0);
  return `${signo}${v.toLocaleString("es", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${simbolo}`;
}

function movItem(m) {
  const gi = movs().indexOf(m);
  const neg = m.tipo === "gasto";
  const signo = neg ? "−" : "+";
  const inicial = (String(m.concepto || "?").trim().charAt(0) || "?").toUpperCase();
  const orig = m.divisa && m.divisa !== "EUR" && m.importe_original != null;
  const fechaTxt = m.fecha ? new Date(m.fecha + "T12:00").toLocaleDateString("es", { day: "numeric", month: "short" }) : "";
  const meta = [m.cuenta, fechaTxt].filter(Boolean).join(" · ");
  return `<div class="mov" onclick="editarMov(${gi})" title="Toca para editar">
    <span class="avatar">${esc(inicial)}</span>
    <div class="minfo"><div class="mn">${esc(m.concepto || "(sin concepto)")}</div><div class="mmeta">${esc(meta)}</div></div>
    ${m.categoria ? `<span class="cat-chip">${esc(m.categoria)}</span>` : ""}
    <div class="mimp">
      <div class="mv${neg ? "" : " pos"}">${orig ? fmtMonto(m.importe_original, simboloDivisa(m.divisa), signo) : fmtMonto(m.importe, "€", signo)}</div>
      ${orig ? `<div class="maprox">≈ ${fmtMonto(m.importe, "€", signo)}</div>` : ""}
    </div>
  </div>`;
}

const CATS_GASTO = ["Comida", "Compras", "Suscripciones", "Transporte", "Ocio", "Salud", "Negocio", "Otros gastos"];
const CATS_INGRESO = ["Trabajo", "Clientes", "Contenido", "Otros ingresos"];

function opcionesCategoria(actual) {
  const ops = [{ v: "", l: "(sin categoría)" }];
  for (const c of CATS_GASTO) ops.push({ v: c, l: "Gasto · " + c });
  for (const c of CATS_INGRESO) ops.push({ v: c, l: "Ingreso · " + c });
  if (actual && !CATS_GASTO.includes(actual) && !CATS_INGRESO.includes(actual)) ops.push({ v: actual, l: actual });
  return ops;
}

const MOV_CAMPOS = (m = {}) => [
  { id: "concepto", label: "Concepto", valor: m.concepto || "", placeholder: "Cobro nómina" },
  { id: "importe", label: "Importe (€)", tipo: "number", valor: m.importe ?? "" },
  { id: "tipo", label: "Tipo", tipo: "select", valor: m.tipo || "gasto", opciones: [{ v: "gasto", l: "Gasto" }, { v: "ingreso", l: "Ingreso" }] },
  { id: "fecha", label: "Fecha", tipo: "date", valor: m.fecha || isoLocal(new Date()) },
  { id: "categoria", label: "Categoría", tipo: "select", valor: m.categoria || "", opciones: opcionesCategoria(m.categoria) },
  { id: "cuenta", label: "Cuenta (opcional)", valor: m.cuenta || "" },
];

function aplicaMovForm(m, r) {
  m.concepto = r.concepto.trim();
  m.importe = Number(String(r.importe).replace(",", "."));
  m.tipo = r.tipo;
  m.fecha = r.fecha || isoLocal(new Date());
  if (r.categoria.trim()) m.categoria = r.categoria.trim(); else delete m.categoria;
  if (r.cuenta.trim()) m.cuenta = r.cuenta.trim(); else delete m.cuenta;
}

async function nuevoMov() {
  const r = await OSUI.form({ titulo: "Nuevo movimiento", campos: MOV_CAMPOS(), ok: "Añadir" });
  if (!r || !r.concepto.trim() || !Number.isFinite(Number(String(r.importe).replace(",", ".")))) return;
  const m = {};
  aplicaMovForm(m, r);
  if (!Array.isArray(STATE.finanzas)) STATE.finanzas = [];
  STATE.finanzas.push(m);
  saveClave("finanzas");
}

async function editarMov(gi) {
  const m = movs()[gi];
  if (!m) return;
  const r = await OSUI.form({ titulo: "Editar movimiento", campos: MOV_CAMPOS(m), ok: "Guardar", borrar: true });
  if (!r) return;
  if (r === "borrar") {
    if (!(await OSUI.confirm("Borrar movimiento", `«${esc(m.concepto)}» (${eur(m.importe)}) se elimina.`, { ok: "Sí, borrar" }))) return;
    STATE.finanzas.splice(gi, 1);
  } else {
    if (!r.concepto.trim() || !Number.isFinite(Number(String(r.importe).replace(",", ".")))) return;
    aplicaMovForm(m, r);
  }
  saveClave("finanzas");
}

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:8px;flex-wrap:wrap">
        <h2>Cuentas · total ${eur(saldoTotal())}</h2>

      <div id="finBancos" style="margin-top:10px"></div>

      <div class="empty-note" style="margin-top:10px">Las cuentas conectadas se actualizan solas cada día. Las manuales (efectivo, ahorro…) las tocas aquí.</div></div>`;
  },

  transacciones() {
    const meses = mesesConMovs();
    if (!meses.includes(finMes)) finMes = meses[0];
    const delMes = movsDelMes(finMes).slice().reverse();
    const ing = sumMov(delMes, "ingreso"), gas = sumMov(delMes, "gasto");
    const mesTxt = new Date(finMes + "-15T12:00").toLocaleDateString("es", { month: "long", year: "numeric" });
    const sel = `<div style="position:relative;display:inline-block;margin-bottom:10px">
      <button class="btn-mini" id="mesBtn" onclick="abrirMesPicker()">${OSIcons.calendario} ${mesTxt.charAt(0).toUpperCase() + mesTxt.slice(1)}</button>
    </div>`;
    return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <h2>Transacciones</h2>
        <button class="btn-mini primary" onclick="nuevoMov()">${OSIcons.nueva} Movimiento</button>
      </div>${sel}
      <div class="fin-total">
        <div><div class="k">Ingresos</div><div class="v ok">${eur(ing)}</div></div>
        <div><div class="k">Gastos</div><div class="v">${eur(gas)}</div></div>
        <div><div class="k">Neto</div><div class="v ${ing - gas >= 0 ? "ok" : "ko"}">${eur(ing - gas)}</div></div>
      </div>
      ${delMes.length ? gruposPorDia(delMes) : `<div class="empty-note">Sin movimientos en ${finMes}.</div>`}</div>`;
  },

  suscripciones() {
    const activas = subs().filter((s) => s.tipo !== "deuda");
    const deudas = subs().filter((s) => s.tipo === "deuda");
    const subHtml = activas.length ? activas.map((s) => `
      <div class="item row-click" style="${s.activa === false ? "opacity:0.45" : ""}" onclick="editarSub(${subs().indexOf(s)})" title="Toca para editar">
        <div class="head"><span class="name">${esc(s.nombre)}</span><span class="badge">${eur(s.importe)}/${s.periodicidad === "anual" ? "año" : "mes"}</span></div>
        <div class="meta">${s.dia_cobro ? "cobro día " + s.dia_cobro : ""}${s.activa === false ? " · inactiva" : ""}</div>
      </div>`).join("")
      : `<div class="empty-note">Sin suscripciones. Añade una aquí o dile a Claude «pago 20€/mes de ChatGPT el día 3».</div>`;
    const totalSubs = activas.filter((s) => s.activa !== false).reduce((a, s) => a + cuotaMensual(s), 0);
    const deudaHtml = deudas.length ? deudas.map((s) => {
      const pendiente = (Number(s.cuotas_restantes) || 0) * (Number(s.importe) || 0);
      return `<div class="item row-click" style="${s.activa === false ? "opacity:0.45" : ""}" onclick="editarSub(${subs().indexOf(s)})" title="Toca para editar">
        <div class="head"><span class="name">${esc(s.nombre)}</span><span class="badge gasto">${eur(s.importe)}/mes</span></div>
        <div class="meta">${s.cuotas_restantes != null ? s.cuotas_restantes + " cuotas restantes · " + eur(pendiente) + " pendiente" : ""}${s.fin ? " · termina " + s.fin : ""}</div>
      </div>`;
    }).join("")
      : `<div class="empty-note">Sin deudas financiadas.</div>`;
    return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <h2>Suscripciones · ${eur(totalSubs)}/mes</h2>
        <button class="btn-mini primary" onclick="nuevaSub()">${OSIcons.nueva} Nueva</button>
      </div>${subHtml}</div>
      <div class="card"><h2>Deudas</h2>${deudaHtml}</div>`;
  },

  ahorro() {
    const objetivo = Number(STATE.config_finanzas?.objetivo_ahorro) || 0;
    const ahorrado = cuentas().filter((c) => c.tipo === "ahorro").reduce((a, c) => a + (Number(c.saldo) || 0), 0);
    const pct = objetivo > 0 ? Math.min(100, (ahorrado / objetivo) * 100) : 0;
    // ritmo: neto medio de los últimos 3 meses completos con movimientos
    const meses = mesesConMovs().filter((m) => m < new Date().toISOString().slice(0, 7)).slice(0, 3);
    let ritmo = null;
    if (meses.length) {
      const netos = meses.map((m) => { const l = movsDelMes(m); return sumMov(l, "ingreso") - sumMov(l, "gasto"); });
      ritmo = netos.reduce((a, b) => a + b, 0) / netos.length;
    }
    let eta = "";
    if (ritmo !== null && ritmo > 0 && objetivo > ahorrado) {
      const mesesFalta = Math.ceil((objetivo - ahorrado) / ritmo);
      const d = new Date(); d.setMonth(d.getMonth() + mesesFalta);
      eta = `A ritmo actual (${eur(ritmo)}/mes de neto): objetivo en ~${mesesFalta} meses (${d.toLocaleDateString("es", { month: "long", year: "numeric" })}).`;
    } else if (ritmo !== null && ritmo <= 0) {
      eta = `El neto medio de los últimos meses es ${eur(ritmo)} — a este ritmo el objetivo no llega. Ahí está el trabajo.`;
    } else {
      eta = "Aún no hay meses cerrados con movimientos para estimar el ritmo.";
    }
    const sinCuenta = !cuentas().some((c) => c.tipo === "ahorro");
    return `<div class="card"><h2>Ahorro</h2>
      <div class="fin-total">
        <div><div class="k">Ahorrado</div><div class="v ok">${eur(ahorrado)}</div></div>
        <div><div class="k">Objetivo</div><div class="v">${eur(objetivo)}</div></div>
        <div><div class="k">Progreso</div><div class="v">${pct.toFixed(0)}%</div></div>
      </div>
      <div class="meter"><div class="fill" style="width:${pct}%"></div></div>
      <div class="empty-note">${eta}</div>
      ${sinCuenta ? `<div class="empty-note" style="margin-top:8px">No hay ninguna cuenta de tipo «ahorro» — márcala en Cuentas o dile a Claude «mi cuenta X es de ahorro».</div>` : ""}
    </div>` + journalCard("finanzas");
  },
};

const SUB_CAMPOS = (s = {}) => [
  { id: "nombre", label: "Nombre", valor: s.nombre || "", placeholder: "ChatGPT" },
  { id: "importe", label: "Importe (€)", tipo: "number", valor: s.importe ?? "" },
  { id: "tipo", label: "Tipo", tipo: "select", valor: s.tipo === "deuda" ? "deuda" : "suscripcion", opciones: [{ v: "suscripcion", l: "Suscripción" }, { v: "deuda", l: "Deuda financiada" }] },
  { id: "periodicidad", label: "Periodicidad", tipo: "select", valor: s.periodicidad || "mensual", opciones: [{ v: "mensual", l: "Mensual" }, { v: "anual", l: "Anual" }] },
  { id: "dia_cobro", label: "Día de cobro (opcional)", tipo: "number", valor: s.dia_cobro ?? "" },
  { id: "cuotas_restantes", label: "Cuotas restantes (solo deudas)", tipo: "number", valor: s.cuotas_restantes ?? "" },
  { id: "activa", label: "Estado", tipo: "select", valor: s.activa === false ? "no" : "si", opciones: [{ v: "si", l: "Activa" }, { v: "no", l: "Inactiva" }] },
];

function aplicaSubForm(s, r) {
  s.nombre = r.nombre.trim();
  s.importe = Number(String(r.importe).replace(",", "."));
  s.tipo = r.tipo;
  s.periodicidad = r.periodicidad;
  const dia = Number(r.dia_cobro), cuotas = Number(r.cuotas_restantes);
  if (r.dia_cobro !== "" && Number.isFinite(dia)) s.dia_cobro = dia; else delete s.dia_cobro;
  if (r.cuotas_restantes !== "" && Number.isFinite(cuotas)) s.cuotas_restantes = cuotas; else delete s.cuotas_restantes;
  s.activa = r.activa !== "no";
}

async function nuevaSub() {
  const r = await OSUI.form({ titulo: "Nueva suscripción / deuda", campos: SUB_CAMPOS(), ok: "Crear" });
  if (!r || !r.nombre.trim() || !Number.isFinite(Number(String(r.importe).replace(",", ".")))) return;
  const s = {};
  aplicaSubForm(s, r);
  if (!Array.isArray(STATE.suscripciones)) STATE.suscripciones = [];
  STATE.suscripciones.push(s);
  saveClave("suscripciones");
}

async function editarSub(gi) {
  const s = subs()[gi];
  if (!s) return;
  const r = await OSUI.form({ titulo: "Editar " + (s.tipo === "deuda" ? "deuda" : "suscripción"), campos: SUB_CAMPOS(s), ok: "Guardar", borrar: true });
  if (!r) return;
  if (r === "borrar") {
    if (!(await OSUI.confirm("Borrar", `«${esc(s.nombre)}» se elimina del todo.`, { ok: "Sí, borrar" }))) return;
    STATE.suscripciones.splice(gi, 1);
  } else {
    if (!r.nombre.trim() || !Number.isFinite(Number(String(r.importe).replace(",", ".")))) return;
    aplicaSubForm(s, r);
  }
  saveClave("suscripciones");
}

function setFinMsg(t, cls) { const m = $("finSyncMsg"); if (m) { m.textContent = t; m.className = "msg" + (cls ? " " + cls : ""); } }
async function pintaBancosFin() {
  const box = $("finBancos");
  if (!box) return;
  try {
    const r = await fetch("/api/integraciones", { credentials: "include" });
    if (!r.ok) return;
    const st = await r.json(); EB_STATUS = st;
    const ses = st.enablebanking?.sessions || [];
    if (!ses.length) { box.innerHTML = ""; return; }
    const dias = (d) => d === null ? "" : d < 0 ? "caducado" : d === 0 ? "caduca hoy" : `consentimiento: ${d} día${d === 1 ? "" : "s"}`;
    box.innerHTML = ses.map((x) => {
      const mal = x.status !== "active" || (x.dias_restantes !== null && x.dias_restantes <= 15);
      return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--hairline);font-size:12.5px;flex-wrap:wrap">
        <b>${esc(x.aspsp)}</b><span style="color:var(--ink-3)">${x.cuentas.length} cuenta${x.cuentas.length === 1 ? "" : "s"}</span>
        <span style="margin-left:auto;color:${mal ? "var(--bad)" : "var(--ink-3)"}">${x.status === "active" ? dias(x.dias_restantes) : "consentimiento caducado"}${x.last_error ? " · " + esc(x.last_error) : ""}</span>
        ${mal ? `<button class="btn-mini" onclick="conectarBanco('${esc(x.aspsp).replace(/'/g, "\\'")}','${esc(x.country)}')">Reautorizar</button>` : ""}
        <button class="btn-mini" onclick="quitarBanco('${esc(x.id)}','${esc(x.aspsp).replace(/'/g, "\\'")}')">Quitar</button>
      </div>`;
    }).join("") + (st.last_sync ? `<div class="empty-note" style="margin-top:6px">Último sync: ${new Date(st.last_sync).toLocaleString("es")}${st.last_result?.errores?.length ? " · avisos: " + esc(st.last_result.errores.join(" | ")) : ""}</div>` : "");
  } catch (e) { /* sin estado, sin bloque */ }
}
let EB_STATUS = null;
async function conectarBanco(aspspFijo, countryFijo) {
  setFinMsg("Cargando bancos…");
  try {
    const r = await fetch("/api/bancos/aspsps?country=ES", { credentials: "include" });
    const body = await r.json();
    if (!r.ok) {
      setFinMsg("");
      if (/Configura primero/i.test(body.error || "")) {
        if (await OSUI.confirm("Falta la conexión con Enable Banking", "Antes hay que pegar la aplicación y su clave en Configuración → Bancos. ¿Vamos?", { ok: "Ir a Configuración", danger: false })) location.href = "/config.html#bancos";
        return;
      }
      const manual = await OSUI.confirm("No se pudo cargar la lista de bancos", esc(body.error || "error") + "\n\n¿Quieres crear una cuenta manual en su lugar?", { ok: "Cuenta manual", danger: false });
      if (manual) nuevaCuenta();
      return;
    }
    setFinMsg("");
    const top = ["bbva", "revolut"];
    const rank = (a) => { const i = top.findIndex((t) => a.name.toLowerCase().startsWith(t)); return i < 0 ? 99 : i; };
    const ops = body.aspsps.slice().sort((a, b) => rank(a) - rank(b));
    let aspsp = aspspFijo, country = countryFijo || "ES", md;
    if (!aspsp) {
      const f = await OSUI.form({
        titulo: "Añadir cuenta",
        texto: "Conecta tu banco: te mandamos a tu banca, autorizas la lectura de tus cuentas y vuelves aquí con las cuentas y el historial. O crea una cuenta manual (efectivo, ahorro…).",
        campos: [{ id: "banco", label: "Banco", tipo: "select", opciones: [{ v: "manual", l: "Cuenta manual (sin banco)" }].concat(ops.map((a) => ({ v: a.name + "|" + a.country + "|" + (a.max_dias || ""), l: a.name + (a.max_dias && a.max_dias < 180 ? ` · consentimiento ${a.max_dias} días` : "") }))) }],
        ok: "Continuar",
      });
      if (!f) return;
      if (f.banco === "manual") return nuevaCuenta();
      [aspsp, country, md] = f.banco.split("|");
    }
    setFinMsg("Abriendo " + aspsp + "…");
    const a = await fetch("/api/bancos/auth", { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ aspsp, country, max_dias: md ? Number(md) : undefined }) });
    const ab = await a.json();
    if (!a.ok) throw new Error(ab.error || "HTTP " + a.status);
    location.href = ab.url;
  } catch (e) { setFinMsg("Error: " + e.message, "err"); }
}
async function sincronizarBancos() {
  const b = $("btnSyncFin"); if (b) b.disabled = true;
  setFinMsg("Sincronizando con los bancos…");
  try {
    const r = await fetch("/api/sync", { method: "POST", credentials: "include" });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || "HTTP " + r.status);
    setFinMsg(`Listo: ${body.movimientos} movimientos nuevos, ${body.cuentas_nuevas} cuentas nuevas.` + (body.errores?.length ? " Avisos: " + body.errores.join(" | ") : ""), body.errores?.length ? "err" : "ok");
    load();
  } catch (e) { setFinMsg("Error: " + e.message, "err"); }
  finally { if (b) b.disabled = false; }
}
async function quitarBanco(id, aspsp) {
  if (!(await OSUI.confirm("Quitar banco", `Se cierra la conexión con ${aspsp}. Las cuentas y los movimientos ya descargados se quedan.`, { ok: "Quitar" }))) return;
  try {
    const r = await fetch(`/api/bancos/sessions/${encodeURIComponent(id)}`, { method: "DELETE", credentials: "include" });
    if (!r.ok) throw new Error((await r.json()).error || "HTTP " + r.status);
    pintaBancosFin(); setFinMsg("Conexión cerrada.", "ok");
  } catch (e) { setFinMsg("Error: " + e.message, "err"); }
}

    (STATE.ideas = STATE.ideas || []).push({ id: uidL("i"), texto: b.texto, tipo: r.tipo, estado: "nueva", creada: hoy });

  } else if (destino === "tarea") {
    const r = await OSUI.form({ titulo: "A tareas", campos: [{ id: "titulo", label: "Tarea", valor: b.texto }, { id: "fecha", label: "Fecha límite", tipo: "date", valor: "", opcional: true }], ok: "Crear" });
    if (!r || !r.titulo.trim()) return;
    const t = { id: "t" + Date.now(), titulo: r.titulo.trim(), prioridad: "normal", creada: hoy };
    aplicaEstadoTarea(t, "pendiente");
    if (r.fecha) t.fecha = r.fecha;
    (STATE.tareas = STATE.tareas || []).push(t);
    claves.tareas = STATE.tareas;
  } else if (destino === "nota") {
    (STATE.notas = STATE.notas || []).push({ id: uidL("n"), titulo: b.texto.slice(0, 80), tipo: "nota", fecha: hoy, creada: hoy, ...(b.texto.length > 80 ? { notas: b.texto } : {}) });

    (STATE.contenido = STATE.contenido || []).push({ fecha: hoy, tipo: "reel", titulo: b.texto, estado: "idea" });
    claves.contenido = STATE.contenido;
  } else return;
  STATE.bandeja.splice(i, 1);
  claves.bandeja = STATE.bandeja;
  await guardaYPinta(claves);
}
