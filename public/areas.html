/* ======================== AGENDA: todo lo que tiene fecha, por mes o por semana ======================== */
const masDias = (f, n) => { const d = new Date(f + "T12:00"); d.setDate(d.getDate() + n); return isoLocal(d); };
const lunesDe = (f) => masDias(f, -((new Date(f + "T12:00").getDay() + 6) % 7));
function rangoSemana(a, b) {
  const da = new Date(a + "T12:00"), db = new Date(b + "T12:00");
  const mes = (d) => d.toLocaleDateString("es", { month: "short" }).replace(".", "");
  if (da.getFullYear() !== db.getFullYear()) return `${da.getDate()} ${mes(da)} ${da.getFullYear()} – ${db.getDate()} ${mes(db)} ${db.getFullYear()}`;
  if (da.getMonth() !== db.getMonth()) return `${da.getDate()} ${mes(da)} – ${db.getDate()} ${mes(db)} ${db.getFullYear()}`;
  return `${da.getDate()} – ${db.getDate()} ${mes(db)} ${db.getFullYear()}`;
}
function agMueve(n) {
  if (agVista === "mes") return calMesMueve(n);
  calSemana = masDias(calSemana, 7 * n);
  renderContent();
}
function agHoy() { const h = isoLocal(new Date()); calMes = h.slice(0, 7); calSemana = lunesDe(h); renderContent(); }
function agVer(v) {
  try { localStorage.setItem("os_agenda_vista", v); } catch (e) {}
  if (v === agVista) return;
  // se queda en el mismo sitio: de un mes a la semana de hoy (o a la de su primer lunes) y de una semana al mes de su jueves
  const h = isoLocal(new Date());
  if (v === "semana") calSemana = calMes === h.slice(0, 7) ? lunesDe(h) : lunesDe(masDias(calMes + "-01", 6));
  else if (calSemana) calMes = masDias(calSemana, 3).slice(0, 7);
  location.hash = "agenda/" + v;
}
function chipsAgenda(f, piezas, semana) {
  let chips = (piezas[f] || []).map((i) => { const c = STATE.contenido[i]; const pub = estadoPieza(c) === "publicado"; const m = pub ? "" : misionDe(c);
    return `<span class="pieza-chip ${pub ? "pub" : "reel"}${m ? ` m-${m}` : ""}" onclick="event.stopPropagation();abrirPieza(${i})">${pub ? "✓ " : ""}${c.hora && !pub ? c.hora + " " : ""}${esc(c.titulo || "(sin título)")}${semana && !pub ? `<small>${esc(labelEstado(c))}</small>` : ""}</span>`; }).join("");
  chips += (STATE.recordatorios || []).filter((r) => tocaRecordatorio(r, f)).map((r) => `<span class="pieza-chip rec${r.hechos?.[f] ? " pub" : ""}" onclick="event.stopPropagation();editarRecordatorio('${esc(r.id)}')">↻ ${esc(r.titulo)}</span>`).join("");
  if (STATE.entrenos?.[f]) chips += `<span class="pieza-chip gymok">✓ Gym</span>`;
  return chips;
}
function vistaAgendaCal() {
  const hoy = isoLocal(new Date());
  if (!calSemana) calSemana = lunesDe(hoy);
  const piezas = {};
  (STATE.contenido || []).forEach((c, i) => {
    const f = estadoPieza(c) === "publicado" ? (c.fecha_pub || c.fecha_plan) : c.fecha_plan;
    if (f) (piezas[f] = piezas[f] || []).push(i);
  });
  let titulo, cuerpo;
  if (agVista === "semana") {
    const dias = Array.from({ length: 7 }, (_, k) => masDias(calSemana, k));
    titulo = rangoSemana(dias[0], dias[6]);
    cuerpo = `<div class="semcal">${dias.map((f) => { const d = new Date(f + "T12:00");
      return `<div class="ag-dia${f === hoy ? " hoy" : f < hoy ? " pasado" : ""}"><div class="ag-dia-h"><span>${DIAS_CORTOS[d.getDay()]}</span><b>${d.getDate()}</b></div><div class="ag-dia-b">${chipsAgenda(f, piezas, true)}</div></div>`; }).join("")}</div>`;
  } else {
    const [y, m] = calMes.split("-").map(Number);
    const first = new Date(y, m - 1, 1);
    const start = (first.getDay() + 6) % 7;
    const nDias = new Date(y, m, 0).getDate();
    const mesTxt = first.toLocaleDateString("es", { month: "long", year: "numeric" });
    titulo = mesTxt.charAt(0).toUpperCase() + mesTxt.slice(1);
    cuerpo = `<div class="pubcal">` + ["L", "M", "X", "J", "V", "S", "D"].map((d) => `<span class="cd">${d}</span>`).join("");
    for (let i = 0; i < start; i++) cuerpo += `<div class="day off"></div>`;
    for (let d = 1; d <= nDias; d++) {
      const f = `${calMes}-${String(d).padStart(2, "0")}`;
      cuerpo += `<div class="day${f === hoy ? " hoy" : ""}"><span class="dn">${d}</span>${chipsAgenda(f, piezas, false)}</div>`;
    }
    cuerpo += `</div>`;
  }
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:8px;flex-wrap:wrap">
      <h2>Agenda</h2>
      <button class="btn-mini" onclick="nuevoRecordatorio()">${OSIcons.nueva} Recordatorio</button>
    </div>
    <div class="sub">Todo lo que tiene fecha: publicaciones, recordatorios y entrenos hechos. Toca algo para abrirlo.</div>
    <div class="mes-nav ag-nav"><button class="ag-hoy" onclick="agHoy()">Hoy</button><button onclick="agMueve(-1)" aria-label="Anterior">‹</button><button onclick="agMueve(1)" aria-label="Siguiente">›</button><b>${titulo}</b>
      <span class="filtros ag-vista"><button class="${agVista === "mes" ? "on" : ""}" onclick="agVer('mes')">Mes</button><button class="${agVista === "semana" ? "on" : ""}" onclick="agVer('semana')">Semana</button></span></div>
    ${cuerpo}
    <div class="ag-leyenda">${MISIONES.map(([k, l]) => `<span><i style="background:${MISION_COLOR[k]}"></i>${l}</span>`).join("")}<span><i style="background:rgba(227,57,130,.35)"></i>Sin misión</span><span><i style="background:var(--good-bg)"></i>Publicada · hecho</span><span><i style="background:var(--surface);border:1px solid var(--border)"></i>Recordatorio</span></div>
  </div>`;
}

async function igEnlazar() {

  const hace30 = Date.now() - 30 * 86400000;

  const dist = (a, b) => (a && b ? Math.abs(new Date(a + "T12:00") - new Date(b + "T12:00")) : Infinity);
  for (const [k, p] of pendientes.entries()) {

      .sort((a, b) => dist(a.fecha_plan || a.fecha_pub, p.dia) - dist(b.fecha_plan || b.fecha_pub, p.dia));
    const num = [p.views != null ? `${fmtN(p.views)} vistas` : "", p.omision_pct != null ? `${String(p.omision_pct).replace(".", ",")} % omisión` : ""].filter(Boolean).join(" · ");
    const r = await OSUI.form({

      texto: `<div class="ig-pub">${p.miniatura ? `<img src="${escA(p.miniatura)}" alt="" onerror="this.remove()">` : ""}<div><div class="ig-cap">${esc(p.caption || "(sin texto)")}</div>
        <div class="ig-cap-m">${num}${p.url ? ` · <a href="${escA(p.url)}" target="_blank" rel="noopener">verla en Instagram</a>` : ""}</div></div></div>`,
      campos: [{ id: "cid", label: "¿Qué pieza es?", tipo: "select", buscar: true, opciones: [
        ...cands.map((c) => ({ v: c.cid, l: `${c.fecha_plan || c.fecha_pub ? fmtDiaCorto(c.fecha_plan || c.fecha_pub) + " · " : ""}${c.titulo || "(sin título)"}` })),
        { v: "__nueva", l: "Es una pieza nueva: créala" }, { v: "__ninguna", l: "No es ninguna pieza: no la sigas" }] }],
      ok: "Enlazar",
    });

/* ---------- Visión (Creator Vision) con historial de versiones · 15 oct 2026 ----------
   Plantilla y estilos vienen del servidor (importados del esquema original con scripts/importar-vision.mjs);
   las casillas [data-k] se rellenan con la versión que toque. Leer: clic en una casilla larga = en grande.
   Editar: «Editar» → escribir → «Guardar versión» con un resumen. Historial: qué cambió en cada versión,
   verla entera y restaurarla (restaurar crea una versión nueva: el pasado nunca se reescribe).
   Por MCP: get_vision / update_vision (solo cuando la persona lo pide; cada cambio es una versión). */
let VISION = null, cvViendo = null, cvEditando = false, cvBorrador = {}, cvHistSel = null;
const CV_ORIGEN = { importada: "importada", manual: "a mano", claude: "Claude", restaurada: "restaurada" };
async function cargaVision() {
  try {
    const r = await fetch("/api/vision", { credentials: "include" });
    VISION = r.ok ? await r.json() : { error: (await r.json().catch(() => ({}))).error || "HTTP " + r.status };
  } catch (e) { VISION = { error: e.message }; }
  return VISION;
}
function vistaVisionIG() {
  if (!VISION) {
    cargaVision().then(() => { if (active === "instagram" && contSub === "vision") renderContent(); });
    return `<div class="card"><div class="empty-note">Cargando la visión…</div></div>`;
  }
  if (VISION.error) return `<div class="card"><div class="empty-note">No se pudo cargar la visión: ${esc(VISION.error)}</div></div>`;
  if (VISION.vacia) return `<div class="card"><h2>Visión</h2><div class="sub" style="margin-top:6px">Aquí vive tu Creator Vision (mensaje, pilares, a quién le hablas, tu historia, la rueda LIFE, los ganchos y el planificador) con su historial de versiones. Todavía no se ha importado.</div></div>`;
  setTimeout(pintaVision, 0);
  return `<div class="cv-bar" id="cvBar"></div><div class="cv${cvEditando ? " editando" : ""}" id="cvDoc"></div>`;
}
function pintaVision() {
  const doc = $("cvDoc");
  if (!doc || !VISION?.plantilla) return;
  let st = document.getElementById("cvCss");
  if (!st) { st = document.createElement("style"); st.id = "cvCss"; document.head.appendChild(st); }
  if (st.textContent !== VISION.css) st.textContent = VISION.css;
  doc.classList.toggle("editando", cvEditando);
  doc.innerHTML = VISION.plantilla;
  const datos = cvViendo ? cvViendo.datos || {} : VISION.version?.datos || {};
  const marcadas = new Set(cvViendo && cvViendo.v > 1 ? cvViendo.cambios || [] : []);
  doc.querySelectorAll("[data-k]").forEach((el) => {
    const k = el.dataset.k;
    el.innerHTML = cvEditando && k in cvBorrador ? cvBorrador[k] : datos[k] || "";
    el.classList.toggle("cv-filled", !!el.textContent.trim());
    if (marcadas.has(k)) el.classList.add("cv-cambiada");
    if (cvEditando) el.contentEditable = "true";

  if (!cvEditando) requestAnimationFrame(() => cvClamp(doc));

}
function cvCuenta(doc) {

function cvClamp(doc) {

    el.classList.remove("cv-clamp");

}
function pintaBarVision() {
  const bar = $("cvBar");

  const act = VISION.version, n = (VISION.versiones || []).length;
  if (cvEditando) {

    bar.innerHTML = `<div class="cv-ver"><b>Editando</b> · escribe directamente en las casillas. ${c ? `${c} casilla${c === 1 ? "" : "s"} cambiada${c === 1 ? "" : "s"}.` : "Sin cambios todavía."}</div>
      <button class="btn-mini" onclick="cancelaEdicionVision()">Cancelar</button>
      <button class="btn-mini primary" onclick="guardaVision()"${c ? "" : " disabled"}>Guardar versión</button>`;

  }
  if (cvViendo) {
    bar.innerHTML = `<div class="cv-ver cv-antigua"><b>Estás viendo la v${cvViendo.v}</b> · ${fechaHora(cvViendo.creada)} · ${esc(cvViendo.resumen)}${cvViendo.v > 1 ? ". Lo marcado cambió en esa versión." : ""}</div>
      <button class="btn-mini" onclick="cvViendo=null;pintaVision()">Volver a la actual</button>
      ${cvViendo.v !== act.v ? `<button class="btn-mini" onclick="restauraVision(${cvViendo.v})">Restaurar esta versión</button>` : ""}`;
    return;
  }
  bar.innerHTML = `<div class="cv-ver"><b>v${act.v}</b> · ${fechaHora(act.creada)} · ${esc(CV_ORIGEN[act.origen] || act.origen)}${act.resumen ? ` · ${esc(act.resumen)}` : ""}</div>
    <button class="btn-mini" onclick="abrirHistVision()">Historial · ${n}</button>
    <button class="btn-mini primary" onclick="editaVision()">Editar</button>`;
}
/* leer: casillas largas en grande; en la rueda, clic en el nombre del cuadrante = su lista */
function cvGrande(el) {
  const c = (VISION.campos || []).find((x) => x.k === el.dataset.k) || {};
  const ov = document.createElement("div");
  ov.className = "cv-big-ov";
  ov.innerHTML = `<div class="cv-big" role="dialog"><div class="cv-big-h"><b>${esc(c.etiqueta || "Casilla")}<small>${esc(c.seccion || "")}</small></b><button class="btn-mini" data-x>Cerrar</button></div><div class="cv-big-b">${el.innerHTML || `<span class="empty-note">Vacía</span>`}</div></div>`;
  ov.addEventListener("mousedown", (e) => { if (e.target === ov || e.target.closest("[data-x]")) ov.remove(); });
  document.body.appendChild(ov);
}
document.addEventListener("click", (e) => {
  const doc = e.target.closest?.("#cvDoc");
  if (!doc || cvEditando) return;
  const q = e.target.closest("text.cv-qlab");
  if (q) { const el = doc.querySelector(`[data-k="life_${q.getAttribute("data-q")}"]`); if (el) cvGrande(el); return; }
  const el = e.target.closest("[data-k]");
  if (el && (el.classList.contains("cv-clamp") || el.matches(".cv-tree [data-k], .cv-pop"))) cvGrande(el);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const ov = document.querySelector(".cv-big-ov");
    if (ov) { ov.remove(); return; }
    if ($("cvHist")?.classList.contains("show") && !document.querySelector(".osui-ov")) cerrarHistVision();
    return;
  }
  if (e.key === "Enter" && cvEditando && e.target.closest?.("#cvDoc td[data-k]")) { e.preventDefault(); document.execCommand("insertLineBreak"); }
});
/* editar */
function editaVision() { cvEditando = true; cvBorrador = {}; cvViendo = null; pintaVision(); }
document.addEventListener("input", (e) => {
  const el = e.target.closest?.("#cvDoc [data-k]");
  if (!el || !cvEditando) return;
  cvBorrador[el.dataset.k] = el.innerHTML;
  el.classList.toggle("cv-filled", !!el.textContent.trim());
  cvCuenta($("cvDoc"));
  pintaBarVision();
});
document.addEventListener("paste", (e) => {
  const el = e.target.closest?.("#cvDoc [data-k]");
  if (!el || !cvEditando) return;
  e.preventDefault();
  document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text"));
});
const cvNorm = (h) => String(h || "").replace(/&nbsp;/g, " ").replace(/(<br\s*\/?>|\s)+$/i, "").trim();
function cvCambiosPendientes() {
  const act = VISION?.version?.datos || {};
  return Object.keys(cvBorrador).filter((k) => cvNorm(cvBorrador[k]) !== cvNorm(act[k]));
}
async function guardaVision() {
  const ks = cvCambiosPendientes();
  if (!ks.length) { cvEditando = false; pintaVision(); return; }
  const r = await OSUI.form({
    titulo: "Guardar versión nueva",
    texto: `${ks.length} casilla${ks.length === 1 ? "" : "s"} cambiada${ks.length === 1 ? "" : "s"}. La versión de ahora queda en el historial.`,
    campos: [{ id: "resumen", label: "Qué has cambiado", placeholder: "Una frase: qué y por qué" }], ok: "Guardar",
  });
  if (!r) return;
  try {
    await apiPost("/api/vision", { cambios: Object.fromEntries(ks.map((k) => [k, cvBorrador[k]])), resumen: r.resumen });
    cvEditando = false; cvBorrador = {};
    await cargaVision();
    if (active === "instagram" && contSub === "vision") renderContent();
  } catch (err) { OSUI.form({ titulo: "No se pudo guardar", texto: esc(err.message), campos: [], ok: "Vale" }); }
}
async function cancelaEdicionVision() {
  if (cvCambiosPendientes().length && !(await OSUI.confirm("¿Descartar los cambios?", "Lo que has escrito en este modo edición se pierde.", { ok: "Descartar" }))) return;
  cvEditando = false; cvBorrador = {}; pintaVision();
}
/* historial */
function abrirHistVision() {
  cvHistSel = null;
  pintaHistVision();
  const el = $("cvHist");
  if (!el.classList.contains("show")) { void el.offsetWidth; el.classList.add("show"); }
}
function cerrarHistVision() { $("cvHist")?.classList.remove("show"); }
function pintaHistVision() {
  const p = $("cvHist");
  if (!p || !VISION?.versiones) return;
  const actual = VISION.version?.v;
  const porK = new Map((VISION.campos || []).map((c) => [c.k, c]));
  const detalle = (x) => {
    const filas = x.v === 1
      ? `<div class="empty-note" style="margin-top:10px">Versión inicial: ${Object.keys(x.datos || {}).length} casillas con texto.</div>`
      : (x.cambios || []).map((k) => { const c = porK.get(k) || {}; return `<div class="cv-dk">${esc(c.etiqueta || k)}<span>${esc(c.seccion || "")}</span></div>${cvDiffHTML(x.anterior?.[k], x.datos?.[k])}`; }).join("") || `<div class="empty-note">Sin cambios de texto.</div>`;
    return `<div class="cv-det"><div class="cv-det-acts"><button class="btn-mini" onclick="verVersionVision()">Ver el documento así</button>${x.v !== actual ? `<button class="btn-mini" onclick="restauraVision(${x.v})">Restaurar esta versión</button>` : ""}</div>${filas}</div>`;
  };
  p.innerHTML = `<div class="sp-top"><div class="sp-ruta"><span class="rlink" onclick="cerrarHistVision()">Visión</span><span class="sep">/</span><span class="act">Historial</span></div><span style="flex:1"></span><button title="Cerrar" onclick="cerrarHistVision()">${OSIcons.cerrar}</button></div>
    <div class="sp-body"><div class="sub" style="margin:2px 0 10px">Cada guardado es una versión. Toca una para ver qué cambió.</div>${VISION.versiones.map((y) => `
      <div class="cv-vrow${cvHistSel?.v === y.v ? " sel" : ""}" onclick="selVersionVision(${y.v})">
        <div class="cv-vrow-h"><b>v${y.v}</b><span>${fechaHora(y.creada)} · ${esc(CV_ORIGEN[y.origen] || y.origen)}</span>${y.v === actual ? `<span class="cv-act">actual</span>` : ""}</div>
        <div class="cv-vrow-r">${esc(y.resumen)}</div>
        <div class="cv-vrow-n">${y.v === 1 ? "inicial" : `${y.n_cambios} casilla${y.n_cambios === 1 ? "" : "s"}`}</div>
      </div>${cvHistSel?.v === y.v ? detalle(cvHistSel) : ""}`).join("")}</div>`;
}
async function selVersionVision(v) {
  if (cvHistSel?.v === v) { cvHistSel = null; pintaHistVision(); return; }
  try {
    const r = await fetch(`/api/vision/v/${v}`, { credentials: "include" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    cvHistSel = await r.json();
  } catch (e) { cvHistSel = null; }
  pintaHistVision();
}
function verVersionVision() {
  if (!cvHistSel) return;
  cvViendo = cvHistSel.v === VISION.version?.v ? null : cvHistSel;
  cvEditando = false;
  cerrarHistVision();
  pintaVision();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function restauraVision(v) {
  if (!(await OSUI.confirm(`¿Volver a la v${v}?`, "Se crea una versión nueva con su contenido. Lo de ahora queda en el historial.", { ok: "Restaurar", danger: false }))) return;
  try {
    await apiPost("/api/vision/restaurar", { v });
    cvViendo = null; cvHistSel = null;
    await cargaVision();
    if ($("cvHist")?.classList.contains("show")) pintaHistVision();
    if (active === "instagram" && contSub === "vision") renderContent();
  } catch (err) { OSUI.form({ titulo: "No se pudo restaurar", texto: esc(err.message), campos: [], ok: "Vale" }); }
}
/* diferencias palabra a palabra entre dos versiones de una casilla */
function cvTexto(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  d.querySelectorAll("br").forEach((b) => b.replaceWith("\n"));
  d.querySelectorAll("ol, ul").forEach((l) => { let n = 0; l.querySelectorAll(":scope > li").forEach((li) => { n++; li.prepend(l.tagName === "OL" ? `${n}. ` : "- "); li.append("\n"); }); });
  d.querySelectorAll("div, p").forEach((x) => x.append("\n"));
  return d.textContent.replace(/\n{3,}/g, "\n\n").trim();
}
function cvDiffHTML(antesH, ahoraH) {
  const a = cvTexto(antesH), b = cvTexto(ahoraH);
  if (!a) return `<div class="cv-diff"><ins>${esc(b)}</ins></div>`;
  if (!b) return `<div class="cv-diff"><del>${esc(a)}</del></div>`;
  const ta = a.split(/(\s+)/), tb = b.split(/(\s+)/), n = ta.length, m = tb.length;
  if (n * m > 1500000) return `<div class="cv-diff"><del>${esc(a)}</del></div><div class="cv-diff" style="margin-top:6px"><ins>${esc(b)}</ins></div>`;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = ta[i] === tb[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (ta[i] === tb[j]) { out += esc(ta[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out += `<del>${esc(ta[i++])}</del>`;
    else out += `<ins>${esc(tb[j++])}</ins>`;
  }
  while (i < n) out += `<del>${esc(ta[i++])}</del>`;
  while (j < m) out += `<ins>${esc(tb[j++])}</ins>`;
  return `<div class="cv-diff">${out.replace(/<\/del><del>/g, "").replace(/<\/ins><ins>/g, "")}</div>`;
}

function pendiente(nombre, texto, fase) {
  return `<div class="card"><h2>${nombre}</h2><div class="note">${texto}</div><div class="empty-note" style="margin-top:10px">Pendiente de construir · fase ${fase}.</div></div>`;
}

function renderContent() {
  renderTitle();
  if (!STATE || !DASH) return;
  // la visión en modo edición no se repinta con el refresco de datos: se perdería lo que se está escribiendo
  if (active === "instagram" && contSub === "vision" && cvEditando && $("cvDoc")) return;
  document.querySelector(".wrap")?.classList.toggle("ancho", active === "instagram" && ["tablero", "edicion", "vision"].includes(contSub));
  $("content").innerHTML = VIEWS[active]();
  initHeatmaps(); // dimensiona los heatmaps y los deja en lo más reciente
  initProyPizarra(); // pizarra editable de la página de proyecto
}

window.addEventListener("hashchange", () => {
  const antes = active;
  parseHash();
  if (active === "instagram" && antes !== "instagram") IG_CON = null; // al volver a Instagram, el estado de la conexión se vuelve a leer
  renderContent();
});

async function load() {
  try {
    const [sRes, dRes] = await Promise.all([
      fetch("/api/state", { credentials: "include" }),
      fetch("/api/dashboard", { credentials: "include" }),
    ]);
    const state = await sRes.json();
    const dash = await dRes.json();
    const payload = JSON.stringify({ DASH: dash, STATE: state });
    if (payload !== lastPayload) {
      lastPayload = payload;
      STATE = state; DASH = dash;
      try { sessionStorage.setItem("os_cache_v1", payload); } catch (e) {}
      renderContent();
    }
  } catch (e) {
    $("content").innerHTML = `<div class="card"><div class="empty-note">Error cargando: ${esc(e.message)}</div></div>`;
  }
}

renderTitle();
try {
  const raw = sessionStorage.getItem("os_cache_v1");
  const cached = JSON.parse(raw || "null");
  if (cached?.DASH && cached?.STATE) { DASH = cached.DASH; STATE = cached.STATE; lastPayload = raw; renderContent(); }
} catch (e) {}
load();
</script>
<div id="ready"></div>
</body>
