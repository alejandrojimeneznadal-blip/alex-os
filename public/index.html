<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3f3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OS">
<title>Panel · OS</title>
<link rel="expect" href="#ready" blocking="render">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f3f3f5;
    --surface: #ffffff;
    --surface-2: #f4f4f7;
    --border: #e9e9ee;
    --grid: #e8e8ee;
    --ink: #17171c;
    --ink-2: #4c4c56;
    --ink-3: #8b8b94;
    --accent: #5546e8;
    --serie-1: #5546e8;   /* score diario */
    --serie-2: #1baf7a;   /* acumulado */
    --good: #0a7d0a;
    --good-bg: #e5f6e5;
    --bad: #d03b3b;
    --bad-bg: #fdecec;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(23,23,40,0.04), 0 8px 24px rgba(23,23,40,0.05);
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.45;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 22px 18px 60px; }

  /* SALUDO */
  .greet h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .greet .sub { font-size: 14px; color: var(--ink-3); margin-top: 3px; }
  .greet { margin-bottom: 6px; }
  /* solo visible si hay error de conexión */
  .sync { display: none; font-size: 11.5px; align-items: center; gap: 6px; margin: 8px 0 18px; }
  .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .sync.err { display: flex; color: var(--bad); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 15px; font-weight: 650; color: var(--ink); margin-bottom: 12px; letter-spacing: -0.01em; }
  .card .sub { font-size: 12.5px; color: var(--ink-3); margin: -8px 0 12px; }

  /* KPI CARDS */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  }
  .kpi .mini { width: 14px; height: 14px; display: inline-flex; flex-shrink: 0; }
  .mini.indigo { color: var(--accent); }
  .mini.orange { color: #ee6018; }
  .mini.pink   { color: #e33982; }
  .mini.green  { color: #17a171; }
  .kpi .num { font-size: 24px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
  .kpi .num small { font-size: 13px; color: var(--ink-3); font-weight: 500; }

  /* odómetro: los dígitos ruedan en vertical */
  .odo { display: inline-flex; overflow: hidden; height: 1.15em; vertical-align: bottom; font-variant-numeric: tabular-nums; }
  .odo .digit { position: relative; width: 0.58em; height: 1.15em; overflow: hidden; }
  .odo .strip { position: absolute; left: 0; top: 0; transition: transform 0.55s cubic-bezier(.3,.9,.3,1); will-change: transform; }
  .odo .strip span { display: block; height: 1.15em; line-height: 1.15em; text-align: center; }
  .kpi .lbl { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }

  .pill {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--good-bg); color: var(--good); vertical-align: 3px;
  }
  .pill.down { background: var(--bad-bg); color: var(--bad); }

  /* SEÑALES — lista tipo checklist en columnas: escala a cualquier número de señales */
  .senales { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); column-gap: 26px; }
  .senal {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-2);
    user-select: none;
  }
  .senal:hover .lab { color: var(--ink); }
  .senal { position: relative; }
  .senal .mark {
    width: 19px; height: 19px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--mark-border); background: transparent; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    position: relative;
    transition: border-color 0.25s ease;
  }
  /* disco de relleno: crece con muelle al marcar, se recoge al desmarcar */
  .senal .mark .fill {
    position: absolute; inset: -1.5px; border-radius: 50%;
    background: var(--ok); transform: scale(0);
    transition: transform 0.34s cubic-bezier(.3,1.45,.45,1);
  }
  .senal.ok .mark .fill { transform: scale(1); }
  .senal .mark svg { position: relative; z-index: 1; }
  .pts-fly {
    position: absolute; right: 6px; top: -5px; z-index: 5;
    font-size: 11.5px; font-weight: 700; color: var(--ok);
    font-variant-numeric: tabular-nums; pointer-events: none;
    animation: ptsfly 0.9s cubic-bezier(.2,.6,.3,1) forwards;
  }
  .pts-fly.neg { color: var(--ink-3); }
  @keyframes ptsfly {
    0% { opacity: 0; transform: translateY(3px) scale(0.92); }
    22% { opacity: 1; transform: translateY(-2px) scale(1); }
    100% { opacity: 0; transform: translateY(-15px) scale(1); }
  }
  .senal.ok .mark { border-color: var(--ok); }
  .senal .lab { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .senal .val { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .senal .hval { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .senal .hin {
    width: 46px; background: var(--surface-2); border: 1px solid transparent; border-radius: 8px;
    color: var(--ink); font-family: inherit; font-size: 12.5px; text-align: right; padding: 3px 7px;
    font-variant-numeric: tabular-nums; appearance: textfield; -moz-appearance: textfield;
  }
  .senal .hin::-webkit-outer-spin-button, .senal .hin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .senal .hin::placeholder { color: var(--placeholder); }
  .senal .hin:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .senal .hin.kin { width: 52px; }
  .senal .hum { font-size: 11.5px; color: var(--ink-3); }

  /* cabecera de sección con ⋯ + modo edición de señales */
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .sec-head h2 { margin-bottom: 0; }
  .sec-actions { display: flex; gap: 8px; align-items: center; }
  .sec-dots {
    background: none; border: none; color: var(--ink-3); width: 26px; height: 26px;
    border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .sec-dots:hover { background: var(--surface-2); color: var(--ink); }
  .sec-dots[hidden], .mini-btn[hidden] { display: none; }
  .sec-dots .tic { width: 17px; height: 17px; }
  .mini-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
    border-radius: 9px; padding: 5px 13px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }
  .mini-btn:hover { color: var(--ink); border-color: var(--border-strong); }
  .mini-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .mini-btn.primary:hover { color: #fff; opacity: 0.92; }
  /* menú del ⋯ de sección */
  .sec-actions { position: relative; }
  .sec-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(23,23,40,0.14); padding: 5px; min-width: 150px;
  }
  .sec-menu button {
    display: flex; width: 100%; align-items: center; gap: 8px;
    background: none; border: none; font-family: inherit; font-size: 13px;
    color: var(--ink-2); padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .sec-menu button:hover { background: var(--surface-2); color: var(--ink); }
  .sec-menu .tic { width: 14px; height: 14px; }

  /* modo orden: las señales son rectángulos que se cogen y arrastran.
     OJO: mismas columnas que el modo normal (solo cambia el row-gap) para que
     cada señal quede exactamente en la misma posición en ambos modos. */
  .senales.editing { row-gap: 8px; }
  .senal.edit {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; cursor: grab; touch-action: none; user-select: none;
  }
  .senal.edit:active { cursor: grabbing; }
  .senal.edit.hueco { opacity: 0.4; border-style: dashed; background: transparent; }
  .senal.edit.drop-target { border-color: var(--accent); background: var(--accent-soft); }
  .senal.add-habito {
    border: 1px dashed var(--border-strong); border-radius: 12px; padding: 10px 12px;
    color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; font-weight: 550;
  }
  .senal.add-habito:hover { color: var(--accent); border-color: var(--accent); }
  .senal.add-habito .tic { width: 14px; height: 14px; }

  /* modal registrar día: checklist compacta */
  .rd-lista { margin-top: 14px; max-height: 46vh; overflow-y: auto; }
  .rd-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 2px;
    border-bottom: 1px solid var(--hairline); cursor: pointer; font-size: 13.5px;
  }
  .rd-row:last-child { border-bottom: none; }
  .rd-row .lab { flex: 1; min-width: 0; font-weight: 500; }
  .rd-mark {
    width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--mark-border);
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .rd-row.on .rd-mark { background: var(--accent); border-color: var(--accent); }
  .rd-row.on .rd-mark::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; }
  .modal-card .rd-row input {
    width: 76px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
    color: var(--ink); font-family: inherit; font-size: 13px; padding: 6px 8px; text-align: center;
  }
  .modal-card .rd-row input:focus { outline: none; border-color: var(--accent); }
  .rd-row .um { font-size: 11px; color: var(--ink-3); flex-shrink: 0; }
  .senal-ghost {
    position: fixed; z-index: 300; pointer-events: none; margin: 0;
    background: var(--surface); box-shadow: 0 16px 40px rgba(23,23,40,0.22); opacity: 0.97;
  }
  .senal .grip {
    color: var(--ink-3); width: 20px; height: 20px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .senal .grip .tic { width: 15px; height: 15px; }
  .senal .pen {
    background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--ink-3);
    width: 23px; height: 23px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; flex-shrink: 0; margin-left: 8px;
  }
  .senal .pen:hover { color: var(--ink); border-color: var(--border-strong); }
  .senal .pen .tic { width: 13px; height: 13px; }

  /* modal editar señal */
  .ov {
    position: fixed; inset: 0; background: rgba(23,23,30,0.35); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .ov.show { display: flex; }
  .modal-card {
    background: var(--surface); border-radius: 18px; padding: 20px; width: 100%; max-width: 340px;
    box-shadow: 0 20px 60px rgba(23,23,40,0.25);
  }
  .modal-card h3 { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .modal-card label { display: block; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.07em; margin: 13px 0 5px 2px; }
  .modal-card input, .modal-card select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    color: var(--ink); font-family: inherit; font-size: 14px; padding: 9px 11px;
  }
  .modal-card input:focus, .modal-card select:focus { outline: none; border-color: var(--accent); }
  .modal-card .btns { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
  .modal-card .btns button {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
    border-radius: 10px; padding: 8px 15px; font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  .modal-card .btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .senales-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 12px; }
  .senales-hint a { color: var(--ink-2); }

  /* CHART CARDS */
  .chart-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .chart-head .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .chart-head .big small { font-size: 15px; color: var(--ink-3); font-weight: 500; }
  .toggles { margin-left: auto; display: flex; gap: 6px; }
  .toggles button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-3);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .toggles button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* móvil: sin selección de texto ni lupa/callout de iOS al mantener pulsado; el dedo mueve el crosshair
     (touch-action pan-y deja el scroll vertical nativo y nos cede el gesto horizontal) */
  .chart-box { position: relative; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; overflow: hidden; }
  .chart-box svg { display: block; width: 100%; height: auto; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: #1e1b31;
    border-radius: 10px;
    padding: 7px 11px;
    font-size: 12px;
    color: #cfcce8;
    white-space: nowrap;
    display: none;
    z-index: 5;
    box-shadow: 0 8px 20px rgba(23,23,40,0.25);
  }
  .tooltip b { color: #fff; }

  /* TIMELINE */
  .entry { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .entry:last-child { border-bottom: none; padding-bottom: 0; }
  .entry .f { color: var(--ink-3); font-size: 11.5px; flex-shrink: 0; width: 76px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .entry .a { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; padding-top: 3px; width: 72px; font-weight: 600; }
  .entry .t { color: var(--ink-2); }
  .empty-note { color: var(--ink-3); font-size: 13px; }

  @media (max-width: 520px) {
    .greet h1 { font-size: 23px; }
    .chart-head .big { font-size: 25px; }
  }
  .senal .mark .tic { width: 11px; height: 11px; }
</style>
</head>
<body>
<script src="/theme.js"></script>
<script src="/icons.js"></script>
<script src="/ui.js"></script>
<div class="wrap">

  <div class="greet">
    <h1 id="saludo">Hola</h1>
    <div class="sub" id="fechaHoy"></div>
  </div>
  <div class="sync" id="sync"><span class="dot"></span><span id="syncText"></span></div>

  <div class="kpis">
    <div class="kpi"><div class="num" id="kScore"><span id="kScoreN">–</span><small>/100</small></div><div class="lbl"><span class="mini indigo"><svg class="tic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 4v3m-4 -3v6m8 -6v6" /><path d="M12 18.5l-3 1.5l.5 -3.5l-2 -2l3 -.5l1.5 -3l1.5 3l3 .5l-2 2l.5 3.5l-3 -1.5" /></svg></span>Score de hoy</div></div>
    <div class="kpi"><div class="num" id="kRacha">–</div><div class="lbl"><span class="mini orange"><svg class="tic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 10.941c2.333 -3.308 .167 -7.823 -1 -8.941c0 3.395 -2.235 5.299 -3.667 6.706c-1.43 1.408 -2.333 3.294 -2.333 5.588c0 3.704 3.134 6.706 7 6.706c3.866 0 7 -3.002 7 -6.706c0 -1.712 -1.232 -4.403 -2.333 -5.588c-2.084 3.353 -3.257 3.353 -4.667 2.235" /></svg></span>Racha</div></div>
    <div class="kpi"><div class="num" id="kMedia">–</div><div class="lbl"><span class="mini pink"><svg class="tic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12h4l3 8l4 -16l3 8h4" /></svg></span>Media 7 días</div></div>
    <div class="kpi"><div class="num" id="kRitmo">–</div><div class="lbl"><span class="mini green"><svg class="tic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 17l6 -6l4 4l8 -8" /><path d="M14 7l7 0l0 7" /></svg></span>Ritmo vs mes anterior</div></div>
  </div>

  <div class="card">
    <div class="sec-head">
      <h2>Hábitos de hoy</h2>
      <div class="sec-actions">
        <button class="sec-dots" id="senDots" title="Editar hábitos"></button>
        <button class="mini-btn" id="senCancelEdit" hidden>Cancelar</button>
        <button class="mini-btn primary" id="senConfirm" hidden>Confirmar</button>
      </div>
    </div>
    <div class="senales" id="senales"></div>
    <div class="senales-hint">Toca un hábito para marcarlo a mano · lo normal es contárselo al <a href="/chat.html">chat</a></div>
  </div>

  <div class="card">
    <div class="chart-head">
      <div>
        <h2 style="margin-bottom:2px">Score diario</h2>
        <div class="big" id="scoreBig"><span id="scoreBigN">–</span><small>/100</small> <span class="pill" id="scorePill" style="display:none"></span></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
        <button class="mini-btn" id="btnRegDia">Registrar día</button>
        <div class="toggles" style="margin-left:0" id="rangeToggles">
          <button data-r="30" class="active">30 días</button>
          <button data-r="0">Todo</button>
        </div>
      </div>
    </div>
    <div class="sub" id="subScore"></div>
    <div class="chart-box" id="chartScore"></div>
  </div>

  <div class="card">
    <div class="chart-head">
      <div>
        <h2 style="margin-bottom:2px">Crecimiento acumulado</h2>
        <div class="big" id="acumBig">0 <span class="pill" id="acumPill" style="display:none"></span></div>
      </div>
    </div>
    <div class="sub" id="subAcum"></div>
    <div class="chart-box" id="chartAcum"></div>
  </div>

  <div class="card">
    <h2>Últimos apuntes</h2>
    <div id="journal"></div>
  </div>

</div>

<div class="ov" id="diaOv">
  <div class="modal-card">
    <h3>Registrar día</h3>
    <label>Día</label>
    <div class="osui-dw"><input class="osui-date" id="rdFecha" type="text" readonly placeholder="elige el día"></div>
    <div class="rd-lista" id="rdLista"></div>
    <div class="btns">
      <button id="rdCancel">Cancelar</button>
      <button class="primary" id="rdSave">Guardar</button>
    </div>
  </div>
</div>

<div class="ov" id="senalOv">
  <div class="modal-card">
    <h3 id="seTitulo">Editar hábito</h3>
    <label for="seLabel">Nombre</label>
    <input id="seLabel" autocomplete="off">
    <label for="sePeso">Puntos</label>
    <input id="sePeso" type="number" inputmode="numeric" min="0" max="100">
    <label for="seTipo">Tipo</label>
    <select id="seTipo">
      <option value="bool">Check (sí / no)</option>
      <option value="horas">Horas (con umbral)</option>
      <option value="kcal">Calorías (objetivo del día)</option>
    </select>
    <div id="seUmbralWrap">
      <label for="seUmbral">Umbral (horas)</label>
      <input id="seUmbral" type="number" inputmode="decimal" step="0.5" min="0.5" max="24">
    </div>
    <div class="btns">
      <button id="seQuitar" style="margin-right:auto;color:var(--bad);border-color:transparent;background:transparent">Quitar</button>
      <button id="seCancel">Cancelar</button>
      <button class="primary" id="seSave">Guardar</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let DASH = null, STATE = null, RANGE = 30, lastPayload = "";

function setSync(ok, text) {
  const el = $("sync");
  el.classList.toggle("err", !ok);
  $("syncText").textContent = ok ? "" : text;
}

/* saludo con personalidad: pool por franja, estable dentro de la misma hora
   (cambia entre visitas, no parpadea entre renders) */
function saludo() {
  const N = (window.OSMe && window.OSMe.name()) || "";
  const fin = (t) => (N ? t : t.replace(/, $/, ""));
  const ahora = new Date();
  const h = ahora.getHours();
  let pool;
  if (h < 6) {
    pool = [`Trasnochando, ${N}`, `Las horas de nadie, ${N}`, `La ciudad duerme, ${N}`, `Madrugada profunda, ${N}`];
  } else if (h < 9) {
    pool = [`Primera hora, ${N}`, `El día es tuyo, ${N}`, `Arriba antes que nadie, ${N}`, `Buenos días, ${N}`];
  } else if (h < 13) {
    pool = [`Buenos días, ${N}`, `A lo importante, ${N}`, `La mañana rinde, ${N}`, `Buen momento para construir, ${N}`];
  } else if (h < 17) {
    pool = [`Buenas tardes, ${N}`, `Segunda mitad, ${N}`, `Sigue el ritmo, ${N}`, `La tarde es larga, ${N}`];
  } else if (h < 21) {
    pool = [`Buenas tardes, ${N}`, `Recta final del día, ${N}`, `Aún queda tarde, ${N}`, `Cierra fuerte, ${N}`];
  } else {
    pool = [`Buenas noches, ${N}`, `Cerrando el día, ${N}`, `Último repaso, ${N}`, `El día está hecho, ${N}`];
  }
  const seed = Number(ahora.toISOString().slice(0, 10).replace(/-/g, ``)) + h;
  return fin(pool[seed % pool.length]);
}

document.addEventListener("os:me", () => { const h = document.getElementById("saludo"); if (h) h.textContent = saludo(); });

async function load() {
  try {
    const [dRes, sRes] = await Promise.all([
      fetch("/api/dashboard", { credentials: "include" }),
      fetch("/api/state", { credentials: "include" }),
    ]);
    if (!dRes.ok || !sRes.ok) throw new Error("HTTP " + (dRes.ok ? sRes.status : dRes.status));
    const dash = await dRes.json();
    const state = await sRes.json();
    // solo repinta si los datos cambiaron de verdad (evita el parpadeo del doble render)
    const payload = JSON.stringify({ DASH: dash, STATE: state });
    if (payload !== lastPayload) {
      lastPayload = payload;
      DASH = dash; STATE = state;
      try { sessionStorage.setItem("os_cache_v1", payload); } catch (e) {}
      render();
    }
    setSync(true, "");
  } catch (e) {
    setSync(false, "Error de conexión: " + e.message);
  }
}

function render() {
  const d = DASH;
  $("saludo").textContent = saludo();
  $("fechaHoy").textContent = "Así va tu día · " +
    new Date(d.fecha + "T12:00").toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" });

  // KPIs
  setScoreDisplays(d.hoy.score);
  $("kRacha").textContent = d.racha + (d.racha === 1 ? " día" : " días");
  $("kMedia").textContent = d.media7 !== null ? d.media7 : "–";
  $("kRitmo").textContent = d.pendiente !== null ? (d.pendiente >= 0 ? "+" : "") + d.pendiente + "%" : "–";

  renderSenales(d);
  renderScoreChart();
  renderAcumChart();
  renderJournal(STATE.journal || []);
}

/* ---------- animaciones de puntos ---------- */
let SCORE_SHOWN = null;

// odómetro: construye los dígitos (cada uno es una tira 0-9 desplazada)
function buildOdo(el, val) {
  if (val === null || val === undefined) { el.textContent = "–"; return; }
  el.innerHTML = `<span class="odo">${[...String(val)].map((d) =>
    `<span class="digit"><span class="strip" style="transform:translateY(-${Number(d) * 1.15}em)">` +
    "0123456789".split("").map((x) => `<span>${x}</span>`).join("") +
    `</span></span>`).join("")}</span>`;
}
function rollOdo(el, val) {
  const s = String(val);
  const strips = el.querySelectorAll(".strip");
  if (strips.length !== s.length) return buildOdo(el, val);
  strips.forEach((st, i) => { st.style.transform = `translateY(-${Number(s[i]) * 1.15}em)`; });
}

// pinta el score en el KPI y en el número grande del chart; si cambió, ruedan los dígitos
function setScoreDisplays(sc) {
  const els = [$("kScoreN"), $("scoreBigN")];
  if (sc !== null && SCORE_SHOWN !== null && sc !== SCORE_SHOWN) {
    const len = Math.max(String(sc).length, String(SCORE_SHOWN).length);
    const from = String(SCORE_SHOWN).padStart(len, "0");
    const to = String(sc).padStart(len, "0");
    for (const el of els) {
      buildOdo(el, from);   // arranca en el valor anterior…
      void el.offsetWidth;
      rollOdo(el, to);      // …y rueda hasta el nuevo
    }
    if (String(sc).length !== len) setTimeout(() => els.forEach((el) => buildOdo(el, sc)), 620);
  } else {
    for (const el of els) buildOdo(el, sc);
  }
  SCORE_SHOWN = sc;
}

// check que se dibuja a trazo (misma geometría que el check de Tabler)
const CHECK_DRAW = `<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" style="stroke-dasharray:1" d="M5 12l5 5l10 -10"/></svg>`;
// secuencia al marcar: el disco crece con muelle (CSS) y el ✓ se dibuja encima
function drawCheck(m) {
  m.insertAdjacentHTML("beforeend", CHECK_DRAW);
  m.querySelector("path").animate(
    [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
    { duration: 300, delay: 150, easing: "cubic-bezier(.4,0,.2,1)", fill: "both" }
  );
}

// "+25 pts" que vuela desde la señal
function flyPts(row, txt, positivo) {
  const f = document.createElement("span");
  f.className = "pts-fly" + (positivo ? "" : " neg");
  f.textContent = txt;
  row.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

/* ---------- señales ---------- */
function renderSenales(d) {
  if (senEdit) return; // el refresco automático no pisa el modo edición
  const box = $("senales");
  box.innerHTML = "";
  for (const s of d.config.senales) {
    const v = d.hoy.senales[s.id];
    const div = document.createElement("div");
    let cls = "senal", mark = `<span class="fill"></span>`;
    if (s.tipo === "horas") {
      // numéricas: input propio; el círculo se rellena solo al llegar al umbral
      const num = Number(v);
      const logged = v !== undefined && v !== null;
      const done = logged && Number.isFinite(num) && num >= (s.umbral || 0);
      if (done) { cls += " ok"; mark += CHECK_DRAW; }
      div.className = cls;
      div.innerHTML = `<span class="mark">${mark}</span><span class="lab">${s.label}</span>` +
        `<span class="hval"><input class="hin" type="number" inputmode="decimal" step="0.5" min="0" max="24" value="${logged ? num : ""}" placeholder="–" aria-label="${s.label}, horas"><span class="hum">/ ${s.umbral}h</span></span>`;
      const inp = div.querySelector(".hin");
      inp.onchange = () => {
        const raw = inp.value.trim();
        const value = raw === "" ? null : Number(raw.replace(",", "."));
        if (value !== null && !Number.isFinite(value)) return;
        // feedback inmediato: el disco se rellena solo si llegas al umbral
        const umbral = s.umbral || 1;
        const done = value !== null && value >= umbral;
        const m = div.querySelector(".mark");
        m.querySelector("svg")?.remove();
        div.classList.toggle("ok", done);
        if (done) drawCheck(m);
        if (value !== null) {
          const pts = Math.round(Math.min(value / umbral, 1) * s.peso);
          flyPts(div, (pts > 0 ? "+" : "") + pts + " pts", pts > 0);
        }
        saveSenal(s.id, value);
      };
      div.onclick = (e) => { if (e.target !== inp) inp.focus(); };
    } else if (s.tipo === "kcal") {
      // nutrición: NO se marca a mano, se deriva de las kcal del día (objetivo en config_nutricion)
      const obj = Number(d.kcal_obj) || 3500;
      const num = Number(d.hoy.kcal);
      const logged = Number.isFinite(num) && num > 0;
      const done = logged && num >= obj;
      if (done) { cls += " ok"; mark += CHECK_DRAW; }
      div.className = cls;
      div.innerHTML = `<span class="mark">${mark}</span><span class="lab">${s.label}</span>` +
        `<span class="hval"><input class="hin kin" type="number" inputmode="numeric" step="50" min="0" max="12000" value="${logged ? num : ""}" placeholder="–" aria-label="${s.label}, kcal del día"><span class="hum">/ ${obj.toLocaleString("es")}</span></span>`;
      const inp = div.querySelector(".hin");
      inp.onchange = () => {
        const raw = inp.value.trim();
        const value = raw === "" ? null : Math.round(Number(raw.replace(",", ".")));
        if (value !== null && !Number.isFinite(value)) return;
        const ok = value !== null && value >= obj;
        const m = div.querySelector(".mark");
        m.querySelector("svg")?.remove();
        div.classList.toggle("ok", ok);
        if (ok) drawCheck(m);
        if (value !== null) flyPts(div, (ok ? "+" : "") + (ok ? s.peso : 0) + " pts", ok);
        saveKcal(value);
      };
      div.onclick = (e) => { if (e.target !== inp) inp.focus(); };
    } else {
      if (v === true) { cls += " ok"; mark += CHECK_DRAW; }
      div.className = cls;
      div.innerHTML = `<span class="mark">${mark}</span><span class="lab">${s.label}</span><span class="val">${s.peso} pts</span>`;
      div.onclick = () => {
        const nuevo = v !== true;
        // optimista: relleno o vacío, el servidor confirma detrás
        const m = div.querySelector(".mark");
        m.querySelector("svg")?.remove();
        div.classList.toggle("ok", nuevo);
        if (nuevo) drawCheck(m);
        flyPts(div, (nuevo ? "+" : "−") + s.peso + " pts", nuevo);
        saveSenal(s.id, nuevo);
      };
    }
    div.title = (s.hint || s.label) + " · " + s.peso + " pts";
    box.appendChild(div);
  }
}

/* ---------- registrar un día pasado (rellena el score de días sin registro) ---------- */
let rdSen = {}, rdKcal = null;
const isoDia = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

function renderRdLista() {
  const box = $("rdLista");
  box.innerHTML = "";
  for (const s of STATE?.config?.senales || []) {
    const row = document.createElement("div");
    row.className = "rd-row";
    if (s.tipo === "horas") {
      const v = rdSen[s.id];
      row.innerHTML = `<span class="lab">${s.label}</span><input type="number" inputmode="decimal" step="any" value="${v ?? ""}" placeholder="—"><span class="um">/ ${s.umbral}h</span>`;
      row.style.cursor = "default";
      row.querySelector("input").oninput = (e) => {
        const n = Number(String(e.target.value).replace(",", "."));
        if (e.target.value === "" || !Number.isFinite(n)) delete rdSen[s.id];
        else rdSen[s.id] = n;
      };
    } else if (s.tipo === "kcal") {
      const obj = Number(STATE?.config_nutricion?.kcal_obj) || 3500;
      row.innerHTML = `<span class="lab">${s.label}</span><input type="number" inputmode="numeric" step="50" value="${rdKcal ?? ""}" placeholder="—"><span class="um">/ ${obj.toLocaleString("es")} kcal</span>`;
      row.style.cursor = "default";
      row.querySelector("input").oninput = (e) => {
        const n = Math.round(Number(String(e.target.value).replace(",", ".")));
        rdKcal = e.target.value === "" || !Number.isFinite(n) || n <= 0 ? null : n;
      };
    } else {
      row.classList.toggle("on", rdSen[s.id] === true);
      row.innerHTML = `<span class="rd-mark"></span><span class="lab">${s.label}</span>`;
      row.onclick = () => {
        rdSen[s.id] = !(rdSen[s.id] === true);
        row.classList.toggle("on", rdSen[s.id] === true);
      };
    }
    box.appendChild(row);
  }
}

function cargarRdDia(f) {
  const dia = (((STATE && STATE.days) || {})[f]) || {};
  rdSen = { ...(dia.senales || {}) };
  delete rdSen.nutricion; // derivada de las kcal, no se marca
  const k = Number(dia.kcal);
  rdKcal = Number.isFinite(k) && k > 0 ? Math.round(k) : null;
  renderRdLista();
}

$("btnRegDia").onclick = () => {
  const ayer = isoDia(new Date(Date.now() - 86400000));
  const inp = $("rdFecha");
  inp.dataset.iso = ayer;
  inp.value = ayer.split("-").reverse().join("/");
  cargarRdDia(ayer);
  $("diaOv").classList.add("show");
};
OSUI.initDate($("rdFecha"));
$("rdFecha").addEventListener("change", () => { if ($("rdFecha").dataset.iso) cargarRdDia($("rdFecha").dataset.iso); });
$("rdCancel").onclick = () => $("diaOv").classList.remove("show");
$("diaOv").onclick = (e) => { if (e.target === $("diaOv")) $("diaOv").classList.remove("show"); };
$("rdSave").onclick = async () => {
  const f = $("rdFecha").dataset.iso;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f || "")) return;
  $("diaOv").classList.remove("show");
  try {
    const res = await fetch("/api/day", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ fecha: f, senales: rdSen, kcal: rdKcal }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    load();
  } catch (e) {
    setSync(false, "No se guardó el día: " + e.message);
  }
};

/* ---------- modo edición de señales (⋯ de la sección: mover + editar, confirmar al final) ---------- */
let senEdit = false, workCfg = null;

async function fetchConfig() {
  const res = await fetch("/api/state", { credentials: "include" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return (await res.json()).config;
}

function syncSenHead() {
  $("senDots").hidden = senEdit;
  $("senCancelEdit").hidden = !senEdit;
  $("senConfirm").hidden = !senEdit;
}

function renderSenalesEdit() {
  const box = $("senales");
  box.classList.add("editing");
  box.innerHTML = "";
  for (const s of workCfg.senales || []) {
    const div = document.createElement("div");
    div.className = "senal edit";
    div.dataset.id = s.id;
    div.innerHTML =
      `<span class="grip">${OSIcons.grip}</span>` +
      `<span class="lab">${s.label}</span>` +
      `<span class="val">${s.peso} pts${s.tipo === "horas" ? " · ≥" + s.umbral + "h" : s.tipo === "kcal" ? " · ≥ objetivo kcal" : ""}</span>` +
      `<button class="pen" title="Editar">${OSIcons.editar}</button>`;
    div.querySelector(".pen").onclick = () => openEditSenal(s.id);
    initSenalDrag(div);
    box.appendChild(div);
  }
  const add = document.createElement("div");
  add.className = "senal add-habito";
  add.innerHTML = `${OSIcons.nueva}<span>Añadir hábito</span>`;
  add.onclick = () => openEditSenal(null);
  box.appendChild(add);
}

// Arrastre por INTERCAMBIO: coges un rectángulo (fantasma sigue al cursor, su sitio
// queda punteado), el rectángulo sobre el que estás se resalta, y al soltar se
// intercambian solo esos dos. El resto no se mueve.
function initSenalDrag(row) {
  row.onpointerdown = (e) => {
    if (e.target.closest(".pen")) return;
    e.preventDefault();
    const rect = row.getBoundingClientRect();
    const dx = e.clientX - rect.left, dy = e.clientY - rect.top;
    const ghost = row.cloneNode(true);
    ghost.classList.add("senal-ghost");
    ghost.style.width = rect.width + "px";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    document.body.appendChild(ghost);
    row.classList.add("hueco");
    let target = null;
    const move = (ev) => {
      ghost.style.left = (ev.clientX - dx) + "px";
      ghost.style.top = (ev.clientY - dy) + "px";
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const t = el && el.closest(".senal.edit");
      if (t !== target) {
        target?.classList.remove("drop-target");
        target = t && t !== row ? t : null;
        target?.classList.add("drop-target");
      }
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      ghost.remove();
      row.classList.remove("hueco");
      if (target) {
        target.classList.remove("drop-target");
        // intercambio 1↔1 en el DOM…
        const parent = row.parentElement;
        const marker = document.createElement("div");
        parent.insertBefore(marker, row);
        parent.insertBefore(row, target);
        parent.insertBefore(target, marker);
        marker.remove();
        // …y en workCfg
        const arr = workCfg.senales;
        const i = arr.findIndex((x) => x.id === row.dataset.id);
        const j = arr.findIndex((x) => x.id === target.dataset.id);
        if (i >= 0 && j >= 0) [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  };
}

$("senDots").innerHTML = OSIcons.dots;
$("senDots").onclick = (e) => {
  e.stopPropagation();
  const abierto = document.querySelector(".sec-menu");
  if (abierto) return abierto.remove();
  const menu = document.createElement("div");
  menu.className = "sec-menu";
  menu.innerHTML = `<button>${OSIcons.orden}Editar hábitos</button>`;
  menu.querySelector("button").onclick = async () => {
    menu.remove();
    try { workCfg = await fetchConfig(); } catch (e2) { return setSync(false, e2.message); }
    senEdit = true;
    syncSenHead();
    renderSenalesEdit();
  };
  $("senDots").parentElement.appendChild(menu);
};
document.addEventListener("click", (e) => {
  if (!e.target.closest(".sec-menu, .sec-dots")) document.querySelector(".sec-menu")?.remove();
});
function exitSenEdit() {
  senEdit = false; workCfg = null;
  syncSenHead();
  $("senales").classList.remove("editing");
  if (DASH) renderSenales(DASH);
}
$("senCancelEdit").onclick = exitSenEdit;
$("senConfirm").onclick = async () => {
  const cfg = workCfg;
  exitSenEdit();
  try {
    const res = await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ config: cfg }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    load();
  } catch (e) { setSync(false, "No se guardó: " + e.message); }
};

/* modal de edición: opera sobre workCfg, se persiste con Confirmar.
   editId = null → hábito nuevo */
let editId = null;
function syncUmbralVis() { $("seUmbralWrap").style.display = $("seTipo").value === "horas" ? "" : "none"; }
function openEditSenal(id) {
  const s = id === null ? null : (workCfg?.senales || []).find((x) => x.id === id);
  if (id !== null && !s) return;
  editId = id;
  $("seTitulo").textContent = s ? "Editar hábito" : "Nuevo hábito";
  $("seQuitar").hidden = !s;
  $("seLabel").value = s?.label || "";
  $("sePeso").value = s?.peso ?? 10;
  $("seTipo").value = s?.tipo === "horas" || s?.tipo === "kcal" ? s.tipo : "bool";
  $("seUmbral").value = s?.umbral ?? "";
  syncUmbralVis();
  resetQuitar();
  $("senalOv").classList.add("show");
  if (!s) $("seLabel").focus();
}
$("seTipo").onchange = syncUmbralVis;
$("seCancel").onclick = () => $("senalOv").classList.remove("show");
$("senalOv").onclick = (e) => { if (e.target === $("senalOv")) $("senalOv").classList.remove("show"); };

function slugHabito(label) {
  const base = label.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30) || "habito";
  const ids = new Set((workCfg?.senales || []).map((x) => x.id));
  if (!ids.has(base)) return base;
  let n = 2;
  while (ids.has(base + "_" + n)) n++;
  return base + "_" + n;
}

/* quitar con confirmación en dos toques (sin diálogos del navegador) */
let quitarArmado = false;
function resetQuitar() { quitarArmado = false; $("seQuitar").textContent = "Quitar"; }
$("seQuitar").onclick = () => {
  if (editId === null || !workCfg) return;
  if (!quitarArmado) {
    quitarArmado = true;
    $("seQuitar").textContent = "¿Seguro? Toca otra vez";
    return;
  }
  workCfg.senales = (workCfg.senales || []).filter((x) => x.id !== editId);
  resetQuitar();
  $("senalOv").classList.remove("show");
  renderSenalesEdit();
};

$("seSave").onclick = () => {
  if (!workCfg) return;
  const label = $("seLabel").value.trim();
  const peso = Number($("sePeso").value);
  let s;
  if (editId === null) {
    if (!label) return $("seLabel").focus();
    s = { id: slugHabito(label), label, tipo: "bool", peso: 10 };
    workCfg.senales = workCfg.senales || [];
    workCfg.senales.push(s);
  } else {
    s = (workCfg.senales || []).find((x) => x.id === editId);
    if (!s) return;
    if (label) s.label = label;
  }
  if (Number.isFinite(peso) && peso >= 0) s.peso = peso;
  if ($("seTipo").value === "horas") {
    s.tipo = "horas";
    const u = Number($("seUmbral").value);
    if (Number.isFinite(u) && u > 0) s.umbral = u;
    else if (!s.umbral) s.umbral = 1;
  } else if ($("seTipo").value === "kcal") {
    s.tipo = "kcal"; // el objetivo vive en config_nutricion.kcal_obj (área Nutrición)
    delete s.umbral;
  } else {
    s.tipo = "bool";
    delete s.umbral;
  }
  $("senalOv").classList.remove("show");
  renderSenalesEdit();
};

async function saveKcal(value) {
  try {
    const res = await fetch("/api/day", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ kcal: value }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setTimeout(load, 650);
  } catch (e) {
    setSync(false, "No se guardó: " + e.message);
    lastPayload = "";
    load();
  }
}

async function saveSenal(id, value) {
  try {
    const res = await fetch("/api/day", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ senales: { [id]: value } }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    // el re-render llega tras la animación del +pts (el estado ya se ve correcto en optimista)
    setTimeout(load, 650);
  } catch (e) {
    setSync(false, "No se guardó: " + e.message);
    lastPayload = ""; // fuerza re-render para revertir el estado optimista
    load();
  }
}

/* ---------- charts (SVG a mano, curvas suaves) ---------- */
const CHART_H = 210, PAD_L = 40, PAD_R = 14, PAD_T = 14, PAD_B = 26;

function fmtFecha(iso) {
  const d = new Date(iso + "T12:00");
  return d.toLocaleDateString("es", { day: "numeric", month: "short" });
}

// curva suave MONÓTONA (Fritsch–Carlson): nunca rebasa los valores de los datos,
// así en los codos no se hunde por debajo (el catmull-rom anterior hacía overshoot)
function smoothPath(pts) {
  if (pts.length < 2) return pts.map((p) => `M${p.x},${p.y}`).join("");
  if (pts.length === 2) return `M${pts[0].x},${pts[0].y}L${pts[1].x},${pts[1].y}`;
  const n = pts.length;
  const dx = [], dy = [], m = [];
  for (let i = 0; i < n - 1; i++) {
    dx.push(pts[i + 1].x - pts[i].x);
    dy.push(pts[i + 1].y - pts[i].y);
    m.push(dy[i] / (dx[i] || 1));
  }
  // tangentes que respetan la monotonía
  const t = [m[0]];
  for (let i = 1; i < n - 1; i++) {
    if (m[i - 1] * m[i] <= 0) t.push(0);
    else {
      const w1 = 2 * dx[i] + dx[i - 1], w2 = dx[i] + 2 * dx[i - 1];
      t.push((w1 + w2) / (w1 / m[i - 1] + w2 / m[i]));
    }
  }
  t.push(m[n - 2]);
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    const c1x = pts[i].x + h, c1y = pts[i].y + t[i] * h;
    const c2x = pts[i + 1].x - h, c2y = pts[i + 1].y - t[i + 1] * h;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${pts[i + 1].x.toFixed(1)},${pts[i + 1].y.toFixed(1)}`;
  }
  return d;
}

function makeChart(container, points, opts) {
  const W = Math.max(container.clientWidth || 700, 320);
  const H = CHART_H;
  const iw = W - PAD_L - PAD_R, ih = H - PAD_T - PAD_B;
  const n = points.length;
  const yMax = opts.yMax, yMin = opts.yMin ?? 0;
  const x = (i) => PAD_L + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = (v) => PAD_T + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;

  for (const t of opts.ticks) {
    const yy = y(t);
    svg += `<line x1="${PAD_L}" y1="${yy}" x2="${W - PAD_R}" y2="${yy}" stroke="var(--grid)" stroke-width="1" ${t === yMin ? "" : 'stroke-dasharray="4 6"'}/>`;
    svg += `<text x="${PAD_L - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-variant-numeric="tabular-nums">${opts.fmtTick ? opts.fmtTick(t) : t}</text>`;
  }

  const xticks = n > 2 ? [0, Math.floor((n - 1) / 2), n - 1] : n === 2 ? [0, 1] : [0];
  for (const i of xticks) {
    svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="10" fill="var(--ink-3)">${fmtFecha(points[i].fecha)}</text>`;
  }

  // segmentos contiguos (los días sin registrar parten la curva)
  const segs = [];
  let cur = [];
  points.forEach((pt, i) => {
    if (pt.y === null || pt.y === undefined) { if (cur.length) segs.push(cur); cur = []; return; }
    cur.push({ x: x(i), y: y(pt.y) });
  });
  if (cur.length) segs.push(cur);

  for (const seg of segs) {
    const line = smoothPath(seg);
    const area = line + `L${seg[seg.length - 1].x},${y(yMin)}L${seg[0].x},${y(yMin)}Z`;
    svg += `<path d="${area}" fill="${opts.color}" opacity="0.08"/>`;
    svg += `<path d="${line}" fill="none" stroke="${opts.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  if (opts.dots) {
    points.forEach((pt, i) => {
      if (pt.y === null || pt.y === undefined) return;
      svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(pt.y).toFixed(1)}" r="3.5" fill="${opts.color}" stroke="var(--surface)" stroke-width="2"/>`;
    });
  }

  svg += `<line id="xh" x1="0" y1="${PAD_T}" x2="0" y2="${PAD_T + ih}" stroke="${opts.color}" stroke-width="1" stroke-dasharray="3 5" opacity="0" pointer-events="none"/>`;
  svg += `<circle id="hdot" r="5" fill="${opts.color}" stroke="var(--surface)" stroke-width="2.5" opacity="0" pointer-events="none"/>`;
  svg += `<rect x="${PAD_L}" y="${PAD_T}" width="${iw}" height="${ih}" fill="transparent"/>`;
  svg += `</svg>`;

  container.innerHTML = svg + `<div class="tooltip"></div>`;

  const svgEl = container.querySelector("svg");
  const tip = container.querySelector(".tooltip");
  const xhair = svgEl.querySelector("#xh");
  const hdot = svgEl.querySelector("#hdot");

  function onMove(ev) {
    const rect = svgEl.getBoundingClientRect();
    const scale = W / rect.width;
    const mx = (ev.clientX - rect.left) * scale;
    let i = Math.round(((mx - PAD_L) / iw) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const pt = points[i];
    const px = x(i);
    xhair.setAttribute("x1", px); xhair.setAttribute("x2", px);
    xhair.setAttribute("opacity", "0.45");
    let pyCss = null;
    if (pt.y !== null && pt.y !== undefined) {
      hdot.setAttribute("cx", px); hdot.setAttribute("cy", y(pt.y));
      hdot.setAttribute("opacity", "1");
      pyCss = y(pt.y) / scale;
    } else {
      hdot.setAttribute("opacity", "0");
    }
    tip.innerHTML = opts.tooltip(pt);
    tip.style.display = "block";
    const tipW = tip.offsetWidth, tipH = tip.offsetHeight;
    let left = (px / scale) - tipW / 2;
    left = Math.max(4, Math.min(rect.width - tipW - 4, left));
    tip.style.left = left + "px";
    tip.style.top = (pyCss !== null ? Math.max(0, pyCss - tipH - 14) : 0) + "px";
  }
  function onLeave() {
    tip.style.display = "none";
    xhair.setAttribute("opacity", "0");
    hdot.setAttribute("opacity", "0");
  }
  svgEl.addEventListener("mousemove", onMove);
  svgEl.addEventListener("mouseleave", onLeave);
  // la selección/lupa de iOS la mata el CSS (user-select/touch-callout none); el scroll vertical sigue nativo (touch-action pan-y)
  svgEl.addEventListener("touchstart", (e) => onMove(e.touches[0]), { passive: true });
  svgEl.addEventListener("touchmove", (e) => { if (e.cancelable) e.preventDefault(); onMove(e.touches[0]); }, { passive: false });
  svgEl.addEventListener("touchend", onLeave);
  svgEl.addEventListener("touchcancel", onLeave);
  svgEl.addEventListener("contextmenu", (e) => e.preventDefault()); // long-press en Android
}

function renderScoreChart() {
  const full = DASH.serie;
  const serie = RANGE > 0 ? full.slice(-RANGE) : full;
  const logged = serie.filter((p) => p.score !== null).length;

  // cabecera: score de hoy grande + delta media 7d vs 7 anteriores
  if (DASH.hoy.score === null) $("scoreBigN").textContent = DASH.media7 ?? "–";
  const last7 = full.slice(-7).filter((p) => p.score !== null);
  const prev7 = full.slice(-14, -7).filter((p) => p.score !== null);
  const pill = $("scorePill");
  if (last7.length && prev7.length) {
    const a = last7.reduce((s, p) => s + p.score, 0) / last7.length;
    const b = prev7.reduce((s, p) => s + p.score, 0) / prev7.length;
    const delta = Math.round(a - b);
    pill.style.display = "";
    pill.className = "pill" + (delta < 0 ? " down" : "");
    pill.textContent = (delta >= 0 ? "↑ +" : "↓ ") + delta + " vs semana anterior";
  } else {
    pill.style.display = "none";
  }

  $("subScore").textContent = logged
    ? `${logged} ${logged === 1 ? "día registrado" : "días registrados"} de ${serie.length}`
    : "Sin días registrados todavía — cuéntale tu día al chat";

  makeChart($("chartScore"), serie.map((p) => ({ fecha: p.fecha, y: p.score, resumen: p.resumen })), {
    color: "var(--serie-1)",
    yMax: 100, yMin: 0,
    ticks: [0, 50, 100],
    dots: serie.length <= 45,
    // solo fecha y score: el resumen del día hacía crecer el tooltip a lo ancho y desbordaba en móvil
    tooltip: (pt) => pt.y === null
      ? `<b>${fmtFecha(pt.fecha)}</b> · sin registrar`
      : `<b>${fmtFecha(pt.fecha)}</b> · score <b>${pt.y}</b>`,
  });
}

function renderAcumChart() {
  const d = DASH;
  const serie = d.serie;
  const total = serie.length ? serie[serie.length - 1].acumulado : 0;
  $("acumBig").childNodes[0].nodeValue = total.toLocaleString("es") + " ";
  const pill = $("acumPill");
  if (d.pendiente !== null) {
    pill.style.display = "";
    pill.className = "pill" + (d.pendiente < 0 ? " down" : "");
    pill.textContent = (d.pendiente >= 0 ? "↑ +" : "↓ ") + d.pendiente + "% de ritmo";
  } else {
    pill.style.display = "none";
  }
  $("subAcum").textContent = d.pendiente === null
    ? "Cada día suma su score. La pendiente es el crecimiento: días buenos = curva empinada."
    : `Últimos 30 días: ${d.last30} puntos · 30 anteriores: ${d.prev30}.`;

  const maxA = Math.max(...serie.map((p) => p.acumulado), 10);
  const tickStep = niceStep(maxA);
  const ticks = [];
  for (let t = 0; t <= maxA * 1.05; t += tickStep) ticks.push(t);
  makeChart($("chartAcum"), serie.map((p) => ({ fecha: p.fecha, y: p.acumulado })), {
    color: "var(--serie-2)",
    yMax: Math.max(maxA * 1.05, tickStep), yMin: 0,
    ticks,
    dots: false,
    tooltip: (pt) => `<b>${fmtFecha(pt.fecha)}</b> · acumulado <b>${pt.y}</b>`,
  });
}

function niceStep(max) {
  const raw = max / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  for (const m of [1, 2, 5, 10]) if (raw <= m * pow) return m * pow;
  return 10 * pow;
}

/* ---------- journal ---------- */
function renderJournal(journal) {
  const box = $("journal");
  const last = journal.slice(-8).reverse();
  if (!last.length) {
    box.innerHTML = `<div class="empty-note">Aquí saldrán los apuntes que el chat vaya guardando de lo que le cuentes.</div>`;
    return;
  }
  box.innerHTML = "";
  for (const e of last) {
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `<span class="f">${e.fecha}</span><span class="a">${e.area || "general"}</span><span class="t"></span>`;
    div.querySelector(".t").textContent = e.texto;
    box.appendChild(div);
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.querySelectorAll("#rangeToggles button").forEach((b) => {
  b.onclick = () => {
    RANGE = Number(b.dataset.r);
    document.querySelectorAll("#rangeToggles button").forEach((x) => x.classList.toggle("active", x === b));
    if (DASH) renderScoreChart();
  };
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (DASH) render(); }, 250); // repinta directo: los charts dependen del ancho
});

// stale-while-revalidate: pinta al instante con lo último conocido y refresca detrás
try {
  const raw = sessionStorage.getItem("os_cache_v1");
  const cached = JSON.parse(raw || "null");
  if (cached?.DASH && cached?.STATE) { DASH = cached.DASH; STATE = cached.STATE; lastPayload = raw; render(); }
} catch (e) {}
load();
setInterval(load, 60000);
</script>
